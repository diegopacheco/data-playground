<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Caveat, 'Comic Sans MS', cursive">
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');</style>
<filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker>
</defs>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="500" y="38" text-anchor="middle" font-size="30" font-weight="700" fill="#1d2433">pg-lake-postgres-iceberg</text>

<g filter="url(#wobble)" stroke="#343a40" stroke-width="2">
<rect x="30" y="80" width="170" height="80" rx="12" fill="#fff3bf"/>
<rect x="30" y="220" width="170" height="110" rx="12" fill="#e7f5ff"/>
<rect x="30" y="400" width="170" height="90" rx="12" fill="#f1f3f5"/>
<rect x="270" y="70" width="450" height="440" rx="16" fill="#f8f9fa" stroke-dasharray="8 6"/>
<rect x="300" y="120" width="200" height="120" rx="12" fill="#d3f9d8"/>
<rect x="300" y="270" width="200" height="120" rx="12" fill="#d0ebff"/>
<rect x="550" y="120" width="150" height="270" rx="12" fill="#e5dbff"/>
<rect x="300" y="415" width="400" height="70" rx="12" fill="#ffe8cc"/>
<rect x="780" y="120" width="190" height="370" rx="14" fill="#fff0f6"/>
</g>

<g fill="#1d2433">
<text x="115" y="112" text-anchor="middle" font-size="24" font-weight="700">Browser UI</text>
<text x="115" y="140" text-anchor="middle" font-size="18">Pipeline, Lake files, Queries</text>
<text x="115" y="252" text-anchor="middle" font-size="24" font-weight="700">r11-app</text>
<text x="115" y="278" text-anchor="middle" font-size="18">Python 3.14 REST API</text>
<text x="115" y="300" text-anchor="middle" font-size="18">psycopg 3 + S3 SigV4</text>
<text x="115" y="320" text-anchor="middle" font-size="16">http.server</text>
<text x="115" y="432" text-anchor="middle" font-size="24" font-weight="700">data/*.csv</text>
<text x="115" y="458" text-anchor="middle" font-size="17">customers + 2 batches</text>
<text x="115" y="478" text-anchor="middle" font-size="16">seeded generator</text>

<text x="490" y="100" text-anchor="middle" font-size="24" font-weight="700">r11-pglake container</text>
<text x="400" y="150" text-anchor="middle" font-size="22" font-weight="700">Postgres 18.6</text>
<text x="400" y="176" text-anchor="middle" font-size="18">heap: customers</text>
<text x="400" y="198" text-anchor="middle" font-size="18">heap: orders_landing</text>
<text x="400" y="222" text-anchor="middle" font-size="16">ACID catalog of Iceberg</text>
<text x="400" y="300" text-anchor="middle" font-size="22" font-weight="700">pg_lake 3.5.3</text>
<text x="400" y="326" text-anchor="middle" font-size="18">orders USING iceberg</text>
<text x="400" y="348" text-anchor="middle" font-size="18">raw_orders foreign (Parquet)</text>
<text x="400" y="372" text-anchor="middle" font-size="16">COPY TO s3 .parquet</text>
<text x="625" y="160" text-anchor="middle" font-size="22" font-weight="700">pgduck_server</text>
<text x="625" y="186" text-anchor="middle" font-size="18">DuckDB 1.5.5</text>
<text x="625" y="220" text-anchor="middle" font-size="17">vectorized scans</text>
<text x="625" y="242" text-anchor="middle" font-size="17">Parquet read/write</text>
<text x="625" y="264" text-anchor="middle" font-size="17">httpfs to S3</text>
<text x="625" y="300" text-anchor="middle" font-size="17">query pushdown</text>
<text x="625" y="322" text-anchor="middle" font-size="17">640 MB memory limit</text>
<text x="495" y="445" text-anchor="middle" font-size="20" font-weight="700">Iceberg metadata written by Postgres transactions</text>
<text x="495" y="470" text-anchor="middle" font-size="17">metadata.json, manifest lists, manifests (avro)</text>

<text x="875" y="155" text-anchor="middle" font-size="24" font-weight="700">r11-minio</text>
<text x="875" y="180" text-anchor="middle" font-size="18">bucket s3://lake</text>
<text x="875" y="230" text-anchor="middle" font-size="18">raw/orders/</text>
<text x="875" y="252" text-anchor="middle" font-size="17">batch-1.parquet</text>
<text x="875" y="272" text-anchor="middle" font-size="17">batch-2.parquet</text>
<text x="875" y="320" text-anchor="middle" font-size="18">iceberg/.../orders/</text>
<text x="875" y="342" text-anchor="middle" font-size="17">data/ order_date_month=</text>
<text x="875" y="364" text-anchor="middle" font-size="17">metadata/ *.json *.avro</text>
<text x="875" y="430" text-anchor="middle" font-size="16">independent listing</text>
<text x="875" y="450" text-anchor="middle" font-size="16">checked by the tests</text>
