<g stroke="#343a40" stroke-width="2.2" fill="none" marker-end="url(#arrow)" filter="url(#wobble)">
<path d="M115 160 L115 218"/>
<path d="M115 400 L115 332"/>
<path d="M200 260 C240 250 260 190 298 180"/>
<path d="M500 180 L548 180"/>
<path d="M500 330 L548 330"/>
<path d="M700 200 C740 200 745 250 778 250"/>
<path d="M700 330 C740 330 745 340 778 340"/>
<path d="M700 450 C740 450 750 420 778 410"/>
<path d="M200 310 L240 310 L240 530 L875 530 L875 494"/>
</g>
<g fill="#495057" font-size="16">
<text x="122" y="195">REST</text>
<text x="122" y="375">COPY FROM STDIN</text>
<text x="205" y="215">SQL (psycopg)</text>
<text x="525" y="260" text-anchor="middle">unix</text>
<text x="525" y="278" text-anchor="middle">socket</text>
<text x="748" y="292" text-anchor="middle">S3 API</text>
<text x="555" y="552" text-anchor="middle">ListObjectsV2 from the app and the tests to verify files landed</text>
