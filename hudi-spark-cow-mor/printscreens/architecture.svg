<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #2b2b2b; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="6" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#2b2b2b" stroke-width="2"/></marker>
  </defs>
  <rect width="1120" height="340" fill="#fffdf7"/>
  <g filter="url(#wobble)" stroke="#2b2b2b" stroke-width="2.2">
    <rect x="20" y="125" width="150" height="90" rx="10" fill="#fde2e4"/>
    <rect x="220" y="125" width="190" height="90" rx="10" fill="#fff1c1"/>
    <rect x="470" y="30" width="210" height="100" rx="10" fill="#dbe7ff"/>
    <rect x="470" y="210" width="210" height="100" rx="10" fill="#ffe3cc"/>
    <rect x="740" y="125" width="160" height="90" rx="10" fill="#d7f0dd"/>
    <rect x="950" y="125" width="150" height="90" rx="10" fill="#eadcf8"/>
    <path d="M170,170 L218,170" fill="none" marker-end="url(#arrow)"/>
    <path d="M410,155 L468,85" fill="none" marker-end="url(#arrow)"/>
    <path d="M410,185 L468,255" fill="none" marker-end="url(#arrow)"/>
    <path d="M680,85 L738,152" fill="none" marker-end="url(#arrow)"/>
    <path d="M680,255 L738,188" fill="none" marker-end="url(#arrow)"/>
    <path d="M900,170 L948,170" fill="none" marker-end="url(#arrow)"/>
  </g>
  <text x="95" y="165" font-size="26" text-anchor="middle" font-weight="700">orders.csv</text>
  <text x="95" y="193" font-size="20" text-anchor="middle">200 rows</text>
  <text x="315" y="160" font-size="26" text-anchor="middle" font-weight="700">Spark 4.1 bench</text>
  <text x="315" y="186" font-size="19" text-anchor="middle">Scala 3, 500k rows</text>
  <text x="315" y="206" font-size="19" text-anchor="middle">3 upserts of 10%</text>
  <text x="575" y="68" font-size="26" text-anchor="middle" font-weight="700">Hudi Copy-On-Write</text>
  <text x="575" y="96" font-size="19" text-anchor="middle">lake/orders_cow</text>
  <text x="575" y="118" font-size="17" text-anchor="middle">parquet rewritten per upsert</text>
  <text x="575" y="248" font-size="26" text-anchor="middle" font-weight="700">Hudi Merge-On-Read</text>
  <text x="575" y="276" font-size="19" text-anchor="middle">lake/orders_mor</text>
  <text x="575" y="298" font-size="17" text-anchor="middle">log files, then compaction</text>
  <text x="820" y="165" font-size="26" text-anchor="middle" font-weight="700">results.json</text>
  <text x="820" y="193" font-size="18" text-anchor="middle">timings, files, sizes</text>
  <text x="1025" y="165" font-size="26" text-anchor="middle" font-weight="700">UI container</text>
  <text x="1025" y="193" font-size="18" text-anchor="middle">GET /api/results</text>
</svg>
