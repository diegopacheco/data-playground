<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1e1e1e; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker>
  </defs>
  <rect width="1100" height="370" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1e1e1e" stroke-width="2">
    <rect x="20" y="10" width="95" height="60" rx="10" fill="#fff3bf"/>
    <rect x="125" y="10" width="95" height="60" rx="10" fill="#ffe8cc"/>
    <rect x="20" y="130" width="200" height="120" rx="12" fill="#d0ebff"/>
    <rect x="280" y="100" width="270" height="180" rx="12" fill="#e5dbff"/>
    <rect x="610" y="130" width="210" height="120" rx="12" fill="#c3fae8"/>
    <rect x="880" y="130" width="200" height="120" rx="12" fill="#ffd8e8"/>
    <rect x="880" y="10" width="200" height="60" rx="10" fill="#d3f9d8"/>
    <line x1="67" y1="70" x2="90" y2="128" marker-end="url(#arrow)"/>
    <line x1="172" y1="70" x2="150" y2="128" marker-end="url(#arrow)"/>
    <line x1="220" y1="190" x2="278" y2="190" marker-end="url(#arrow)"/>
    <line x1="550" y1="190" x2="608" y2="190" marker-end="url(#arrow)"/>
    <line x1="878" y1="190" x2="822" y2="190" marker-end="url(#arrow)"/>
    <line x1="980" y1="128" x2="980" y2="72" marker-end="url(#arrow)"/>
    <polyline points="120,250 120,320 1030,320 1030,252" fill="none" marker-end="url(#arrow)"/>
  </g>
  <text x="67" y="38" font-size="20" font-weight="700" text-anchor="middle">orders.csv</text>
  <text x="67" y="60" font-size="16" text-anchor="middle">200 rows</text>
  <text x="172" y="38" font-size="20" font-weight="700" text-anchor="middle">changes.sql</text>
  <text x="172" y="60" font-size="16" text-anchor="middle">ins / upd / del</text>
  <text x="120" y="165" font-size="26" font-weight="700" text-anchor="middle">Postgres 18</text>
  <text x="120" y="192" font-size="19" text-anchor="middle">wal_level=logical</text>
  <text x="120" y="216" font-size="19" text-anchor="middle">pgoutput + slot</text>
  <text x="120" y="240" font-size="19" text-anchor="middle">table orders</text>
  <text x="415" y="132" font-size="26" font-weight="700" text-anchor="middle">Flink 2.2 streaming job</text>
  <text x="415" y="164" font-size="19" text-anchor="middle">postgres-cdc source (CDC 3.6)</text>
  <text x="415" y="190" font-size="19" text-anchor="middle">snapshot, then WAL changelog</text>
  <text x="415" y="216" font-size="19" text-anchor="middle">INSERT INTO lake.shop.orders</text>
  <text x="415" y="242" font-size="19" text-anchor="middle">Iceberg sink, upsert mode</text>
  <text x="415" y="266" font-size="19" text-anchor="middle">commit per checkpoint (3s)</text>
  <text x="715" y="165" font-size="26" font-weight="700" text-anchor="middle">Iceberg 1.11</text>
  <text x="715" y="192" font-size="19" text-anchor="middle">hadoop catalog, v2 table</text>
  <text x="715" y="216" font-size="19" text-anchor="middle">parquet data files</text>
  <text x="715" y="240" font-size="19" text-anchor="middle">+ equality deletes</text>
  <text x="980" y="165" font-size="26" font-weight="700" text-anchor="middle">UiServer</text>
  <text x="980" y="192" font-size="19" text-anchor="middle">Flink batch SQL read</text>
  <text x="980" y="216" font-size="19" text-anchor="middle">GET /api/compare</text>
  <text x="980" y="240" font-size="19" text-anchor="middle">POST /api/changes</text>
  <text x="980" y="46" font-size="24" font-weight="700" text-anchor="middle">Browser</text>
  <text x="575" y="346" font-size="20" text-anchor="middle">JDBC: Postgres aggregates and rows for the side by side check</text>
</svg>
