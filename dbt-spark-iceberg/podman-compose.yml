name: i39-dbt-spark-iceberg

services:
  thrift:
    image: docker.io/apache/spark:4.1.3-scala2.13-java21-ubuntu
    container_name: i39-thrift
    user: root
    environment:
      SPARK_NO_DAEMONIZE: "true"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        mkdir -p /warehouse/iceberg/default &&
        exec /opt/spark/sbin/start-thriftserver.sh
        --master local[2]
        --driver-memory 768m
        --conf spark.driver.extraClassPath=/opt/iceberg/iceberg-spark-runtime-4.1_2.13-1.11.0.jar
        --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
        --conf spark.sql.catalog.lake=org.apache.iceberg.spark.SparkCatalog
        --conf spark.sql.catalog.lake.type=hadoop
        --conf spark.sql.catalog.lake.warehouse=/warehouse/iceberg
        --conf spark.sql.defaultCatalog=lake
        --conf spark.sql.warehouse.dir=/warehouse/spark
        --conf spark.driver.extraJavaOptions=-Dderby.system.home=/warehouse/derby
        --conf spark.sql.shuffle.partitions=4
        --conf spark.ui.port=4040
        --hiveconf hive.server2.thrift.port=10000
        --hiveconf hive.server2.thrift.bind.host=0.0.0.0
    ports:
      - "23900:10000"
      - "23901:4040"
    volumes:
      - ./jars:/opt/iceberg:ro
      - i39-warehouse:/warehouse
    networks:
      - i39-net

volumes:
  i39-warehouse:
    name: i39-warehouse

networks:
  i39-net:
    name: i39-net
