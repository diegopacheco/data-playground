version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: amount
        data_tests: [not_null]
  - name: fct_orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: [books, clothing, electronics, home, sports, toys]
  - name: revenue_by_category
    columns:
      - name: category
        data_tests: [not_null, unique]
      - name: total_revenue
        data_tests: [not_null]
