services:
  i32-druid:
    image: docker.io/apache/druid:37.0.0
    container_name: i32-druid
    platform: linux/amd64
    working_dir: /opt/druid
    entrypoint: ["/bin/bash", "/launch/launch.sh"]
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -XX:CICompilerCount=1 -Xss512k"
    ports:
      - "${broker:-23200}:8082"
      - "${overlord:-23202}:8081"
    volumes:
      - ./data:/data:ro
      - ./druid:/launch:ro
    networks:
      - i32-net

  i32-ui:
    build:
      context: .
      dockerfile: Containerfile
    image: i32-druid-rollup-ui:latest
    container_name: i32-ui
    environment:
      DRUID_URL: http://i32-druid:8082
      UI_PORT: "${ui:-23201}"
    ports:
      - "${ui:-23201}:${ui:-23201}"
    networks:
      - i32-net
    depends_on:
      - i32-druid

networks:
  i32-net:
    name: i32-net
