<text x="110" y="80" text-anchor="middle" class="t">browser</text>
<text x="110" y="106" text-anchor="middle" class="s">index.html</text>
<text x="390" y="62" text-anchor="middle" class="t">app/server.py</text>
<text x="390" y="88" text-anchor="middle" class="s">runs one SQL text as 5 users</text>
<text x="390" y="112" text-anchor="middle" class="s">Python 3.14, standard library</text>
<text x="110" y="282" text-anchor="middle" class="t">X-Trino-User</text>
<text x="110" y="312" text-anchor="middle" class="s">alice: admin</text>
<text x="110" y="336" text-anchor="middle" class="s">bruno: analyst</text>
<text x="110" y="360" text-anchor="middle" class="s">rita: regional BR</text>
<text x="110" y="384" text-anchor="middle" class="s">sam: support</text>
<text x="110" y="408" text-anchor="middle" class="s">mallory: unknown</text>
<text x="110" y="434" text-anchor="middle" class="l">no password</text>
<text x="390" y="282" text-anchor="middle" class="t">s5-trino 483</text>
<text x="390" y="310" text-anchor="middle" class="s">access-control.name=opa</text>
<text x="390" y="336" text-anchor="middle" class="s">applies masks and row filters</text>
<text x="390" y="362" text-anchor="middle" class="s">before the query runs</text>
<text x="390" y="394" text-anchor="middle" class="s">catalog postgres (PostgreSQL)</text>
<text x="390" y="418" text-anchor="middle" class="s">catalog scratch (memory)</text>
<text x="735" y="62" text-anchor="middle" class="t">s5-opa 1.21.2</text>
<text x="735" y="90" text-anchor="middle" class="s">package trino</text>
<text x="735" y="116" text-anchor="middle" class="s">allow</text>
<text x="735" y="140" text-anchor="middle" class="s">rowFilters</text>
<text x="735" y="164" text-anchor="middle" class="s">batchColumnMasks</text>
<text x="735" y="190" text-anchor="middle" class="s">data.pii: users, roles</text>
<text x="735" y="214" text-anchor="middle" class="l">decision log on console</text>
<text x="1005" y="62" text-anchor="middle" class="t">opa/policy</text>
<text x="1005" y="90" text-anchor="middle" class="s">trino.rego</text>
<text x="1005" y="114" text-anchor="middle" class="s">pii/data.json</text>
<text x="1005" y="160" text-anchor="middle" class="s">reload-policy.sh</text>
<text x="1005" y="184" text-anchor="middle" class="l">PUT /v1/policies</text>
<text x="1005" y="206" text-anchor="middle" class="l">PUT /v1/data/pii</text>
<text x="735" y="352" text-anchor="middle" class="t">s5-postgres 18.6</text>
<text x="735" y="380" text-anchor="middle" class="s">customers (40 rows, raw PII)</text>
<text x="735" y="406" text-anchor="middle" class="s">orders (120 rows)</text>
<text x="735" y="434" text-anchor="middle" class="l">never masked at rest</text>
<text x="228" y="74" text-anchor="middle" class="l">/api</text>
<text x="398" y="198" class="l">POST /v1/statement</text>
<text x="563" y="56" text-anchor="middle" class="l">decision log</text>
<text x="563" y="92" text-anchor="middle" class="l">PUT data</text>
<text x="578" y="275" class="l">every check</text>
<text x="563" y="380" text-anchor="middle" class="l">JDBC</text>
