<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
    text { font-family: 'Caveat', cursive; fill: #1d2127; }
    .title { font-size: 30px; font-weight: 700; }
    .line { font-size: 22px; }
    .label { font-size: 21px; fill: #3d4a5c; }
    .box { stroke: #2b3440; stroke-width: 2.4; filter: url(#wobble); }
    .arrow { fill: none; stroke: #2b3440; stroke-width: 2.4; filter: url(#wobble); marker-end: url(#head); }
  </style>
  <defs>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="640"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b3440"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#fdfcf8"/>

  <rect class="box" x="40" y="50" width="250" height="110" rx="14" fill="#fde7c8"/>
  <text class="title" x="60" y="92">macOS Electron app</text>
  <text class="line" x="60" y="122">boot screen, one instance</text>
  <text class="line" x="60" y="146">shortcuts, window memory</text>

  <rect class="box" x="470" y="50" width="280" height="110" rx="14" fill="#dbeafe"/>
  <text class="title" x="490" y="92">React + Monaco UI</text>
  <text class="line" x="490" y="122">Vite dev server :5178</text>
  <text class="line" x="490" y="146">4 tabs, autocomplete</text>

  <rect class="box" x="40" y="300" width="250" height="110" rx="14" fill="#e9e3f7"/>
  <text class="title" x="60" y="342">scripts/</text>
  <text class="line" x="60" y="372">start-all.sh, stop-all.sh</text>
  <text class="line" x="60" y="396">ports.env</text>

  <rect class="box" x="470" y="280" width="280" height="160" rx="14" fill="#dcf2e3"/>
  <text class="title" x="490" y="320">Node API :8095</text>
  <text class="line" x="490" y="350">query runner + EXPLAIN</text>
  <text class="line" x="490" y="376">hint engine</text>
  <text class="line" x="490" y="402">race runner, 20 sessions</text>
  <text class="line" x="490" y="428">catalog + seeder</text>

  <rect class="box" x="900" y="280" width="260" height="160" rx="14" fill="#cfe3f5"/>
  <text class="title" x="920" y="320">PostgreSQL 18.6</text>
  <text class="line" x="920" y="350">podman :55432</text>
  <text class="line" x="920" y="376">shop: 5M order lines</text>
  <text class="line" x="920" y="402">8 problem schemas</text>

  <rect class="box" x="900" y="520" width="260" height="80" rx="14" fill="#f6f1c7"/>
  <text class="title" x="920" y="556">tmp/pgdata</text>
  <text class="line" x="920" y="584">data kept between restarts</text>

  <rect class="box" x="470" y="520" width="280" height="80" rx="14" fill="#f8dfe3"/>
  <text class="title" x="490" y="556">problems/ + seed/</text>
  <text class="line" x="490" y="584">plain SQL files</text>

  <path class="arrow" d="M290 105 L462 105"/>
  <text class="label" x="330" y="94">loads</text>

  <path class="arrow" d="M165 160 L165 292"/>
  <text class="label" x="176" y="232">runs</text>

  <path class="arrow" d="M290 355 L462 355"/>
  <text class="label" x="330" y="344">starts</text>

  <path class="arrow" d="M610 160 L610 272"/>
  <text class="label" x="620" y="222">/api proxy</text>

  <path class="arrow" d="M750 360 L892 360"/>
  <text class="label" x="782" y="348">SQL</text>

  <path class="arrow" d="M40 330 L22 330 L22 26 L1030 26 L1030 272"/>
  <text class="label" x="820" y="18">podman-compose up</text>

  <path class="arrow" d="M1030 440 L1030 512"/>
  <text class="label" x="1042" y="484">bind mount</text>

  <path class="arrow" d="M610 520 L610 448"/>
  <text class="label" x="620" y="490">reads</text>
</svg>
