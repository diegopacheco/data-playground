services:
  postgres:
    image: docker.io/library/postgres:18.6
    container_name: sql-playground-postgres
    environment:
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: playground
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./tmp/pgdata:/var/lib/postgresql:Z
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - track_io_timing=on
      - -c
      - max_connections=200
