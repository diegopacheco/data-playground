    <rect x="970" y="480" width="210" height="60" rx="10" fill="#c3fae8"/>
    <rect x="20" y="350" width="410" height="190" rx="14" fill="#f1f3f5" stroke-dasharray="8 6"/>
    <line x1="200" y1="205" x2="238" y2="205" marker-end="url(#arrow)"/>
    <line x1="430" y1="205" x2="468" y2="205" marker-end="url(#arrow)"/>
    <line x1="670" y1="170" x2="708" y2="140" marker-end="url(#arrow)"/>
    <line x1="670" y1="240" x2="708" y2="265" marker-end="url(#arrow)"/>
    <line x1="930" y1="140" x2="968" y2="175" marker-end="url(#arrow)"/>
    <line x1="930" y1="265" x2="968" y2="230" marker-end="url(#arrow)"/>
    <line x1="570" y1="290" x2="570" y2="348" marker-end="url(#arrow)"/>
    <line x1="670" y1="405" x2="708" y2="405" marker-end="url(#arrow)"/>
    <line x1="930" y1="405" x2="968" y2="395" marker-end="url(#arrow)"/>
    <line x1="1075" y1="270" x2="1075" y2="338" marker-end="url(#arrow)"/>
    <line x1="1075" y1="440" x2="1075" y2="478" marker-end="url(#arrow)"/>
  </g>
  <text x="600" y="40" font-size="32" font-weight="700" text-anchor="middle">nimble-vs-parquet</text>
  <text x="600" y="68" font-size="19" text-anchor="middle">same seeded tables, Nimble (C++) vs Parquet (pyarrow), every result checked</text>
  <text x="110" y="160" font-size="24" text-anchor="middle">dataset.py</text>
  <text x="110" y="185" font-size="17" text-anchor="middle">numpy, fixed seeds</text>
  <text x="110" y="207" font-size="17" text-anchor="middle">wide 10k x 4,000</text>
  <text x="110" y="229" font-size="17" text-anchor="middle">normal 1M x 8</text>
  <text x="110" y="251" font-size="17" text-anchor="middle">sweep 100..10,000 cols</text>
  <text x="335" y="160" font-size="24" text-anchor="middle">source files</text>
  <text x="335" y="185" font-size="17" text-anchor="middle">raw column files</text>
  <text x="335" y="207" font-size="17" text-anchor="middle">schema.txt + cN.bin</text>
  <text x="335" y="229" font-size="17" text-anchor="middle">+ source.arrow</text>
  <text x="335" y="251" font-size="17" text-anchor="middle">same bytes for both</text>
  <text x="570" y="150" font-size="24" text-anchor="middle">bench.py</text>
  <text x="570" y="175" font-size="17" text-anchor="middle">container t9-bench</text>
  <text x="570" y="197" font-size="17" text-anchor="middle">fresh process per step</text>
  <text x="570" y="219" font-size="17" text-anchor="middle">write, scan, projection,</text>
  <text x="570" y="241" font-size="17" text-anchor="middle">metadata read</text>
  <text x="570" y="263" font-size="17" text-anchor="middle">1 cold + 5 warm runs</text>
  <text x="820" y="110" font-size="24" text-anchor="middle">nimble_bench (C++)</text>
  <text x="820" y="135" font-size="17" text-anchor="middle">Nimble VeloxWriter</text>
  <text x="820" y="157" font-size="17" text-anchor="middle">VeloxReader + ColumnSelector</text>
  <text x="820" y="179" font-size="17" text-anchor="middle">TabletReader footer</text>
  <text x="820" y="250" font-size="24" text-anchor="middle">pyarrow 26</text>
  <text x="820" y="275" font-size="17" text-anchor="middle">pq.write_table snappy / zstd</text>
  <text x="820" y="297" font-size="17" text-anchor="middle">ParquetFile.read(columns)</text>
  <text x="1075" y="160" font-size="24" text-anchor="middle">t9-lake volume</text>
  <text x="1075" y="187" font-size="17" text-anchor="middle">wide/nimble.nimble</text>
  <text x="1075" y="209" font-size="17" text-anchor="middle">wide/parquet_*.parquet</text>
  <text x="1075" y="231" font-size="17" text-anchor="middle">normal/...</text>
  <text x="1075" y="253" font-size="17" text-anchor="middle">source/ for live checks</text>
  <text x="570" y="380" font-size="24" text-anchor="middle">verify</text>
  <text x="570" y="405" font-size="17" text-anchor="middle">column checksums</text>
  <text x="570" y="427" font-size="17" text-anchor="middle">Nimble dump byte equal</text>
  <text x="570" y="449" font-size="17" text-anchor="middle">Parquet table equals</text>
  <text x="820" y="400" font-size="24" text-anchor="middle">results.json</text>
  <text x="820" y="424" font-size="17" text-anchor="middle">all runs + all checks</text>
  <text x="1075" y="370" font-size="24" text-anchor="middle">t9-ui server.py</text>
  <text x="1075" y="395" font-size="17" text-anchor="middle">stdlib http.server</text>
  <text x="1075" y="417" font-size="17" text-anchor="middle">live projection + metadata</text>
  <text x="1075" y="517" font-size="22" text-anchor="middle">browser, plain SVG</text>
  <text x="225" y="380" font-size="24" text-anchor="middle">image build (Containerfile)</text>
  <text x="225" y="410" font-size="17" text-anchor="middle">ubuntu jammy + clang 15 + cmake 3.31</text>
  <text x="225" y="434" font-size="17" text-anchor="middle">Nimble at a pinned commit + Velox submodule</text>
  <text x="225" y="458" font-size="17" text-anchor="middle">folly, boost, absl, protobuf built from source</text>
  <text x="225" y="482" font-size="17" text-anchor="middle">nimble_bench linked against them</text>
  <text x="225" y="506" font-size="17" text-anchor="middle">copied into python 3.14 slim + pyarrow</text>
</svg>
