<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="360" viewBox="0 0 1140 360">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1e1e1e; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker>
  </defs>
  <rect width="1140" height="360" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1e1e1e" stroke-width="2">
    <rect x="20" y="145" width="160" height="70" rx="12" fill="#fff3bf"/>
    <rect x="745" y="296" width="210" height="50" rx="12" fill="#fff3bf"/>
    <rect x="240" y="30" width="340" height="300" rx="14" fill="#d0ebff"/>
    <rect x="740" y="80" width="220" height="200" rx="14" fill="#d3f9d8"/>
    <rect x="1000" y="140" width="120" height="80" rx="12" fill="#ffd8e8"/>
    <line x1="180" y1="180" x2="238" y2="180" marker-end="url(#arrow)"/>
    <line x1="850" y1="296" x2="850" y2="282" marker-end="url(#arrow)"/>
    <line x1="582" y1="140" x2="738" y2="140" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="582" y1="245" x2="738" y2="245" marker-end="url(#arrow)"/>
    <line x1="960" y1="180" x2="998" y2="180" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="100" y="178" font-size="24" font-weight="700" text-anchor="middle">orders.csv</text>
  <text x="100" y="202" font-size="18" text-anchor="middle">200 rows</text>
  <text x="850" y="328" font-size="19" font-weight="700" text-anchor="middle">new_orders.csv (5 rows)</text>
  <text x="410" y="64" font-size="26" font-weight="700" text-anchor="middle">Java 25 Flight server</text>
  <text x="410" y="88" font-size="18" text-anchor="middle">podman container i13-flight-server</text>
  <text x="410" y="124" font-size="20" text-anchor="middle">OrderStore: VectorSchemaRoot batches</text>
  <text x="410" y="152" font-size="20" text-anchor="middle">Revenue: group by category on vectors</text>
  <text x="410" y="180" font-size="20" text-anchor="middle">BenchData: 1M rows, 16 batches</text>
  <text x="410" y="216" font-size="20" text-anchor="middle">FlightServer grpc :21300</text>
  <text x="410" y="244" font-size="20" text-anchor="middle">list_flights  get_flight_info</text>
  <text x="410" y="268" font-size="20" text-anchor="middle">do_get  do_put  do_action reset</text>
  <text x="410" y="304" font-size="20" text-anchor="middle">HttpServer :21301 /bench.csv</text>
  <text x="660" y="128" font-size="19" text-anchor="middle">Arrow IPC over gRPC</text>
  <text x="660" y="164" font-size="17" text-anchor="middle">tickets + batches</text>
  <text x="660" y="233" font-size="19" text-anchor="middle">plain HTTP CSV</text>
  <text x="660" y="269" font-size="17" text-anchor="middle">same 1M rows</text>
  <text x="850" y="116" font-size="24" font-weight="700" text-anchor="middle">Python 3.14</text>
  <text x="850" y="144" font-size="20" text-anchor="middle">pyarrow.flight client</text>
  <text x="850" y="172" font-size="20" text-anchor="middle">pyarrow.csv parser</text>
  <text x="850" y="200" font-size="20" text-anchor="middle">benchmark + cli.py</text>
  <text x="850" y="236" font-size="20" text-anchor="middle">app.py UI :21302</text>
  <text x="1060" y="176" font-size="24" font-weight="700" text-anchor="middle">Browser</text>
  <text x="1060" y="200" font-size="18" text-anchor="middle">index.html</text>
</svg>
