<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2933; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
  </defs>
  <rect width="1000" height="300" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1f2933" stroke-width="2">
    <rect x="20" y="100" width="150" height="80" rx="10" fill="#fff3bf"/>
    <rect x="220" y="100" width="190" height="80" rx="10" fill="#d0ebff"/>
    <rect x="460" y="100" width="150" height="80" rx="10" fill="#d3f9d8"/>
    <rect x="660" y="100" width="150" height="80" rx="10" fill="#ffd8a8"/>
    <rect x="850" y="100" width="130" height="80" rx="10" fill="#e5dbff"/>
    <rect x="660" y="220" width="150" height="60" rx="10" fill="#fcc2d7"/>
    <line x1="170" y1="140" x2="218" y2="140" marker-end="url(#arrow)"/>
    <line x1="410" y1="140" x2="458" y2="140" marker-end="url(#arrow)"/>
    <line x1="610" y1="140" x2="658" y2="140" marker-end="url(#arrow)"/>
    <line x1="810" y1="140" x2="848" y2="140" marker-end="url(#arrow)"/>
    <line x1="735" y1="180" x2="735" y2="218" marker-end="url(#arrow)"/>
  </g>
  <text x="500" y="45" font-size="30" font-weight="700" text-anchor="middle">dbt-python-cassandra pipeline</text>
  <text x="95" y="135" font-size="24" text-anchor="middle">orders.csv</text>
  <text x="95" y="162" font-size="18" text-anchor="middle">200 rows</text>
  <text x="315" y="135" font-size="24" text-anchor="middle">dbt + DuckDB</text>
  <text x="315" y="162" font-size="18" text-anchor="middle">seed, stg, model, tests</text>
  <text x="535" y="135" font-size="24" text-anchor="middle">loader.py</text>
  <text x="535" y="162" font-size="18" text-anchor="middle">DuckDB to Cassandra</text>
  <text x="735" y="135" font-size="24" text-anchor="middle">Cassandra 5</text>
  <text x="735" y="162" font-size="18" text-anchor="middle">sales keyspace</text>
  <text x="915" y="135" font-size="24" text-anchor="middle">server.py</text>
  <text x="915" y="162" font-size="18" text-anchor="middle">/api/revenue</text>
  <text x="735" y="257" font-size="22" text-anchor="middle">cqlsh console</text>
</svg>
