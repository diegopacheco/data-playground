version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["electronics", "books", "clothing", "home", "sports", "toys"]
  - name: revenue_by_category
    columns:
      - name: category
        data_tests:
          - not_null
          - unique
      - name: total_revenue
        data_tests:
          - not_null
