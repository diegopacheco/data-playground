<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenue by Category</title>
<style>
  :root { --bg: #f7f8fa; --card: #ffffff; --text: #1f2933; --muted: #6b7785; --line: #e4e7eb; --bar: #4f7cff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 16px; margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  tfoot td { font-weight: 700; border-bottom: none; }
  svg text { font-size: 12px; fill: var(--text); }
  .error { color: #c0392b; }
</style>
</head>
<body>
<main>
  <h1>Revenue by Category</h1>
  <p class="sub">dbt + DuckDB transform, stored in Cassandra table sales.revenue_by_category</p>
  <div class="card">
    <h2>Total revenue</h2>
    <svg id="chart" width="100%" role="img" aria-label="Revenue by category bar chart"></svg>
  </div>
  <div class="card">
    <h2>Details</h2>
    <table>
      <thead><tr><th>Category</th><th>Orders</th><th>Quantity</th><th>Revenue</th></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot id="total"></tfoot>
    </table>
  </div>
</main>
<script>
const money = v => v.toLocaleString("en-US", { style: "currency", currency: "USD" });
const NS = "http://www.w3.org/2000/svg";

function el(name, attrs, text) {
  const node = document.createElementNS(NS, name);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  if (text !== undefined) node.textContent = text;
  return node;
}

function renderChart(data) {
  const svg = document.getElementById("chart");
  const width = svg.clientWidth || 900;
  const rowHeight = 36, labelWidth = 110, valueWidth = 110;
  const max = Math.max(...data.map(d => d.total_revenue));
  svg.setAttribute("height", data.length * rowHeight);
  svg.replaceChildren();
  data.forEach((d, i) => {
    const y = i * rowHeight;
    const barWidth = Math.max(2, (width - labelWidth - valueWidth) * d.total_revenue / max);
    svg.appendChild(el("text", { x: 0, y: y + 22 }, d.category));
    svg.appendChild(el("rect", { x: labelWidth, y: y + 8, width: barWidth, height: 20, rx: 4, fill: "var(--bar)" }));
    svg.appendChild(el("text", { x: labelWidth + barWidth + 8, y: y + 22 }, money(d.total_revenue)));
  });
}

function renderTable(data) {
  document.getElementById("rows").innerHTML = data.map(d =>
    `<tr><td>${d.category}</td><td>${d.total_orders}</td><td>${d.total_quantity}</td><td>${money(d.total_revenue)}</td></tr>`).join("");
  const sum = key => data.reduce((acc, d) => acc + d[key], 0);
  document.getElementById("total").innerHTML =
    `<tr><td>Total</td><td>${sum("total_orders")}</td><td>${sum("total_quantity")}</td><td>${money(sum("total_revenue"))}</td></tr>`;
}

fetch("/api/revenue")
  .then(r => r.json())
  .then(data => {
    if (data.error) throw new Error(data.error);
    renderChart(data);
    renderTable(data);
  })
  .catch(e => { document.getElementById("rows").innerHTML = `<tr><td colspan="4" class="error">${e.message}</td></tr>`; });
</script>
</body>
</html>
