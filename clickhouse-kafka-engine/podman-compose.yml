name: i30-clickhouse-kafka

services:
  kafka:
    image: docker.io/apache/kafka:4.3.1
    container_name: i30-kafka
    ports:
      - "23092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:23092,INTERNAL://i30-kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
    networks:
      - i30-net

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.9.2.8
    container_name: i30-clickhouse
    ports:
      - "23123:8123"
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    mem_limit: 1g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - i30-net

networks:
  i30-net:
    name: i30-net
