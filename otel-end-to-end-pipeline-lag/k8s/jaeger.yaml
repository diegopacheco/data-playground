apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: pipeline
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
    - name: ui
      port: 16686
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: docker.io/jaegertracing/jaeger:2.22.0
          ports:
            - containerPort: 4317
            - containerPort: 16686
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
