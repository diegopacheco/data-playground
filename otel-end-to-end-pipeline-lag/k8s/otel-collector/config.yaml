receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  kafka_metrics:
    brokers: [kafka:9092]
    scrapers: [consumers, topics]
    collection_interval: 5s

processors:
  batch:
    timeout: 1s
  transform/lag-unit:
    metric_statements:
      - set(metric.unit, "{message}") where IsMatch(metric.name, "^kafka\\.consumer_group\\.lag")

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger]
    metrics:
      receivers: [otlp, kafka_metrics]
      processors: [transform/lag-unit, batch]
      exporters: [prometheus]
