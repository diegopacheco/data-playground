<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', cursive; fill: #1e1e1e; }
      .t { font-size: 25px; font-weight: 700; }
      .s { font-size: 18px; }
      .l { font-size: 17px; fill: #5c5c5c; }
      .box { stroke: #1e1e1e; stroke-width: 2.2; filter: url(#wobble); }
      .arrow { stroke: #1e1e1e; stroke-width: 2.2; fill: none; filter: url(#wobble); marker-end: url(#head); }
      .dash { stroke-dasharray: 7 5; }
    </style>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1400" height="700"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1e1e1e" stroke-width="2"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="700" fill="#ffffff"/>

  <text class="s" x="20" y="50">host</text>
  <rect class="box" x="20" y="80" width="215" height="190" rx="12" fill="#ffd8a8"/>
  <text class="t" x="127" y="116" text-anchor="middle">e2e pytest</text>
  <text class="s" x="127" y="146" text-anchor="middle">starts / stops runs</text>
  <text class="s" x="127" y="172" text-anchor="middle">reads Jaeger API v3</text>
  <text class="s" x="127" y="198" text-anchor="middle">reads Prometheus API</text>
  <text class="s" x="127" y="224" text-anchor="middle">psql on sink rows</text>
  <text class="s" x="127" y="250" text-anchor="middle">set env SLOWDOWN_MS</text>

  <rect class="box" x="20" y="480" width="215" height="120" rx="12" fill="#ffec99"/>
  <text class="t" x="127" y="518" text-anchor="middle">browser</text>
  <text class="s" x="127" y="548" text-anchor="middle">Grafana :27700</text>
  <text class="s" x="127" y="574" text-anchor="middle">Jaeger UI :27701</text>

  <rect class="box" x="260" y="20" width="1120" height="660" rx="18" fill="none" stroke-dasharray="8 6"/>
  <text class="s" x="280" y="50">kind cluster "otel-end-to-end-pipeline-lag" (podman), namespace pipeline</text>

  <rect class="box" x="290" y="80" width="220" height="140" rx="12" fill="#a5d8ff"/>
  <text class="t" x="400" y="116" text-anchor="middle">order-producer</text>
  <text class="s" x="400" y="144" text-anchor="middle">Java 25, Spring Boot 4.1</text>
  <text class="s" x="400" y="168" text-anchor="middle">eventTimeMs in payload</text>
  <text class="s" x="400" y="192" text-anchor="middle">Kafka observation on</text>

  <rect class="box" x="570" y="80" width="220" height="140" rx="12" fill="#ffc9c9"/>
  <text class="t" x="680" y="116" text-anchor="middle">Kafka 4.4.0</text>
  <text class="s" x="680" y="144" text-anchor="middle">KRaft, 1 node</text>
  <text class="s" x="680" y="168" text-anchor="middle">StatefulSet</text>
  <text class="s" x="680" y="192" text-anchor="middle">topic orders, 3 partitions</text>

  <rect class="box" x="850" y="80" width="220" height="140" rx="12" fill="#b2f2bb"/>
  <text class="t" x="960" y="116" text-anchor="middle">lag-consumer</text>
  <text class="s" x="960" y="144" text-anchor="middle">Python 3.15, OTel SDK</text>
  <text class="s" x="960" y="168" text-anchor="middle">extract traceparent</text>
  <text class="s" x="960" y="192" text-anchor="middle">enrich, insert, record lag</text>

  <rect class="box" x="1130" y="80" width="220" height="140" rx="12" fill="#d0bfff"/>
  <text class="t" x="1240" y="116" text-anchor="middle">Postgres 18.6</text>
  <text class="s" x="1240" y="144" text-anchor="middle">sink_orders</text>
  <text class="s" x="1240" y="168" text-anchor="middle">event_time, sink_time</text>
  <text class="s" x="1240" y="192" text-anchor="middle">trace_id per row</text>

  <rect class="box" x="570" y="320" width="500" height="120" rx="12" fill="#c5f6fa"/>
  <text class="t" x="820" y="356" text-anchor="middle">OpenTelemetry Collector contrib 0.164.0</text>
  <text class="s" x="820" y="386" text-anchor="middle">otlp receiver (traces, metrics), kafka_metrics receiver</text>
  <text class="s" x="820" y="412" text-anchor="middle">exporters: otlp_grpc to Jaeger, prometheus on :8889</text>

  <rect class="box" x="290" y="530" width="260" height="120" rx="12" fill="#eebefa"/>
  <text class="t" x="420" y="566" text-anchor="middle">Jaeger 2.22.0</text>
  <text class="s" x="420" y="596" text-anchor="middle">in-memory traces</text>
  <text class="s" x="420" y="622" text-anchor="middle">UI and API v3</text>

  <rect class="box" x="640" y="530" width="320" height="120" rx="12" fill="#ffd8a8"/>
  <text class="t" x="800" y="566" text-anchor="middle">Prometheus v3.15.1</text>
  <text class="s" x="800" y="596" text-anchor="middle">SLO, budget, burn rate rules</text>
  <text class="s" x="800" y="622" text-anchor="middle">fast burn and slow burn alerts</text>

  <rect class="box" x="1060" y="530" width="290" height="120" rx="12" fill="#fff3bf"/>
  <text class="t" x="1205" y="566" text-anchor="middle">Grafana 13.2.5</text>
  <text class="s" x="1205" y="596" text-anchor="middle">provisioned dashboard</text>
  <text class="s" x="1205" y="622" text-anchor="middle">lag p50/p95/p99, burn rate</text>

  <path class="arrow" d="M237,140 L286,140"/>
  <path class="arrow" d="M512,150 L566,150"/>
  <text class="l" x="540" y="244" text-anchor="middle">W3C traceparent</text>
  <path class="arrow" d="M792,150 L846,150"/>
  <path class="arrow" d="M1072,150 L1126,150"/>

  <path class="arrow" d="M400,222 L620,316"/>
  <text class="l" x="455" y="290">OTLP traces</text>
  <path class="arrow" d="M970,222 L1010,316"/>
  <text class="l" x="1000" y="262">OTLP traces + lag histogram</text>
  <path class="arrow dash" d="M720,316 L700,224"/>
  <text class="l" x="722" y="290">group lag</text>

  <path class="arrow" d="M640,442 L460,526"/>
  <text class="l" x="470" y="476">OTLP gRPC</text>
  <path class="arrow" d="M820,526 L820,444"/>
  <text class="l" x="830" y="494">scrape :8889 every 5s</text>
  <path class="arrow" d="M1058,590 L964,590"/>
  <text class="l" x="1010" y="578" text-anchor="middle">PromQL</text>
</svg>
