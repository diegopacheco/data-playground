name: i36-dagster-iceberg
services:
  dagster:
    image: localhost/i36-dagster-iceberg:latest
    container_name: i36-dagster
    command: ["sh", "-c", "mkdir -p /app/lake/dagster && touch /app/lake/dagster/dagster.yaml && exec dagster-webserver -h 0.0.0.0 -p 3000 -m i36_pipeline.definitions"]
    ports:
      - "${DAGSTER_PORT}:3000"
    volumes:
      - ./data:/app/data:ro
      - ./lake:/app/lake
    mem_limit: 768m
    networks: [i36-net]
  ui:
    image: localhost/i36-dagster-iceberg:latest
    container_name: i36-ui
    command: ["python", "ui/server.py"]
    environment:
      UI_PORT: "8080"
    ports:
      - "${UI_PORT}:8080"
    volumes:
      - ./lake:/app/lake
    mem_limit: 256m
    networks: [i36-net]
networks:
  i36-net:
    name: i36-net
