<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', cursive; fill: #1e1e1e; }
      .t { font-size: 26px; font-weight: 700; }
      .s { font-size: 19px; }
      .box { stroke: #1e1e1e; stroke-width: 2.2; filter: url(#wobble); }
      .arrow { stroke: #1e1e1e; stroke-width: 2.2; fill: none; filter: url(#wobble); marker-end: url(#head); }
    </style>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1100" height="460"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1e1e1e" stroke-width="2"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="460" fill="#ffffff"/>
  <rect class="box" x="10" y="20" width="1080" height="420" rx="18" fill="none" stroke-dasharray="8 6"/>
  <text class="s" x="30" y="50">kind cluster "numaflow-fun" (podman)</text>

  <rect class="box" x="30" y="170" width="150" height="90" rx="12" fill="#ffd8a8"/>
  <text class="t" x="105" y="208" text-anchor="middle">client</text>
  <text class="s" x="105" y="235" text-anchor="middle">POST via port-forward</text>

  <rect class="box" x="240" y="160" width="190" height="110" rx="12" fill="#a5d8ff"/>
  <text class="t" x="335" y="200" text-anchor="middle">in</text>
  <text class="s" x="335" y="228" text-anchor="middle">built-in http source</text>
  <text class="s" x="335" y="252" text-anchor="middle">:8443 /vertices/in</text>

  <rect class="box" x="500" y="150" width="220" height="130" rx="12" fill="#b2f2bb"/>
  <text class="t" x="610" y="190" text-anchor="middle">enrich (map)</text>
  <text class="s" x="610" y="218" text-anchor="middle">Python 3.15 + pynumaflow</text>
  <text class="s" x="610" y="242" text-anchor="middle">total, tier, tags=[tier]</text>
  <text class="s" x="610" y="266" text-anchor="middle">invalid: to_drop()</text>

  <rect class="box" x="840" y="70" width="210" height="100" rx="12" fill="#d0bfff"/>
  <text class="t" x="945" y="108" text-anchor="middle">big (udsink)</text>
  <text class="s" x="945" y="138" text-anchor="middle">total &gt;= 10000 cents</text>

  <rect class="box" x="840" y="260" width="210" height="100" rx="12" fill="#fcc2d7"/>
  <text class="t" x="945" y="298" text-anchor="middle">small (udsink)</text>
  <text class="s" x="945" y="328" text-anchor="middle">total &lt; 10000 cents</text>

  <rect class="box" x="400" y="345" width="330" height="70" rx="12" fill="#fff3bf"/>
  <text class="t" x="565" y="375" text-anchor="middle">ISB: JetStream x3</text>
  <text class="s" x="565" y="400" text-anchor="middle">buffers between every vertex</text>

  <path class="arrow" d="M180,215 L236,215"/>
  <path class="arrow" d="M430,215 L496,215"/>
  <path class="arrow" d="M720,190 C780,170 790,125 836,120"/>
  <path class="arrow" d="M720,245 C780,265 790,305 836,310"/>
  <text class="s" x="735" y="120">tag big</text>
  <text class="s" x="735" y="325">tag small</text>
</svg>
