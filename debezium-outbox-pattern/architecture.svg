<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" width="1400" height="470">
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700');text{font-family:Caveat,'Comic Sans MS',cursive;fill:#1d2330}.t{font-size:24px;font-weight:700}.s{font-size:18px}.l{font-size:16px;fill:#5a6275}</style>
<filter id="w"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2330"/></marker>
</defs>
<rect width="1400" height="470" fill="#ffffff"/>
<g filter="url(#w)" stroke="#1d2330" stroke-width="2">
<rect x="30" y="40" width="220" height="210" rx="12" fill="#fff3c4"/>
<rect x="310" y="40" width="220" height="210" rx="12" fill="#dff5e1"/>
<rect x="590" y="40" width="220" height="210" rx="12" fill="#d7ecff"/>
<rect x="870" y="40" width="220" height="210" rx="12" fill="#f3e1ff"/>
<rect x="1150" y="40" width="220" height="210" rx="12" fill="#e6f7f7"/>
<rect x="30" y="330" width="220" height="110" rx="12" fill="#ffe0d6"/>
<rect x="1150" y="330" width="220" height="110" rx="12" fill="#fff3c4"/>
<path d="M250 145 L306 145" fill="none" marker-end="url(#a)"/>
<path d="M530 145 L586 145" fill="none" marker-end="url(#a)"/>
<path d="M810 145 L866 145" fill="none" marker-end="url(#a)"/>
<path d="M1090 145 L1146 145" fill="none" marker-end="url(#a)"/>
<path d="M200 330 L370 254" fill="none" marker-end="url(#a)"/>
<path d="M250 400 L980 400 L980 254" fill="none" marker-end="url(#a)"/>
<path d="M1200 330 L1060 254" fill="none" marker-end="url(#a)"/>
</g>
<text x="140" y="76" text-anchor="middle" class="t">service.py</text>
<text x="140" y="108" text-anchor="middle" class="s">one transaction:</text>
<text x="140" y="134" text-anchor="middle" class="s">order or customer row</text>
<text x="140" y="160" text-anchor="middle" class="s">+ outbox row</text>
<text x="140" y="196" text-anchor="middle" class="s">COMMIT: both</text>
<text x="140" y="222" text-anchor="middle" class="s">ROLLBACK: neither</text>
<text x="420" y="76" text-anchor="middle" class="t">s3-postgres 18.6</text>
<text x="420" y="108" text-anchor="middle" class="s">orders, customers</text>
<text x="420" y="134" text-anchor="middle" class="s">outbox (id, aggregatetype,</text>
<text x="420" y="160" text-anchor="middle" class="s">aggregateid, type, payload)</text>
<text x="420" y="196" text-anchor="middle" class="s">WAL, pgoutput</text>
<text x="420" y="222" text-anchor="middle" class="s">slot s3_outbox</text>
<text x="700" y="76" text-anchor="middle" class="t">s3-connect</text>
<text x="700" y="108" text-anchor="middle" class="s">Debezium 3.6.3</text>
<text x="700" y="134" text-anchor="middle" class="s">captures public.outbox only</text>
<text x="700" y="160" text-anchor="middle" class="s">Outbox Event Router SMT</text>
<text x="700" y="196" text-anchor="middle" class="s">deletes dropped, no tombstones</text>
<text x="700" y="222" text-anchor="middle" class="s">killed and started mid-run</text>
<text x="980" y="76" text-anchor="middle" class="t">s3-kafka 4.3.1</text>
<text x="980" y="108" text-anchor="middle" class="s">outbox.event.order</text>
<text x="980" y="134" text-anchor="middle" class="s">outbox.event.customer</text>
<text x="980" y="160" text-anchor="middle" class="s">key = aggregate id</text>
<text x="980" y="196" text-anchor="middle" class="s">headers id, eventType</text>
<text x="980" y="222" text-anchor="middle" class="s">value = payload</text>
<text x="1260" y="76" text-anchor="middle" class="t">consumer.py</text>
<text x="1260" y="108" text-anchor="middle" class="s">deduplicates on header id</text>
<text x="1260" y="134" text-anchor="middle" class="s">processed_events</text>
<text x="1260" y="160" text-anchor="middle" class="s">projection</text>
<text x="1260" y="196" text-anchor="middle" class="s">each event applied once,</text>
<text x="1260" y="222" text-anchor="middle" class="s">redeliveries skipped</text>
<text x="140" y="366" text-anchor="middle" class="t">worker.py</text>
<text x="140" y="394" text-anchor="middle" class="s">dual write, SIGKILL</text>
<text x="140" y="420" text-anchor="middle" class="s">between the two steps</text>
<text x="330" y="300" text-anchor="middle" class="l">INSERT</text>
<text x="610" y="390" text-anchor="middle" class="l">publish to dualwrite.db-first.order and dualwrite.kafka-first.order</text>
<text x="1260" y="366" text-anchor="middle" class="t">server.py + index.html</text>
<text x="1260" y="394" text-anchor="middle" class="s">claims from postgres</text>
<text x="1260" y="420" text-anchor="middle" class="s">and kafka, read live</text>
<text x="1095" y="300" text-anchor="middle" class="l">read</text>
</svg>
