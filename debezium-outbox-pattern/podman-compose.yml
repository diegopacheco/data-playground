name: s3-debezium-outbox

x-podman:
  in_pod: false

services:
  s3-postgres:
    image: docker.io/library/postgres:18.6
    container_name: s3-postgres
    mem_limit: 384m
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4", "-c", "shared_buffers=64MB"]
    environment:
      POSTGRES_USER: s3
      POSTGRES_PASSWORD: s3password
      POSTGRES_DB: shop
    ports:
      - "${postgres:-30200}:5432"
    volumes:
      - s3-postgres-data:/var/lib/postgresql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - s3-net

  s3-kafka:
    image: docker.io/apache/kafka:4.3.1
    container_name: s3-kafka
    mem_limit: 900m
    ports:
      - "${kafka:-30201}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${kafka:-30201},INTERNAL://s3-kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
    volumes:
      - s3-kafka-data:/var/lib/kafka/data
    networks:
      - s3-net

  s3-connect:
    image: quay.io/debezium/connect:3.6.3.Final
    container_name: s3-connect
    mem_limit: 900m
    depends_on:
      - s3-kafka
      - s3-postgres
    ports:
      - "${connect:-30202}:8083"
    environment:
      BOOTSTRAP_SERVERS: s3-kafka:29092
      GROUP_ID: s3-connect
      CONFIG_STORAGE_TOPIC: s3_connect_configs
      OFFSET_STORAGE_TOPIC: s3_connect_offsets
      STATUS_STORAGE_TOPIC: s3_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_FLUSH_INTERVAL_MS: 10000
      HEAP_OPTS: "-Xms128m -Xmx384m -XX:ReservedCodeCacheSize=64m"
    networks:
      - s3-net

networks:
  s3-net:
    name: s3-net

volumes:
  s3-postgres-data:
    name: s3-postgres-data
  s3-kafka-data:
    name: s3-kafka-data
