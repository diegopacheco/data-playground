apiVersion: v1
kind: Namespace
metadata:
  name: t8-etl
---
apiVersion: v1
kind: Secret
metadata:
  name: t8-minio-creds
  namespace: t8-etl
stringData:
  accesskey: t8admin
  secretkey: t8admin-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: t8-postgres-creds
  namespace: t8-etl
stringData:
  password: etl
  url: postgresql://etl:etl@t8-postgres.t8-etl.svc.cluster.local:5432/etl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: t8-etl-runner
  namespace: t8-etl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: t8-etl-runner
  namespace: t8-etl
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: t8-etl-runner
  namespace: t8-etl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: t8-etl-runner
subjects:
  - kind: ServiceAccount
    name: t8-etl-runner
    namespace: t8-etl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t8-minio
  namespace: t8-etl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: t8-minio
  template:
    metadata:
      labels:
        app: t8-minio
    spec:
      containers:
        - name: minio
          image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          imagePullPolicy: IfNotPresent
          args: ["server", "/data"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: t8-minio-creds, key: accesskey}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: t8-minio-creds, key: secretkey}
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            periodSeconds: 2
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: t8-minio
  namespace: t8-etl
spec:
  selector:
    app: t8-minio
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: t8-postgres-schema
  namespace: t8-etl
data:
  schema.sql: |
    CREATE TABLE batches (
      batch TEXT PRIMARY KEY,
      seed INT NOT NULL,
      rows INT NOT NULL,
      orders INT NOT NULL,
      cents BIGINT NOT NULL,
      loaded_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE TABLE region_totals (
      batch TEXT NOT NULL REFERENCES batches(batch),
      region TEXT NOT NULL,
      orders INT NOT NULL,
      cents BIGINT NOT NULL,
      max_cents INT NOT NULL,
      big_orders INT NOT NULL,
      days INT NOT NULL,
      PRIMARY KEY (batch, region)
    );
    CREATE TABLE alerts (
      batch TEXT NOT NULL REFERENCES batches(batch),
      region TEXT NOT NULL,
      cents BIGINT NOT NULL,
      threshold BIGINT NOT NULL,
      PRIMARY KEY (batch, region)
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t8-postgres
  namespace: t8-etl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: t8-postgres
  template:
    metadata:
      labels:
        app: t8-postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-alpine
          imagePullPolicy: IfNotPresent
          env:
            - {name: POSTGRES_USER, value: etl}
            - {name: POSTGRES_DB, value: etl}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: t8-postgres-creds, key: password}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "etl", "-d", "etl", "-h", "127.0.0.1"]
            periodSeconds: 2
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: schema, mountPath: /docker-entrypoint-initdb.d}
            - {name: data, mountPath: /var/lib/postgresql}
      volumes:
        - name: schema
          configMap:
            name: t8-postgres-schema
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: t8-postgres
  namespace: t8-etl
spec:
  type: NodePort
  selector:
    app: t8-postgres
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: __postgres__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t8-ui
  namespace: t8-etl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: t8-ui
  template:
    metadata:
      labels:
        app: t8-ui
    spec:
      containers:
        - name: ui
          image: localhost/t8-argo-etl:v1
          imagePullPolicy: Never
          env:
            - {name: ARGO_URL, value: "http://argo-server.argo.svc.cluster.local:2746"}
            - {name: NAMESPACE, value: t8-etl}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: t8-postgres-creds, key: url}
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 300m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: t8-ui
  namespace: t8-etl
spec:
  type: NodePort
  selector:
    app: t8-ui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: __etl_ui__
