apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-controller-configmap
  namespace: argo
data:
  artifactRepository: |
    archiveLogs: true
    s3:
      bucket: t8-artifacts
      endpoint: t8-minio.t8-etl.svc.cluster.local:9000
      insecure: true
      createBucketIfNotPresent:
        objectLocking: false
      accessKeySecret:
        name: t8-minio-creds
        key: accesskey
      secretKeySecret:
        name: t8-minio-creds
        key: secretkey
  executor: |
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: t8-argo-server
  namespace: argo
spec:
  type: NodePort
  selector:
    app: argo-server
  ports:
    - name: web
      port: 2746
      targetPort: 2746
      nodePort: __argo_ui__
