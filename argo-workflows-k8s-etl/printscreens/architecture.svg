    <line x1="750" y1="340" x2="797" y2="340" marker-end="url(#arrow)"/>
    <line x1="910" y1="340" x2="937" y2="340" marker-end="url(#arrow)"/>
    <line x1="360" y1="390" x2="380" y2="477" marker-end="url(#arrow)"/>
    <line x1="500" y1="477" x2="510" y2="403" marker-end="url(#arrow)"/>
    <line x1="560" y1="403" x2="550" y2="477" marker-end="url(#arrow)"/>
    <line x1="590" y1="477" x2="660" y2="393" marker-end="url(#arrow)"/>
    <line x1="855" y1="390" x2="855" y2="477" marker-end="url(#arrow)"/>
    <line x1="1000" y1="390" x2="933" y2="500" marker-end="url(#arrow)"/>
  </g>
  <text x="20" y="34" font-size="30" font-weight="700">argo-workflows-k8s-etl</text>
  <text x="740" y="100" font-size="20" text-anchor="middle">kind cluster t8-argo (single node t8-argo-control-plane, 2.5 GB cap)</text>
  <text x="120" y="145" font-size="22" text-anchor="middle">browser</text>
  <text x="120" y="172" font-size="16" text-anchor="middle">Argo UI and ETL UI</text>
  <text x="120" y="292" font-size="22" text-anchor="middle">test-all.sh</text>
  <text x="120" y="318" font-size="16" text-anchor="middle">submit via REST, poll,</text>
  <text x="120" y="340" font-size="16" text-anchor="middle">psql via kubectl exec,</text>
  <text x="120" y="362" font-size="16" text-anchor="middle">recompute expected</text>
  <text x="400" y="152" font-size="22" text-anchor="middle">argo-server</text>
  <text x="400" y="177" font-size="16" text-anchor="middle">v4.1.6, auth-mode server</text>
  <text x="400" y="199" font-size="16" text-anchor="middle">NodePort 31700</text>
  <text x="630" y="152" font-size="22" text-anchor="middle">t8-ui</text>
  <text x="630" y="177" font-size="16" text-anchor="middle">server.py + index.html</text>
  <text x="630" y="199" font-size="16" text-anchor="middle">NodePort 31701</text>
  <text x="860" y="152" font-size="22" text-anchor="middle">workflow-controller</text>
  <text x="860" y="177" font-size="16" text-anchor="middle">runs the DAG as pods,</text>
  <text x="860" y="199" font-size="16" text-anchor="middle">retries, when, cron</text>
  <text x="1095" y="152" font-size="22" text-anchor="middle">t8-etl-cron</text>
  <text x="1095" y="177" font-size="16" text-anchor="middle">CronWorkflow */5 * * * *</text>
  <text x="1095" y="199" font-size="16" text-anchor="middle">Forbid, seed 21</text>
  <text x="1110" y="430" font-size="18" text-anchor="middle">WorkflowTemplate t8-etl</text>
  <text x="360" y="325" font-size="21" text-anchor="middle">extract</text>
  <text x="360" y="348" font-size="15" text-anchor="middle">seeded orders</text>
  <text x="360" y="368" font-size="15" text-anchor="middle">regions param</text>
  <text x="530" y="310" font-size="21" text-anchor="middle">transform x5</text>
  <text x="530" y="333" font-size="15" text-anchor="middle">withParam fan-out</text>
  <text x="530" y="353" font-size="15" text-anchor="middle">br fails attempt 0,</text>
  <text x="530" y="373" font-size="15" text-anchor="middle">retryStrategy reruns</text>
  <text x="695" y="325" font-size="21" text-anchor="middle">merge</text>
  <text x="695" y="348" font-size="15" text-anchor="middle">fan-in reads</text>
  <text x="695" y="368" font-size="15" text-anchor="middle">parts/ prefix</text>
  <text x="855" y="325" font-size="21" text-anchor="middle">load</text>
  <text x="855" y="348" font-size="15" text-anchor="middle">psycopg,</text>
  <text x="855" y="368" font-size="15" text-anchor="middle">one transaction</text>
  <text x="1020" y="325" font-size="21" text-anchor="middle">alert</text>
  <text x="1020" y="348" font-size="15" text-anchor="middle">when max_region_cents</text>
  <text x="1020" y="368" font-size="15" text-anchor="middle">&gt; alert_cents</text>
  <text x="465" y="515" font-size="22" text-anchor="middle">t8-minio (S3)</text>
  <text x="465" y="540" font-size="16" text-anchor="middle">artifact repository t8-artifacts:</text>
  <text x="465" y="562" font-size="16" text-anchor="middle">orders.json, parts/*.json, report.json</text>
  <text x="815" y="515" font-size="22" text-anchor="middle">t8-postgres 18.6</text>
  <text x="815" y="540" font-size="16" text-anchor="middle">batches, region_totals, alerts</text>
  <text x="815" y="562" font-size="16" text-anchor="middle">NodePort 31702</text>
  <text x="740" y="612" font-size="17" text-anchor="middle">every step runs the image localhost/t8-argo-etl:v1 (python 3.15.2 + etl.py), loaded into kind with kind load</text>
</svg>
