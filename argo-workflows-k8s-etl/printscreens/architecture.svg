<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2933; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
  </defs>
  <rect width="1240" height="650" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1f2933" stroke-width="2">
    <rect x="260" y="70" width="960" height="560" rx="14" fill="#f8f9fa" stroke-dasharray="8 6"/>
    <rect x="20" y="110" width="200" height="90" rx="10" fill="#e5dbff"/>
    <rect x="20" y="260" width="200" height="120" rx="10" fill="#d3f9d8"/>
    <rect x="300" y="120" width="200" height="95" rx="10" fill="#d0ebff"/>
    <rect x="540" y="120" width="180" height="95" rx="10" fill="#ffd8a8"/>
    <rect x="760" y="120" width="200" height="95" rx="10" fill="#d0ebff"/>
    <rect x="1000" y="120" width="190" height="95" rx="10" fill="#fff3bf"/>
    <rect x="300" y="290" width="120" height="100" rx="10" fill="#ffd8a8"/>
    <rect x="450" y="280" width="160" height="120" rx="10" fill="#ffd8a8"/>
    <rect x="640" y="290" width="110" height="100" rx="10" fill="#ffd8a8"/>
    <rect x="800" y="290" width="110" height="100" rx="10" fill="#ffd8a8"/>
    <rect x="940" y="290" width="160" height="100" rx="10" fill="#ffe3e3" stroke-dasharray="7 5"/>
    <rect x="330" y="480" width="270" height="100" rx="10" fill="#c5f6fa"/>
    <rect x="700" y="480" width="230" height="100" rx="10" fill="#c5f6fa"/>
    <line x1="220" y1="155" x2="297" y2="160" marker-end="url(#arrow)"/>
    <line x1="220" y1="300" x2="297" y2="200" marker-end="url(#arrow)"/>
    <polyline points="120,110 120,45 630,45 630,117" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
    <line x1="540" y1="167" x2="503" y2="167" marker-end="url(#arrow)"/>
    <line x1="1000" y1="167" x2="963" y2="167" marker-end="url(#arrow)"/>
