apiVersion: sources.knative.dev/v1
kind: KafkaSource
metadata:
  name: orders-native
  labels:
    app: orders
spec:
  consumerGroup: orders-native
  bootstrapServers:
    - kafka-0.kafka.default.svc.cluster.local:9092
  topics:
    - orders-native
  initialOffset: earliest
  delivery:
    retry: 5
    backoffPolicy: exponential
    backoffDelay: PT0.5S
  sink:
    ref:
      apiVersion: serving.knative.dev/v1
      kind: Service
      name: orders-native
---
