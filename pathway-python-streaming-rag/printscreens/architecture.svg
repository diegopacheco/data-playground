    <rect x="330" y="460" width="250" height="90" rx="10" fill="#d0ebff"/>
    <rect x="620" y="140" width="250" height="90" rx="10" fill="#d0ebff"/>
    <rect x="620" y="290" width="250" height="90" rx="10" fill="#fff3bf"/>
    <rect x="620" y="460" width="250" height="90" rx="10" fill="#d0ebff"/>
    <rect x="940" y="290" width="240" height="90" rx="10" fill="#ffd8a8"/>
    <rect x="940" y="460" width="240" height="90" rx="10" fill="#ffdeeb"/>
    <line x1="250" y1="150" x2="327" y2="165" marker-end="url(#arrow)"/>
    <line x1="250" y1="260" x2="327" y2="190" marker-end="url(#arrow)"/>
    <line x1="250" y1="365" x2="327" y2="215" marker-end="url(#arrow)"/>
    <line x1="250" y1="510" x2="327" y2="505" marker-end="url(#arrow)"/>
    <line x1="455" y1="230" x2="455" y2="287" marker-end="url(#arrow)"/>
    <line x1="580" y1="320" x2="660" y2="233" marker-end="url(#arrow)"/>
    <line x1="580" y1="505" x2="617" y2="505" marker-end="url(#arrow)"/>
    <line x1="745" y1="230" x2="745" y2="287" marker-end="url(#arrow)"/>
    <line x1="800" y1="380" x2="800" y2="457" marker-end="url(#arrow)"/>
    <line x1="937" y1="335" x2="873" y2="335" marker-end="url(#arrow)"/>
    <line x1="1060" y1="460" x2="1060" y2="383" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
  </g>
  <text x="600" y="40" font-size="34" font-weight="700" text-anchor="middle">pathway-python-streaming-rag</text>
  <text x="600" y="72" font-size="20" text-anchor="middle">incremental windows and joins plus a live top-k document index, one Pathway 0.33.0 dataflow</text>
  <text x="600" y="118" font-size="21" text-anchor="middle">t4-pathway container (Python 3.13, mem 1 GB)</text>
  <text x="135" y="143" font-size="22" text-anchor="middle">data/orders/*.csv</text>
  <text x="135" y="170" font-size="17" text-anchor="middle">watched folder, edit / delete</text>
  <text x="135" y="253" font-size="22" text-anchor="middle">t4-redpanda v26.2.6</text>
  <text x="135" y="280" font-size="17" text-anchor="middle">Kafka topic orders (json)</text>
  <text x="135" y="363" font-size="22" text-anchor="middle">data/regions/regions.csv</text>
  <text x="135" y="390" font-size="17" text-anchor="middle">region, name, tax_pct</text>
  <text x="135" y="503" font-size="22" text-anchor="middle">data/docs/*.md</text>
  <text x="135" y="530" font-size="17" text-anchor="middle">add / edit / delete docs</text>
  <text x="455" y="173" font-size="22" text-anchor="middle">concat_reindex + join</text>
  <text x="455" y="200" font-size="17" text-anchor="middle">orders x regions, gross with tax</text>
  <text x="455" y="323" font-size="22" text-anchor="middle">windowby tumbling 60 s</text>
  <text x="455" y="350" font-size="17" text-anchor="middle">per region + groupby totals</text>
  <text x="455" y="493" font-size="22" text-anchor="middle">hashing embedder 256 d</text>
  <text x="455" y="520" font-size="17" text-anchor="middle">BruteForceKnn cosine DataIndex</text>
  <text x="745" y="173" font-size="22" text-anchor="middle">pw.io.subscribe</text>
  <text x="745" y="200" font-size="17" text-anchor="middle">LiveTable: windows, totals, docs</text>
  <text x="745" y="323" font-size="22" text-anchor="middle">stdlib http.server :8080</text>
  <text x="745" y="350" font-size="17" text-anchor="middle">UI + /api/* (host 31300)</text>
  <text x="745" y="493" font-size="22" text-anchor="middle">rest_connector :8001</text>
  <text x="745" y="520" font-size="17" text-anchor="middle">/v1/retrieve query_as_of_now</text>
  <text x="1060" y="323" font-size="22" text-anchor="middle">browser UI</text>
  <text x="1060" y="350" font-size="17" text-anchor="middle">4 tabs, polls every second</text>
  <text x="1060" y="493" font-size="22" text-anchor="middle">tests (host unittest)</text>
  <text x="1060" y="520" font-size="17" text-anchor="middle">write data/, rpk produce, recompute</text>
  <text x="822" y="425" font-size="16">proxy /api/search</text>
</svg>
