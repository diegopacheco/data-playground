name: i48-pgvector

services:
  i48-postgres:
    image: docker.io/pgvector/pgvector:0.8.6-pg18-trixie
    container_name: i48-postgres
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    shm_size: 256m
    mem_limit: 768m
    ports:
      - "${postgres:-24800}:5432"
    volumes:
      - i48-pgdata:/var/lib/postgresql
    networks:
      - i48-net

networks:
  i48-net:
    name: i48-net

volumes:
  i48-pgdata:
    name: i48-pgdata
