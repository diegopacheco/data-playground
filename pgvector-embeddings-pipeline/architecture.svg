<text x="805" y="116" text-anchor="middle" class="s">products: 31 rows, HNSW, GIN tsv</text>
<text x="805" y="140" text-anchor="middle" class="s">variants: 18,600 rows, HNSW</text>
<text x="805" y="164" text-anchor="middle" class="s">pipeline_results (jsonb)</text>
<text x="440" y="305" text-anchor="middle" class="t">server.py</text>
