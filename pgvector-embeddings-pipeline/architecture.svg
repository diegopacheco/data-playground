<text x="125" y="170" text-anchor="middle" class="s">+ descriptions</text>
<text x="440" y="62" text-anchor="middle" class="t">pipeline.py (Python 3.14)</text>
<text x="440" y="92" text-anchor="middle" class="s">chunk text (24 words, overlap 6)</text>
<text x="440" y="116" text-anchor="middle" class="s">fastembed bge-small-en-v1.5 ONNX</text>
<text x="440" y="140" text-anchor="middle" class="s">embed in batches of 256, mean pool</text>
<text x="440" y="164" text-anchor="middle" class="s">upsert vector(384), build HNSW</text>
<text x="440" y="188" text-anchor="middle" class="s">bench exact vs HNSW recall@10</text>
<text x="805" y="62" text-anchor="middle" class="t">i48-postgres</text>
