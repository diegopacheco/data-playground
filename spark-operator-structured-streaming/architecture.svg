<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', cursive; fill: #1e1e1e; }
      .t { font-size: 25px; font-weight: 700; }
      .s { font-size: 19px; }
      .box { stroke: #1e1e1e; stroke-width: 2.2; filter: url(#wobble); }
      .arrow { stroke: #1e1e1e; stroke-width: 2.2; fill: none; filter: url(#wobble); marker-end: url(#head); }
      .dash { stroke-dasharray: 7 5; }
    </style>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1100" height="640"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1e1e1e" stroke-width="2"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="640" fill="#ffffff"/>
  <rect class="box" x="10" y="20" width="1080" height="600" rx="18" fill="none" stroke-dasharray="8 6"/>
  <text class="s" x="30" y="50">kind cluster "spark-operator-structured-streaming" (podman)</text>

  <rect class="box" x="30" y="80" width="200" height="110" rx="12" fill="#ffd8a8"/>
  <text class="t" x="130" y="114" text-anchor="middle">producer</text>
  <text class="s" x="130" y="142" text-anchor="middle">Python 3.15, 50 events/s</text>
  <text class="s" x="130" y="166" text-anchor="middle">id, seq, event_time_ms</text>

  <rect class="box" x="30" y="250" width="200" height="120" rx="12" fill="#ffec99"/>
  <text class="t" x="130" y="284" text-anchor="middle">Kafka 4.4.0</text>
  <text class="s" x="130" y="312" text-anchor="middle">KRaft, 1 broker</text>
  <text class="s" x="130" y="336" text-anchor="middle">topic events, 2 partitions</text>

  <rect class="box" x="300" y="80" width="260" height="110" rx="12" fill="#a5d8ff"/>
  <text class="t" x="430" y="114" text-anchor="middle">Spark Operator 2.5.2</text>
  <text class="s" x="430" y="142" text-anchor="middle">watches SparkApplication</text>
  <text class="s" x="430" y="166" text-anchor="middle">restartPolicy: Always</text>

  <rect class="box" x="300" y="240" width="260" height="140" rx="12" fill="#b2f2bb"/>
  <text class="t" x="430" y="274" text-anchor="middle">events-java</text>
  <text class="s" x="430" y="302" text-anchor="middle">driver + 1 executor</text>
  <text class="s" x="430" y="326" text-anchor="middle">Spark 4.1.4, JDK 25 built jar</text>
  <text class="s" x="430" y="350" text-anchor="middle">trigger(processingTime)</text>

  <rect class="box" x="300" y="420" width="260" height="140" rx="12" fill="#b2f2bb"/>
  <text class="t" x="430" y="454" text-anchor="middle">events-python</text>
  <text class="s" x="430" y="482" text-anchor="middle">driver + 1 executor</text>
  <text class="s" x="430" y="506" text-anchor="middle">PySpark 4.1.4, Python 3.14</text>
  <text class="s" x="430" y="530" text-anchor="middle">trigger(processingTime)</text>

  <rect class="box" x="650" y="80" width="230" height="110" rx="12" fill="#d0bfff"/>
  <text class="t" x="765" y="114" text-anchor="middle">Postgres 18.6</text>
  <text class="s" x="765" y="142" text-anchor="middle">Iceberg JDBC catalog</text>
  <text class="s" x="765" y="166" text-anchor="middle">atomic metadata pointer</text>

  <rect class="box" x="650" y="270" width="230" height="200" rx="12" fill="#ffc9c9"/>
  <text class="t" x="765" y="304" text-anchor="middle">MinIO</text>
  <text class="s" x="765" y="334" text-anchor="middle">s3://lake: Iceberg data,</text>
  <text class="s" x="765" y="358" text-anchor="middle">manifests, snapshots</text>
  <text class="s" x="765" y="394" text-anchor="middle">s3a://checkpoints:</text>
  <text class="s" x="765" y="418" text-anchor="middle">offsets + commits logs</text>

  <rect class="box" x="920" y="250" width="150" height="160" rx="12" fill="#e9ecef"/>
  <text class="t" x="995" y="284" text-anchor="middle">e2e tests</text>
  <text class="s" x="995" y="312" text-anchor="middle">kill driver,</text>
  <text class="s" x="995" y="336" text-anchor="middle">sweep trigger,</text>
  <text class="s" x="995" y="360" text-anchor="middle">query lake</text>
  <text class="s" x="995" y="384" text-anchor="middle">(lake-query pod)</text>

  <path class="arrow" d="M130,190 L130,245"/>
  <path class="arrow" d="M230,300 L295,305"/>
  <path class="arrow" d="M230,340 L295,470"/>
  <path class="arrow" d="M430,190 L430,235"/>
  <path class="arrow dash" d="M300,170 C260,210 260,420 296,440"/>
  <path class="arrow" d="M560,290 L645,300"/>
  <path class="arrow" d="M560,490 L645,440"/>
  <path class="arrow" d="M560,270 C600,230 620,180 645,160"/>
  <path class="arrow" d="M560,450 C620,380 610,200 650,175"/>
  <path class="arrow" d="M920,330 L885,350"/>
  <text class="s" x="575" y="250">commit</text>
  <text class="s" x="580" y="320">files</text>
  <text class="s" x="240" y="290">read</text>
  <text class="s" x="140" y="222">send</text>
  <text class="s" x="440" y="222">submit</text>
</svg>
