    <line x1="968" y1="170" x2="932" y2="170" marker-end="url(#arrow)"/>
    <line x1="585" y1="298" x2="585" y2="272" marker-end="url(#arrow)"/>
  </g>
  <text x="550" y="40" font-size="30" font-weight="700" text-anchor="middle">paradedb-search-analytics</text>
