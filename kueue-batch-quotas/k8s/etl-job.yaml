apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: etl
    etl-run: "${RUN_ID}"
    kueue.x-k8s.io/queue-name: etl
    kueue.x-k8s.io/priority-class: ${PRIORITY}
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: etl
        etl-run: "${RUN_ID}"
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 2
      containers:
        - name: etl
          image: ${IMAGE}
          imagePullPolicy: Never
          env:
            - name: JOB_NAME
              value: ${JOB_NAME}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TEAM
              value: ${TEAM}
            - name: ETL_ROWS
              value: "${ROWS}"
            - name: ETL_SEED
              value: "${SEED}"
            - name: ETL_ROUNDS
              value: "${ROUNDS}"
            - name: RESULTS_DIR
              value: /results
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 320Mi
            limits:
              memory: 320Mi
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          hostPath:
            path: /results
            type: Directory
