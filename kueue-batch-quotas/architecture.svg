<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', cursive; fill: #1e1e1e; }
      .t { font-size: 26px; font-weight: 700; }
      .s { font-size: 19px; }
      .box { stroke: #1e1e1e; stroke-width: 2.2; filter: url(#wobble); }
      .arrow { stroke: #1e1e1e; stroke-width: 2.2; fill: none; filter: url(#wobble); marker-end: url(#head); }
    </style>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="760"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1e1e1e" stroke-width="2"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
  <rect class="box" x="10" y="20" width="1180" height="560" rx="18" fill="none" stroke-dasharray="8 6"/>
  <text class="s" x="30" y="50">kind cluster "kueue-batch-quotas" (podman, 1 node)</text>

  <rect class="box" x="30" y="70" width="300" height="150" rx="12" fill="#a5d8ff"/>
  <text class="t" x="180" y="104" text-anchor="middle">team-analytics</text>
  <text class="s" x="180" y="134" text-anchor="middle">LocalQueue "etl"</text>
  <text class="s" x="180" y="160" text-anchor="middle">batch/v1 Jobs, suspend: true</text>
  <text class="s" x="180" y="186" text-anchor="middle">etl-python (3.15) / etl-java (25)</text>

  <rect class="box" x="30" y="240" width="300" height="150" rx="12" fill="#a5d8ff"/>
  <text class="t" x="180" y="274" text-anchor="middle">team-finance</text>
  <text class="s" x="180" y="304" text-anchor="middle">LocalQueue "etl"</text>
  <text class="s" x="180" y="330" text-anchor="middle">batch/v1 Jobs, suspend: true</text>
  <text class="s" x="180" y="356" text-anchor="middle">etl-python (3.15) / etl-java (25)</text>

  <rect class="box" x="30" y="410" width="300" height="150" rx="12" fill="#a5d8ff"/>
  <text class="t" x="180" y="444" text-anchor="middle">team-reports</text>
  <text class="s" x="180" y="474" text-anchor="middle">LocalQueue "etl"</text>
  <text class="s" x="180" y="500" text-anchor="middle">batch/v1 Jobs, suspend: true</text>
  <text class="s" x="180" y="526" text-anchor="middle">etl-python (3.15) / etl-java (25)</text>

  <rect class="box" x="400" y="70" width="330" height="250" rx="12" fill="#ffd8a8"/>
  <text class="t" x="565" y="106" text-anchor="middle">Kueue v0.20.5 controller</text>
  <text class="s" x="565" y="138" text-anchor="middle">Job -> Workload (priority, cpu, memory)</text>
  <text class="s" x="565" y="166" text-anchor="middle">admit = unsuspend Job, pods start</text>
  <text class="s" x="565" y="194" text-anchor="middle">no quota = Job stays suspended</text>
  <text class="s" x="565" y="222" text-anchor="middle">preempt = suspend Job, requeue</text>
  <text class="s" x="565" y="250" text-anchor="middle">fair sharing across the cohort</text>
  <text class="s" x="565" y="290" text-anchor="middle">etl-low 100, etl-high 1000</text>

  <rect class="box" x="400" y="350" width="330" height="210" rx="12" fill="#d0bfff"/>
  <text class="t" x="565" y="386" text-anchor="middle">ETL Job pod (250m, 320Mi)</text>
  <text class="s" x="565" y="418" text-anchor="middle">20000 generated sales rows</text>
  <text class="s" x="565" y="446" text-anchor="middle">chained SHA-256, 3000 rounds per row</text>
  <text class="s" x="565" y="474" text-anchor="middle">writes &lt;pod&gt;.started first</text>
  <text class="s" x="565" y="502" text-anchor="middle">writes &lt;pod&gt;.json at the end</text>
  <text class="s" x="565" y="530" text-anchor="middle">hostPath /results/&lt;job&gt;/</text>

  <rect class="box" x="800" y="70" width="370" height="490" rx="14" fill="#fff3bf"/>
  <text class="t" x="985" y="104" text-anchor="middle">cohort "etl" (default-flavor)</text>
  <rect class="box" x="820" y="125" width="330" height="125" rx="10" fill="#b2f2bb"/>
  <text class="t" x="985" y="158" text-anchor="middle">analytics-cq</text>
  <text class="s" x="985" y="186" text-anchor="middle">nominal 500m cpu, borrow up to 500m</text>
  <text class="s" x="985" y="212" text-anchor="middle">reclaimWithinCohort: Any</text>
  <text class="s" x="985" y="236" text-anchor="middle">BestEffortFIFO, weight 1</text>
  <rect class="box" x="820" y="270" width="330" height="125" rx="10" fill="#b2f2bb"/>
  <text class="t" x="985" y="303" text-anchor="middle">finance-cq</text>
  <text class="s" x="985" y="331" text-anchor="middle">nominal 500m cpu, borrow up to 500m</text>
  <text class="s" x="985" y="357" text-anchor="middle">reclaimWithinCohort: Any</text>
  <text class="s" x="985" y="381" text-anchor="middle">BestEffortFIFO, weight 1</text>
  <rect class="box" x="820" y="415" width="330" height="125" rx="10" fill="#b2f2bb"/>
  <text class="t" x="985" y="448" text-anchor="middle">reports-cq</text>
  <text class="s" x="985" y="476" text-anchor="middle">nominal 500m cpu, never borrows or lends</text>
  <text class="s" x="985" y="502" text-anchor="middle">withinClusterQueue: LowerPriority</text>
  <text class="s" x="985" y="526" text-anchor="middle">StrictFIFO</text>

  <path class="arrow" d="M330,145 C360,145 370,150 398,160"/>
  <path class="arrow" d="M330,315 C365,300 372,250 398,220"/>
  <path class="arrow" d="M330,485 C370,460 375,320 398,290"/>
  <path class="arrow" d="M730,195 C760,195 775,195 798,195"/>
  <path class="arrow" d="M565,320 L565,348"/>

  <rect class="box" x="30" y="610" width="520" height="130" rx="12" fill="#ffc9c9"/>
  <text class="t" x="290" y="645" text-anchor="middle">host: e2e pytest (Python 3.15)</text>
  <text class="s" x="290" y="675" text-anchor="middle">submits Jobs, polls Workloads every 0.5 s,</text>
  <text class="s" x="290" y="701" text-anchor="middle">records the admission timeline, checks</text>
  <text class="s" x="290" y="727" text-anchor="middle">.run/results against locally computed digests</text>

  <rect class="box" x="640" y="610" width="530" height="130" rx="12" fill="#c5f6fa"/>
  <text class="t" x="905" y="645" text-anchor="middle">KueueViz (kueue-system)</text>
  <text class="s" x="905" y="675" text-anchor="middle">frontend localhost:27650</text>
  <text class="s" x="905" y="701" text-anchor="middle">backend websocket localhost:27651</text>
  <text class="s" x="905" y="727" text-anchor="middle">both through kubectl port-forward</text>

  <path class="arrow" d="M290,608 C290,590 250,585 200,563"/>
  <path class="arrow" d="M480,608 C500,590 540,585 560,563"/>
  <path class="arrow" d="M905,608 L905,543"/>
</svg>
