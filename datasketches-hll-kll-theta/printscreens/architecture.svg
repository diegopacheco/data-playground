<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2933; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
  </defs>
  <rect width="1100" height="500" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1f2933" stroke-width="2">
    <rect x="30" y="140" width="200" height="130" rx="10" fill="#d3f9d8"/>
    <rect x="300" y="110" width="230" height="190" rx="10" fill="#ffd8a8"/>
    <rect x="600" y="60" width="210" height="110" rx="10" fill="#e5dbff"/>
    <rect x="600" y="230" width="210" height="110" rx="10" fill="#d0ebff"/>
    <rect x="870" y="60" width="200" height="110" rx="10" fill="#fff3bf"/>
    <rect x="870" y="230" width="200" height="110" rx="10" fill="#fcc2d7"/>
    <rect x="600" y="390" width="210" height="80" rx="10" fill="#f1f3f5"/>
    <line x1="230" y1="205" x2="297" y2="205" marker-end="url(#arrow)"/>
    <line x1="530" y1="160" x2="597" y2="120" marker-end="url(#arrow)"/>
    <line x1="810" y1="115" x2="867" y2="115" marker-end="url(#arrow)"/>
    <line x1="810" y1="285" x2="867" y2="285" marker-end="url(#arrow)"/>
    <line x1="705" y1="170" x2="705" y2="227" marker-end="url(#arrow)"/>
    <line x1="130" y1="270" x2="597" y2="425" marker-end="url(#arrow)"/>
    <line x1="970" y1="340" x2="813" y2="420" marker-end="url(#arrow)"/>
  </g>
  <text x="550" y="38" font-size="32" font-weight="700" text-anchor="middle">datasketches-hll-kll-theta</text>
  <text x="130" y="175" font-size="24" text-anchor="middle">data/ (gen.py)</text>
  <text x="130" y="202" font-size="17" text-anchor="middle">10M events</text>
  <text x="130" y="224" font-size="17" text-anchor="middle">8 partitions .npz</text>
  <text x="130" y="246" font-size="17" text-anchor="middle">user, platform, latency, item</text>
  <text x="415" y="145" font-size="24" text-anchor="middle">sketches.py per partition</text>
  <text x="415" y="175" font-size="18" text-anchor="middle">HLL_4 lg_k 12: distinct users</text>
  <text x="415" y="200" font-size="18" text-anchor="middle">KLL k 200: latency quantiles</text>
  <text x="415" y="225" font-size="18" text-anchor="middle">Theta lg_k 12: web / mobile users</text>
  <text x="415" y="250" font-size="18" text-anchor="middle">Frequent Items + Count-Min: items</text>
  <text x="415" y="280" font-size="16" text-anchor="middle">datasketches 5.2.0, Python 3.13</text>
  <text x="705" y="95" font-size="24" text-anchor="middle">results/sketches/</text>
  <text x="705" y="122" font-size="17" text-anchor="middle">p0..p7 serialized bytes</text>
  <text x="705" y="146" font-size="17" text-anchor="middle">about 220 KB per partition</text>
  <text x="705" y="265" font-size="24" text-anchor="middle">merge (unions)</text>
  <text x="705" y="292" font-size="17" text-anchor="middle">hll_union, kll.merge, theta_union</text>
  <text x="705" y="316" font-size="17" text-anchor="middle">intersection, a_not_b</text>
  <text x="970" y="95" font-size="24" text-anchor="middle">results.json</text>
  <text x="970" y="122" font-size="17" text-anchor="middle">estimates, bounds, sizes</text>
  <text x="970" y="146" font-size="17" text-anchor="middle">lg_k and k sweeps</text>
  <text x="970" y="265" font-size="24" text-anchor="middle">r17-app :28200</text>
  <text x="970" y="292" font-size="17" text-anchor="middle">REST API + HTML UI</text>
  <text x="970" y="316" font-size="17" text-anchor="middle">/api/merge live merge</text>
  <text x="705" y="422" font-size="24" text-anchor="middle">exact answers</text>
  <text x="705" y="448" font-size="17" text-anchor="middle">numpy over raw rows</text>
  <text x="260" y="420" font-size="17" text-anchor="middle">tests recompute exact from raw rows</text>
</svg>
