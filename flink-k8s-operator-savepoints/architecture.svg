<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', cursive; fill: #1e1e1e; }
      .t { font-size: 25px; font-weight: 700; }
      .s { font-size: 19px; }
      .box { stroke: #1e1e1e; stroke-width: 2.2; filter: url(#wobble); }
      .arrow { stroke: #1e1e1e; stroke-width: 2.2; fill: none; filter: url(#wobble); marker-end: url(#head); }
    </style>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1100" height="600"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1e1e1e" stroke-width="2"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="600" fill="#ffffff"/>
  <rect class="box" x="10" y="20" width="1080" height="560" rx="18" fill="none" stroke-dasharray="8 6"/>
  <text class="s" x="30" y="50">kind cluster "flink-k8s-operator-savepoints" (podman)</text>

  <rect class="box" x="30" y="90" width="220" height="130" rx="12" fill="#ffd8a8"/>
  <text class="t" x="140" y="126" text-anchor="middle">e2e tests</text>
  <text class="s" x="140" y="156" text-anchor="middle">kubectl patch spec.job:</text>
  <text class="s" x="140" y="180" text-anchor="middle">args, parallelism,</text>
  <text class="s" x="140" y="204" text-anchor="middle">upgradeMode</text>

  <rect class="box" x="30" y="330" width="220" height="130" rx="12" fill="#e9ecef"/>
  <text class="t" x="140" y="366" text-anchor="middle">cert-manager</text>
  <text class="s" x="140" y="394" text-anchor="middle">v1.21.3</text>
  <text class="s" x="140" y="418" text-anchor="middle">TLS for the operator</text>
  <text class="s" x="140" y="442" text-anchor="middle">admission webhook</text>

  <rect class="box" x="290" y="200" width="270" height="180" rx="12" fill="#a5d8ff"/>
  <text class="t" x="425" y="238" text-anchor="middle">Flink K8s Operator</text>
  <text class="s" x="425" y="266" text-anchor="middle">1.16.1, watches</text>
  <text class="s" x="425" y="290" text-anchor="middle">FlinkDeployment CRs</text>
  <text class="s" x="425" y="318" text-anchor="middle">spec change: stop-with-</text>
  <text class="s" x="425" y="342" text-anchor="middle">savepoint, redeploy from it</text>

  <rect class="box" x="600" y="80" width="290" height="210" rx="12" fill="#b2f2bb"/>
  <text class="t" x="745" y="115" text-anchor="middle">clicks-java</text>
  <text class="s" x="745" y="145" text-anchor="middle">application mode, Flink 2.3.0</text>
  <text class="s" x="745" y="169" text-anchor="middle">JobManager + TaskManager</text>
  <text class="s" x="745" y="193" text-anchor="middle">DataGeneratorSource 20/s</text>
  <text class="s" x="745" y="217" text-anchor="middle">keyBy user, ValueState count</text>
  <text class="s" x="745" y="241" text-anchor="middle">print CLICKS user count</text>
  <text class="s" x="745" y="265" text-anchor="middle">UI localhost:27520</text>

  <rect class="box" x="600" y="320" width="290" height="210" rx="12" fill="#d0bfff"/>
  <text class="t" x="745" y="355" text-anchor="middle">clicks-python</text>
  <text class="s" x="745" y="385" text-anchor="middle">PyFlink 2.3.0, Python 3.12</text>
  <text class="s" x="745" y="409" text-anchor="middle">datagen table sequence 20/s</text>
  <text class="s" x="745" y="433" text-anchor="middle">key_by user, Python state</text>
  <text class="s" x="745" y="457" text-anchor="middle">same CLICKS output line</text>
  <text class="s" x="745" y="481" text-anchor="middle">UI localhost:27521</text>

  <rect class="box" x="930" y="170" width="140" height="270" rx="12" fill="#ffec99"/>
  <text class="t" x="1000" y="206" text-anchor="middle">PVC</text>
  <text class="t" x="1000" y="234" text-anchor="middle">flink-state</text>
  <text class="s" x="1000" y="270" text-anchor="middle">/flink-data/job/</text>
  <text class="s" x="1000" y="296" text-anchor="middle">checkpoints</text>
  <text class="s" x="1000" y="322" text-anchor="middle">every 5s</text>
  <text class="s" x="1000" y="356" text-anchor="middle">/flink-data/job/</text>
  <text class="s" x="1000" y="382" text-anchor="middle">savepoints</text>
  <text class="s" x="1000" y="408" text-anchor="middle">on upgrade</text>

  <path class="arrow" d="M250,160 C280,165 300,180 330,198"/>
  <path class="arrow" d="M250,390 C280,385 300,375 325,382"/>
  <path class="arrow" d="M560,250 C575,230 580,200 595,190"/>
  <path class="arrow" d="M560,330 C575,350 580,390 595,410"/>
  <path class="arrow" d="M890,200 L925,240"/>
  <path class="arrow" d="M890,420 L925,370"/>
  <text class="s" x="290" y="560">tests read TaskManager logs and the Flink REST API through the API server proxy</text>
</svg>
