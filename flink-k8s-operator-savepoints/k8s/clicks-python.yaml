apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: clicks-python
  namespace: default
spec:
  image: localhost/flink-k8s-operator-savepoints-python:v1
  imagePullPolicy: Never
  flinkVersion: v2_3
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    execution.checkpointing.interval: 5s
    execution.checkpointing.dir: file:///flink-data/clicks-python/checkpoints
    execution.checkpointing.savepoint-dir: file:///flink-data/clicks-python/savepoints
    state.backend.type: hashmap
    python.fn-execution.bundle.size: "10"
    python.fn-execution.bundle.time: "100"
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          volumeMounts:
            - name: flink-state
              mountPath: /flink-data
      volumes:
        - name: flink-state
          persistentVolumeClaim:
            claimName: flink-state
  jobManager:
    replicas: 1
    resource:
      memory: 1024m
      cpu: 0.5
  taskManager:
    resource:
      memory: 1536m
      cpu: 0.5
  job:
    jarURI: local:///opt/flink/opt/flink-python-2.3.0.jar
    entryClass: org.apache.flink.client.python.PythonDriver
    args: ["-pym", "clicks_py.job", "--version", "v1", "--users", "10", "--rate", "20"]
    parallelism: 1
    upgradeMode: savepoint
    state: running
