<text x="115" y="258" text-anchor="middle" class="s">kill -9 the worker</text>
<text x="115" y="280" text-anchor="middle" class="s">inside an open batch,</text>
<text x="115" y="302" text-anchor="middle" class="s">then restart it</text>
