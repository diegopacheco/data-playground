<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <defs>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="360">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2937; }
      .title { font-size: 26px; font-weight: 700; }
      .note { font-size: 19px; }
      .box { stroke: #374151; stroke-width: 2.2; filter: url(#wobble); }
      .flow { stroke: #374151; stroke-width: 2.4; fill: none; marker-end: url(#arrow); filter: url(#wobble); }
    </style>
  </defs>
  <rect width="1000" height="360" fill="#ffffff"/>

  <rect class="box" x="30" y="60" width="150" height="90" rx="14" fill="#fde2e4"/>
  <text class="title" x="105" y="98" text-anchor="middle">orders.csv</text>
  <text class="note" x="105" y="126" text-anchor="middle">200 rows</text>

  <rect class="box" x="240" y="60" width="170" height="90" rx="14" fill="#e2ece9"/>
  <text class="title" x="325" y="98" text-anchor="middle">OrdersProducer</text>
  <text class="note" x="325" y="126" text-anchor="middle">key = order_id</text>

  <rect class="box" x="470" y="60" width="170" height="90" rx="14" fill="#fff1c1"/>
  <text class="title" x="555" y="98" text-anchor="middle">Kafka 4.3.1</text>
  <text class="note" x="555" y="126" text-anchor="middle">topic orders (KRaft)</text>

  <rect class="box" x="700" y="40" width="270" height="130" rx="14" fill="#dbe7ff"/>
  <text class="title" x="835" y="78" text-anchor="middle">RevenueStreams</text>
  <text class="note" x="835" y="106" text-anchor="middle">groupBy category</text>
  <text class="note" x="835" y="130" text-anchor="middle">aggregate count, qty, revenue</text>
  <text class="note" x="835" y="154" text-anchor="middle">toStream().foreach upsert</text>

  <rect class="box" x="700" y="230" width="270" height="100" rx="14" fill="#e9dcf7"/>
  <text class="title" x="835" y="268" text-anchor="middle">Cassandra 5.0.9</text>
  <text class="note" x="835" y="298" text-anchor="middle">sales.revenue_by_category</text>

  <rect class="box" x="400" y="230" width="220" height="100" rx="14" fill="#e2ece9"/>
  <text class="title" x="510" y="268" text-anchor="middle">UiServer</text>
  <text class="note" x="510" y="298" text-anchor="middle">GET /api/revenue, GET /</text>

  <rect class="box" x="120" y="230" width="200" height="100" rx="14" fill="#fde2e4"/>
  <text class="title" x="220" y="268" text-anchor="middle">Browser</text>
  <text class="note" x="220" y="298" text-anchor="middle">table + SVG bars</text>

  <path class="flow" d="M180,105 L236,105"/>
  <path class="flow" d="M410,105 L466,105"/>
  <path class="flow" d="M640,105 L696,105"/>
  <path class="flow" d="M835,170 L835,226"/>
  <path class="flow" d="M700,280 L624,280"/>
  <path class="flow" d="M400,280 L324,280"/>
</svg>
