<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lance vs Vortex vs Parquet</title>
<style>
:root { --bg: #f6f7f9; --card: #fff; --ink: #1d2433; --muted: #667085; --line: #e4e7ec;
  --parquet: #3b6fd8; --lance: #e0761f; --vortex: #1f9d6b; --ok: #1f9d6b; --bad: #d64545; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
header { padding: 18px 24px 0; }
h1 { margin: 0; font-size: 22px; }
.sub { color: var(--muted); margin-top: 4px; }
nav { display: flex; gap: 4px; padding: 14px 24px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
nav button { border: 0; background: none; padding: 10px 14px; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
nav button.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
main { padding: 20px 24px 40px; max-width: 1200px; }
.tab { display: none; }
.tab.on { display: block; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; }
.card { overflow-x: auto; }
td.num { white-space: nowrap; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.card h2 { margin: 0 0 4px; font-size: 15px; }
.card p.note { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill.ok { background: #e3f6ee; color: var(--ok); }
.pill.bad { background: #fde8e8; color: var(--bad); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
svg text { font-size: 12px; fill: var(--ink); }
svg text.val { fill: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font-size: 20px; }
.stat span { color: var(--muted); font-size: 12px; }
form { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-bottom: 12px; }
label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
input { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; width: 120px; }
form button { font: inherit; padding: 7px 14px; border-radius: 6px; border: 0; background: var(--ink); color: #fff; cursor: pointer; }
code { background: #eef1f5; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.full { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>Lance vs Vortex vs Parquet</h1>
  <div class="sub" id="sub">loading results</div>
</header>
<nav id="nav">
  <button data-tab="storage" class="on">Storage and writes</button>
  <button data-tab="reads">Reads</button>
  <button data-tab="take">Random access (live)</button>
  <button data-tab="vector">Vector search (Lance)</button>
  <button data-tab="checks">Correctness</button>
</nav>
<main>
  <section class="tab on" id="storage"></section>
  <section class="tab" id="reads"></section>
  <section class="tab" id="take">
    <div class="card">
      <h2>Take N random rows by index, live against the files on disk</h2>
      <p class="note">Each format opens its file and fetches the same sorted random row indices with all 8 columns. Every result is compared with the Parquet result row by row.</p>
      <form id="takeForm">
        <label>rows (n)<input name="n" type="number" value="100" min="1" max="10000"></label>
        <label>seed<input name="seed" type="number" value="7"></label>
        <button>Run take</button>
      </form>
      <div id="takeOut"></div>
    </div>
  </section>
  <section class="tab" id="vector"></section>
  <section class="tab" id="checks"></section>
</main>
<script>
const COLORS = { parquet: "var(--parquet)", lance: "var(--lance)", vortex: "var(--vortex)" };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mb = b => (b / 1e6).toFixed(2) + " MB";
const ms = v => v >= 1000 ? (v / 1000).toFixed(2) + " s" : v >= 10 ? v.toFixed(0) + " ms" : v.toFixed(2) + " ms";
const pill = ok => `<span class="pill ${ok ? "ok" : "bad"}">${ok ? "OK" : "FAIL"}</span>`;

document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#nav button, .tab").forEach(e => e.classList.remove("on"));
  b.classList.add("on");
  $(b.dataset.tab).classList.add("on");
});

function bars(rows, fmt) {
  const w = 440, label = 64, gap = 5, h = 20;
  const max = Math.max(...rows.flatMap(r => r.values.map(v => v.value)), 1e-9);
  let y = 4, out = "";
  rows.forEach(r => {
    out += `<text x="0" y="${y + (h * r.values.length + gap * (r.values.length - 1)) / 2 + 4}">${esc(r.label)}</text>`;
    r.values.forEach(v => {
      const bw = Math.max(2, (w - label - 150) * v.value / max);
      out += `<rect x="${label}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${COLORS[r.label]}" opacity="${v.light ? 0.38 : 1}"></rect>`;
      out += `<text class="val" x="${label + bw + 6}" y="${y + 15}">${esc(fmt(v.value))}${v.tag ? " " + esc(v.tag) : ""}</text>`;
      y += h + gap;
    });
    y += 8;
  });
  return `<svg viewBox="0 0 ${w} ${y}" width="100%" style="max-width:${w}px" role="img">${out}</svg>`;
}

const coldWarm = (formats, key) => bars(formats.map(f => ({ label: f.name, values: [
  { value: f[key].median, tag: "warm" }, { value: f[key].cold, light: true, tag: "cold" }] })), ms);

const legend = `<div class="legend"><span><i style="background:#999"></i>solid: median of warm runs</span><span><i style="background:#999;opacity:.38"></i>light: first (cold) run</span></div>`;

function card(title, note, body, cls = "") {
  return `<div class="card ${cls}"><h2>${title}</h2><p class="note">${note}</p>${body}</div>`;
}

function renderStorage(d) {
  const f = d.formats;
  $("storage").innerHTML = `<div class="grid">
    ${card("File size, all 8 columns", `Arrow in memory: ${mb(d.arrow_bytes)}. Ratio = Arrow bytes / file bytes. The 16 float32 embedding column is about 64 MB of noisy floats and dominates.`,
      bars(f.map(x => ({ label: x.name, values: [{ value: x.size_bytes, tag: (d.arrow_bytes / x.size_bytes).toFixed(2) + "x" }] })), mb))}
    ${card("File size, 7 scalar columns only", `Same rows without the embedding column. Arrow in memory: ${mb(d.arrow_scalar_bytes)}. This is where the encodings differ.`,
      bars(f.map(x => ({ label: x.name, values: [{ value: x.scalar_size_bytes, tag: (d.arrow_scalar_bytes / x.scalar_size_bytes).toFixed(1) + "x" }] })), mb))}
    ${card("Write time", "Whole in-memory Arrow table to a new file (Lance: a new dataset directory). " + legend, coldWarm(f, "write_ms"))}
  </div>`;
}

function renderReads(d) {
  const f = d.formats;
  const row = x => `<tr><td>${x.name}</td>${["write_ms", "scan_ms", "filter_ms", "take_ms"].map(k => `<td class="num">${ms(x[k].cold)}</td><td class="num"><b>${ms(x[k].median)}</b></td>`).join("")}</tr>`;
  $("reads").innerHTML = `${legend}<div class="grid">
    ${card("Full scan", "Open the file and read every row and column into an Arrow table.", coldWarm(f, "scan_ms"))}
    ${card("Filtered scan with projection", `<code>${esc(d.filter.sql)}</code>, ${d.filter.expected_rows.toLocaleString()} rows. Predicate pushed into each reader.`, coldWarm(f, "filter_ms"))}
    ${card(`Random access: take ${d.take_n} rows`, `Fetch ${d.take_n} random sorted row indices out of ${d.rows.toLocaleString()}, all columns. Parquet uses pyarrow dataset take, Lance dataset.take, Vortex scan(indices=...).`, coldWarm(f, "take_ms"))}
    ${card("All timings", `cold = first run, warm = median of ${d.iterations} runs`, `<table><tr><th>format</th>${["write", "scan", "filter", "take"].map(k => `<th class="num">${k} cold</th><th class="num">${k} warm</th>`).join("")}</tr>${f.map(row).join("")}</table>`, "full")}
  </div>`;
}

function renderVector(d) {
  const v = d.vector;
  const s = v.sample;
  $("vector").innerHTML = `<div class="stats">
      <div class="stat"><b>${ms(v.build_ms)}</b><span>${v.index.index_type} build on ${d.rows.toLocaleString()} vectors</span></div>
      <div class="stat"><b>${mb(v.index_bytes)}</b><span>index size on disk</span></div>
      <div class="stat"><b>${ms(v.ann_ms.median)}</b><span>ANN top ${v.k}, median of ${v.queries - 1}</span></div>
      <div class="stat"><b>${ms(v.flat_ms.median)}</b><span>brute force top ${v.k} (use_index=false)</span></div>
      <div class="stat"><b>${v.recall_at_k.toFixed(3)}</b><span>recall@${v.k} vs exact numpy search</span></div>
      <div class="stat"><b>${(v.same_category * 100).toFixed(0)}%</b><span>neighbours in the query row's category</span></div>
    </div>
    <div class="grid">
    ${card("ANN vs brute force latency", `${v.index.num_partitions} IVF partitions, ${v.index.num_sub_vectors} PQ sub vectors, nprobes ${v.search.nprobes}, refine_factor ${v.search.refine_factor}. Parquet and Vortex have no vector index.`,
      bars([{ label: "lance", values: [{ value: v.ann_ms.median, tag: "IVF_PQ index" }, { value: v.flat_ms.median, light: true, tag: "flat scan" }] }], ms))}
    ${card(`Benchmark sample: neighbours of order ${s.order_id} (${esc(s.product)})`, "Recorded during the benchmark run.", resultTable(s.results))}
    <div class="card full"><h2>Live nearest neighbour search</h2><p class="note">Uses the embedding of the given order as the query vector and runs the Lance ANN search and a flat search on the same dataset.</p>
      <form id="nnForm"><label>order_id<input name="order_id" type="number" value="4242" min="1" max="${d.rows}"></label><label>k<input name="k" type="number" value="10" min="1" max="100"></label><button>Search</button></form>
      <div id="nnOut"></div></div>
  </div>`;
  $("nnForm").onsubmit = async e => {
    e.preventDefault();
    const q = new URLSearchParams(new FormData(e.target));
    $("nnOut").textContent = "searching";
    const r = await (await fetch("/api/nearest?" + q)).json();
    if (r.error) { $("nnOut").textContent = r.error; return; }
    $("nnOut").innerHTML = `<p>Query: order ${r.order_id}, <b>${esc(r.product)}</b> (${esc(r.category)}). ANN ${ms(r.ann_ms)}, flat ${ms(r.flat_ms)}, overlap with flat ${(r.recall * 100).toFixed(0)}%.</p>${resultTable(r.results)}`;
  };
}

function resultTable(rows) {
  return `<table><tr><th>order_id</th><th>product</th><th>category</th><th class="num">distance</th></tr>${rows.map(r =>
    `<tr><td>${r.order_id}</td><td>${esc(r.product)}</td><td>${esc(r.category)}</td><td class="num">${r._distance.toFixed(4)}</td></tr>`).join("")}</table>`;
}

function renderChecks(d) {
  const src = d.source_checksums;
  const keys = ["rows", "order_id_sum", "quantity_sum", "ts_sum", "text_bytes", "embedding_sum"];
  const cell = (x, k) => { const same = JSON.stringify(x.checks.checksums[k]) === JSON.stringify(src[k]); return `<td class="num" style="color:${same ? "inherit" : "var(--bad)"}">${x.checks.checksums[k].toLocaleString()}</td>`; };
  $("checks").innerHTML = `<div class="grid">
    ${card("Round trip checks", "Each file is read back and compared with the source Arrow table, value by value.",
      `<table><tr><th>format</th><th>full scan equals source</th><th>checksums equal</th><th>filter equals</th><th>take equals</th></tr>${d.formats.map(x =>
        `<tr><td>${x.name}</td><td>${pill(x.checks.scan_equal)}</td><td>${pill(x.checks.checksums_equal)}</td><td>${pill(x.checks.filter_equal)} ${x.checks.filter_rows.toLocaleString()} rows</td><td>${pill(x.checks.take_equal)} ${x.checks.take_rows} rows</td></tr>`).join("")}</table>`, "full")}
    ${card("Checksums", "Computed on the table each format returns. The source row is computed on the generated Arrow table before any write.",
      `<table><tr><th></th>${keys.map(k => `<th class="num">${k}</th>`).join("")}</tr><tr><td>source</td>${keys.map(k => `<td class="num">${src[k].toLocaleString()}</td>`).join("")}</tr>${d.formats.map(x => `<tr><td>${x.name}</td>${keys.map(k => cell(x, k)).join("")}</tr>`).join("")}</table>`, "full")}
    ${card("Revenue per category", "count and sum(quantity * price) per category, identical for every format.",
      `<table><tr><th>category</th><th class="num">orders</th><th class="num">revenue</th>${d.formats.map(x => `<th>${x.name}</th>`).join("")}</tr>${Object.entries(src.revenue).map(([c, v]) =>
        `<tr><td>${c}</td><td class="num">${v[0].toLocaleString()}</td><td class="num">${v[1].toLocaleString()}</td>${d.formats.map(x => `<td>${pill(JSON.stringify(x.checks.checksums.revenue[c]) === JSON.stringify(v))}</td>`).join("")}</tr>`).join("")}</table>`, "full")}
  </div>`;
}

$("takeForm").onsubmit = async e => {
  e.preventDefault();
  const q = new URLSearchParams(new FormData(e.target));
  $("takeOut").textContent = "running";
  const r = await (await fetch("/api/take?" + q)).json();
  if (r.error) { $("takeOut").textContent = r.error; return; }
  $("takeOut").innerHTML = bars(r.results.map(x => ({ label: x.name, values: [{ value: x.ms, tag: `${x.rows} rows ${x.same_as_parquet ? "equal" : "DIFFERENT"}` }] })), ms)
    + `<p class="note">First indices: ${r.indices.join(", ")}</p><table><tr>${Object.keys(r.sample[0]).map(k => `<th>${k}</th>`).join("")}</tr>${r.sample.map(s => `<tr>${Object.values(s).map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</table>`;
};

fetch("/api/results").then(r => r.json()).then(d => {
  if (d.error) { $("sub").textContent = d.error; return; }
  const v = d.versions;
  $("sub").innerHTML = `${d.rows.toLocaleString()} rows, ${d.iterations} warm runs + 1 cold, ${d.cpus} CPUs, Python ${v.python}, pyarrow ${v.pyarrow}, pylance ${v.pylance}, vortex-data ${v["vortex-data"]} ${pill(d.all_ok)}`;
  renderStorage(d);
  renderReads(d);
  renderVector(d);
  renderChecks(d);
});
</script>
</body>
</html>
