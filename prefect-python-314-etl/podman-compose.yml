name: i37-prefect-etl

services:
  postgres:
    image: docker.io/library/postgres:18.6-alpine
    container_name: i37-postgres
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: sales
    ports:
      - "${POSTGRES_PORT:-23732}:5432"
    volumes:
      - i37-pgdata:/var/lib/postgresql
    networks:
      - i37-net

  prefect:
    image: docker.io/prefecthq/prefect:3.8.6-python3.14
    container_name: i37-prefect
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_UI_API_URL: http://localhost:${PREFECT_PORT:-23742}/api
      PREFECT_SERVER_UI_API_URL: http://localhost:${PREFECT_PORT:-23742}/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "${PREFECT_PORT:-23742}:4200"
    volumes:
      - i37-prefect-home:/root/.prefect
    networks:
      - i37-net

volumes:
  i37-pgdata:
    name: i37-pgdata
  i37-prefect-home:
    name: i37-prefect-home

networks:
  i37-net:
    name: i37-net
