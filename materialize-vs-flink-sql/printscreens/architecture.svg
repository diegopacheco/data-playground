<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="620" viewBox="0 0 1220 620">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2933; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
  </defs>
  <rect width="1220" height="620" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1f2933" stroke-width="2">
    <rect x="20" y="220" width="170" height="90" rx="10" fill="#d3f9d8"/>
    <rect x="240" y="170" width="270" height="200" rx="10" fill="#ffd8a8"/>
    <rect x="560" y="200" width="250" height="110" rx="10" fill="#d0ebff"/>
    <rect x="880" y="40" width="310" height="210" rx="10" fill="#e5dbff"/>
    <rect x="860" y="300" width="350" height="240" rx="14" fill="#f8f9fa" stroke-dasharray="8 6"/>
    <rect x="880" y="340" width="310" height="60" rx="10" fill="#ffe3e3"/>
    <rect x="880" y="450" width="140" height="70" rx="10" fill="#ffe3e3"/>
    <rect x="1050" y="450" width="140" height="70" rx="10" fill="#ffe3e3"/>
    <line x1="190" y1="265" x2="237" y2="265" marker-end="url(#arrow)"/>
    <line x1="510" y1="270" x2="557" y2="260" marker-end="url(#arrow)"/>
    <line x1="510" y1="190" x2="877" y2="120" marker-end="url(#arrow)"/>
    <line x1="510" y1="350" x2="877" y2="375" marker-end="url(#arrow)"/>
    <line x1="810" y1="220" x2="877" y2="190" marker-end="url(#arrow)"/>
    <line x1="720" y1="310" x2="917" y2="447" marker-end="url(#arrow)"/>
    <line x1="1120" y1="400" x2="1120" y2="447" marker-end="url(#arrow)"/>
    <line x1="1020" y1="485" x2="1050" y2="485"/>
  </g>
  <text x="250" y="52" font-size="32" font-weight="700" text-anchor="middle">materialize-vs-flink-sql</text>
  <text x="250" y="84" font-size="19" text-anchor="middle">same upsert topics, same SQL, one independent answer</text>
  <text x="105" y="258" font-size="22" text-anchor="middle">browser</text>
  <text x="105" y="283" font-size="17" text-anchor="middle">5 tab UI</text>
  <text x="375" y="202" font-size="24" text-anchor="middle">t2-app: server.py</text>
  <text x="375" y="228" font-size="17" text-anchor="middle">Python 3.14, stdlib http.server</text>
  <text x="375" y="252" font-size="17" text-anchor="middle">kafka-python producer</text>
  <text x="375" y="276" font-size="17" text-anchor="middle">psycopg reads, probes, SUBSCRIBE</text>
  <text x="375" y="300" font-size="17" text-anchor="middle">SQL Gateway REST client</text>
  <text x="375" y="324" font-size="17" text-anchor="middle">oracle replays the input</text>
  <text x="375" y="348" font-size="17" text-anchor="middle">tests run here</text>
  <text x="685" y="232" font-size="24" text-anchor="middle">t2-redpanda v26.2.6</text>
  <text x="685" y="258" font-size="17" text-anchor="middle">orders_rN, customers_rN</text>
  <text x="685" y="282" font-size="17" text-anchor="middle">1 partition, keyed, tombstones</text>
  <text x="1035" y="74" font-size="24" text-anchor="middle">t2-materialize v26.48.2</text>
  <text x="1035" y="100" font-size="17" text-anchor="middle">emulator: environmentd + clusterd</text>
  <text x="1035" y="126" font-size="17" text-anchor="middle">KAFKA source ENVELOPE UPSERT</text>
  <text x="1035" y="150" font-size="17" text-anchor="middle">4 MATERIALIZED VIEWs, RETAIN HISTORY</text>
  <text x="1035" y="174" font-size="17" text-anchor="middle">strict serializable reads</text>
  <text x="1035" y="198" font-size="17" text-anchor="middle">real time recency, SUBSCRIBE AS OF</text>
  <text x="1035" y="226" font-size="17" text-anchor="middle">pgwire 6875, console 6874</text>
  <text x="1035" y="326" font-size="20" text-anchor="middle">Flink 2.2.1 + kafka connector 5.0.0-2.2</text>
  <text x="1035" y="368" font-size="22" text-anchor="middle">t2-flink-gateway</text>
  <text x="1035" y="390" font-size="16" text-anchor="middle">SQL Gateway REST 8083</text>
  <text x="950" y="480" font-size="20" text-anchor="middle">t2-flink-tm</text>
  <text x="950" y="504" font-size="16" text-anchor="middle">4 slots, p=1</text>
  <text x="1120" y="480" font-size="20" text-anchor="middle">t2-flink-jm</text>
  <text x="1120" y="504" font-size="16" text-anchor="middle">jobmanager 8081</text>
  <text x="1150" y="430" font-size="16" text-anchor="middle">submit</text>
  <text x="535" y="250" font-size="16" text-anchor="middle">produce</text>
  <text x="650" y="125" font-size="17" text-anchor="middle">DDL, SELECT, probe loop, SUBSCRIBE</text>
  <text x="690" y="385" font-size="17" text-anchor="middle">sessions, statements, changelog rows</text>
  <text x="855" y="226" font-size="16" text-anchor="middle">source</text>
  <text x="770" y="420" font-size="16" text-anchor="middle">upsert-kafka, bounded</text>
  <text x="214" y="255" font-size="16" text-anchor="middle">http</text>
  <text x="250" y="450" font-size="18" text-anchor="start">1. drop the old views and topics, create new ones</text>
  <text x="250" y="476" font-size="18" text-anchor="start">2. produce 131 records in 6 phases while probes read Materialize</text>
  <text x="250" y="502" font-size="18" text-anchor="start">3. read Materialize with real time recency, SUBSCRIBE the history</text>
  <text x="250" y="528" font-size="18" text-anchor="start">4. run the same 4 queries in Flink, collect the changelog</text>
  <text x="250" y="554" font-size="18" text-anchor="start">5. compare both with the answer replayed from the input</text>
</svg>
