spring.main.banner-mode=off
spring.main.web-application-type=none
producer.endpoint=${S3_ENDPOINT:http://minio:9000}
producer.access-key=${S3_ACCESS_KEY:minioadmin}
producer.secret-key=${S3_SECRET_KEY:minioadmin}
producer.bucket=${S3_BUCKET:events}
producer.mode=${PRODUCER_MODE:steady}
producer.run-id=${RUN_ID:}
producer.interval=${PRODUCER_INTERVAL:5s}
producer.batches=${PRODUCER_BATCHES:0}
producer.files-per-batch=${FILES_PER_BATCH:4}
producer.events-per-file=${EVENTS_PER_FILE:250}
