<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iceberg Nessie Branches</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#1d2330;--muted:#687087;--line:#e3e6ec;--a:#4f7cff;--b:#f08a3c;--up:#1f9d55;--down:#d64545}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:20px 24px 8px}
h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--muted)}
main{display:grid;grid-template-columns:2fr 1fr;gap:16px;padding:16px 24px 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{margin:0 0 12px;font-size:15px}
.wide{grid-column:1/-1}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
.up{color:var(--up)}.down{color:var(--down)}
.ref{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.pill{font-size:11px;padding:1px 7px;border-radius:9px;background:#eef2ff;color:#3446a8}
.pill.TAG{background:#fff3e6;color:#a4561b}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.log{max-height:360px;overflow:auto}
.commit{padding:7px 0;border-bottom:1px solid var(--line)}
.commit .msg{font-weight:500}
.logs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
svg text{font:12px system-ui,sans-serif;fill:var(--muted)}
#err{color:var(--down)}
@media(max-width:860px){main,.logs{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>Iceberg on Nessie: git-like branches for data</h1>
<p>Trino queries the same Iceberg table on different Nessie references. Revenue = sum(quantity x price) per category.</p>
<p id="err"></p>
</header>
<main>
<section class="card">
<h2>Per-category revenue</h2>
<div class="controls">
<label><span class="dot" style="background:var(--a)"></span>A <select id="refA"></select></label>
<label><span class="dot" style="background:var(--b)"></span>B <select id="refB"></select></label>
</div>
<svg id="chart" width="100%" height="300"></svg>
<table id="table"></table>
</section>
<section class="card">
<h2>References</h2>
<div id="refs"></div>
</section>
<section class="card wide">
<h2>Commit log</h2>
<div class="logs" id="logs"></div>
</section>
</main>
<script>
let data = null;
const $ = id => document.getElementById(id);
const money = v => Number(v).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function byCategory(ref) {
  const m = {};
  (data.revenue[ref] || []).forEach(r => m[r.category] = r);
  return m;
}

function render() {
  const a = $("refA").value, b = $("refB").value;
  const ma = byCategory(a), mb = byCategory(b);
  const cats = [...new Set([...Object.keys(ma), ...Object.keys(mb)])].sort();
  const max = Math.max(1, ...cats.flatMap(c => [Number((ma[c] || {}).revenue || 0), Number((mb[c] || {}).revenue || 0)]));
  const svg = $("chart"), w = svg.clientWidth || 600, h = 300, pad = 30, band = (w - pad) / cats.length, bw = Math.min(34, band / 3);
  let s = `<line x1="${pad}" y1="${h - pad}" x2="${w}" y2="${h - pad}" stroke="#e3e6ec"/>`;
  cats.forEach((c, i) => {
    const x = pad + i * band + band / 2;
    [[ma[c], "var(--a)", -bw - 2], [mb[c], "var(--b)", 2]].forEach(([r, color, off]) => {
      const v = Number((r || {}).revenue || 0), bh = (h - pad * 2) * v / max;
      s += `<rect x="${x + off}" y="${h - pad - bh}" width="${bw}" height="${bh}" rx="3" fill="${color}"><title>${esc(c)}: ${money(v)}</title></rect>`;
    });
    s += `<text x="${x}" y="${h - 10}" text-anchor="middle">${esc(c)}</text>`;
  });
  svg.innerHTML = s;
  let t = `<tr><th>category</th><th>orders A</th><th>revenue A</th><th>orders B</th><th>revenue B</th><th>B - A</th></tr>`;
  let ta = 0, tb = 0;
  cats.forEach(c => {
    const ra = Number((ma[c] || {}).revenue || 0), rb = Number((mb[c] || {}).revenue || 0), d = rb - ra;
    ta += ra; tb += rb;
    t += `<tr><td>${esc(c)}</td><td>${(ma[c] || {}).orders || 0}</td><td>${money(ra)}</td><td>${(mb[c] || {}).orders || 0}</td><td>${money(rb)}</td><td class="${d > 0 ? "up" : d < 0 ? "down" : ""}">${money(d)}</td></tr>`;
  });
  t += `<tr><th>total</th><th></th><th>${money(ta)}</th><th></th><th>${money(tb)}</th><th>${money(tb - ta)}</th></tr>`;
  $("table").innerHTML = t;
}

function renderRefs() {
  $("refs").innerHTML = data.refs.map(r => `<div class="ref"><span><span class="pill ${r.type}">${r.type.toLowerCase()}</span> <b>${esc(r.name)}</b></span><code>${r.hash.slice(0, 12)}</code></div>`).join("");
  $("logs").innerHTML = Object.entries(data.log).map(([name, entries]) => `<div><h2>${esc(name)}</h2><div class="log">${entries.map(e => `<div class="commit"><div class="msg">${esc(e.message)}</div><code>${e.hash.slice(0, 12)} ${esc(e.time)}</code>${data.refs.filter(r => r.type === "TAG" && r.hash === e.hash).map(r => ` <span class="pill TAG">${esc(r.name)}</span>`).join("")}</div>`).join("")}</div></div>`).join("");
}

function fillSelect(id, value) {
  $(id).innerHTML = Object.keys(data.revenue).map(n => `<option ${n === value ? "selected" : ""}>${esc(n)}</option>`).join("");
  $(id).onchange = render;
}

fetch("/api/summary").then(r => r.json()).then(d => {
  if (d.error) throw new Error(d.error);
  data = d;
  fillSelect("refA", "initial");
  fillSelect("refB", "dev");
  renderRefs();
  render();
}).catch(e => $("err").textContent = "failed to load: " + e.message);
window.addEventListener("resize", () => data && render());
</script>
</body>
</html>
