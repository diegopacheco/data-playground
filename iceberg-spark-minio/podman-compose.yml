name: i1-lake

services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: i1-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "20100:9000"
      - "20101:9001"
    volumes:
      - i1-minio-data:/data
    networks:
      - i1-net

  bucket:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: i1-bucket
    depends_on:
      - minio
    restart: on-failure
    environment:
      MC_HOST_lake: http://admin:password@i1-minio:9000
    command: ["mb", "--ignore-existing", "lake/warehouse"]
    networks:
      - i1-net

  rest:
    image: docker.io/apache/iceberg-rest-fixture:1.10.1
    container_name: i1-rest
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_URI: jdbc:sqlite:file:/catalog/iceberg_catalog.db
      CATALOG_JDBC_USER: user
      CATALOG_JDBC_PASSWORD: password
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://i1-minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "20102:8181"
    volumes:
      - i1-catalog-data:/catalog
    networks:
      - i1-net

volumes:
  i1-minio-data:
    name: i1-minio-data
  i1-catalog-data:
    name: i1-catalog-data

networks:
  i1-net:
    name: i1-net
