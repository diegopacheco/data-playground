    <line x1="510" y1="305" x2="510" y2="277" marker-end="url(#arrow)"/>
    <line x1="700" y1="385" x2="625" y2="278" marker-end="url(#arrow)"/>
    <line x1="940" y1="385" x2="1030" y2="258" marker-end="url(#arrow)"/>
    <line x1="230" y1="420" x2="658" y2="420" marker-end="url(#arrow)"/>
  </g>
  <text x="600" y="45" font-size="32" font-weight="700" text-anchor="middle">fluss-flink-paimon</text>
  <text x="600" y="75" font-size="20" text-anchor="middle">Fluss 1.0 streaming storage, Flink 2.2 tiering and union read, Paimon 2.0 lake</text>
