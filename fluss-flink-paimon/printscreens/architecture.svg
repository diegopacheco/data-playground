  <text x="1055" y="232" font-size="17" text-anchor="middle">one snapshot per round</text>
  <text x="510" y="336" font-size="20" text-anchor="middle">ZooKeeper 3.9</text>
  <text x="820" y="413" font-size="22" text-anchor="middle">UI + REST (JDK HttpServer)</text>
  <text x="820" y="440" font-size="17" text-anchor="middle">lookup, KV scan, orders$lake, union read</text>
  <text x="125" y="426" font-size="21" text-anchor="middle">test_lakehouse.py</text>
  <text x="672" y="322" font-size="16" text-anchor="start">Lookuper + BatchScanner</text>
