  <text x="300" y="183" font-size="23" text-anchor="middle">App (Java 25)</text>
  <text x="300" y="207" font-size="17" text-anchor="middle">Fluss UpsertWriter</text>
  <text x="300" y="228" font-size="17" text-anchor="middle">POST /api/ingest</text>
  <text x="545" y="148" font-size="24" text-anchor="middle">Fluss 1.0 cluster</text>
  <text x="545" y="175" font-size="17" text-anchor="middle">PK table fluss.orders</text>
  <text x="545" y="198" font-size="17" text-anchor="middle">tablet: RocksDB KV + changelog</text>
  <text x="545" y="221" font-size="17" text-anchor="middle">coordinator: tiering schedule</text>
  <text x="545" y="244" font-size="17" text-anchor="middle">datalake.enabled, freshness 5s</text>
