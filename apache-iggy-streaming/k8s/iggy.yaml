apiVersion: v1
kind: Service
metadata:
  name: iggy
  labels:
    app: iggy
spec:
  clusterIP: None
  selector:
    app: iggy
  ports:
    - name: tcp
      port: 8090
    - name: http
      port: 3000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: iggy
  labels:
    app: iggy
spec:
  serviceName: iggy
  replicas: 1
  selector:
    matchLabels:
      app: iggy
  template:
    metadata:
      labels:
        app: iggy
    spec:
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
        - name: iggy
          image: docker.io/apache/iggy:0.10.0
          imagePullPolicy: IfNotPresent
          env:
            - name: IGGY_PATH
              value: /data/local_data
            - name: IGGY_TCP_ADDRESS
              value: 0.0.0.0:8090
            - name: IGGY_HTTP_ADDRESS
              value: 0.0.0.0:3000
            - name: IGGY_NODE_ADVERTISED_ADDRESS
              value: iggy
            - name: IGGY_ROOT_USERNAME
              value: iggy
            - name: IGGY_ROOT_PASSWORD
              value: iggy
            - name: IGGY_SHARDING_CPU_ALLOCATION
              value: "2"
          ports:
            - name: tcp
              containerPort: 8090
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 8090
            periodSeconds: 2
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
