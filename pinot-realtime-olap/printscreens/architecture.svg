<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <defs>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1120" height="560">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2937; }
      .title { font-size: 25px; font-weight: 700; }
      .note { font-size: 18px; }
      .label { font-size: 18px; fill: #4b5563; }
      .box { stroke: #374151; stroke-width: 2.2; filter: url(#wobble); }
      .group { stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 8 6; fill: #fafafa; filter: url(#wobble); }
      .flow { stroke: #374151; stroke-width: 2.4; fill: none; marker-end: url(#arrow); filter: url(#wobble); }
      .soft { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); filter: url(#wobble); }
    </style>
  </defs>
  <rect width="1120" height="560" fill="#ffffff"/>

  <rect class="box" x="30" y="40" width="150" height="80" rx="14" fill="#fde2e4"/>
  <text class="title" x="105" y="74" text-anchor="middle">orders.csv</text>
  <text class="note" x="105" y="100" text-anchor="middle">200 rows</text>

  <rect class="box" x="220" y="40" width="210" height="80" rx="14" fill="#e2ece9"/>
  <text class="title" x="325" y="74" text-anchor="middle">awk to JSON</text>
  <text class="note" x="325" y="100" text-anchor="middle">kafka-console-producer</text>

  <rect class="box" x="470" y="40" width="190" height="80" rx="14" fill="#fff1c1"/>
  <text class="title" x="565" y="74" text-anchor="middle">Kafka 4.3.1</text>
  <text class="note" x="565" y="100" text-anchor="middle">topic orders, KRaft</text>

  <path class="flow" d="M180,80 L216,80"/>
  <path class="flow" d="M430,80 L466,80"/>

  <rect class="group" x="440" y="160" width="650" height="370" rx="18"/>
  <text class="label" x="460" y="186">i31-pinot container, Pinot 1.5.1 QuickStart EMPTY, 1g heap</text>

  <rect class="box" x="460" y="210" width="210" height="80" rx="14" fill="#dbe7fb"/>
  <text class="title" x="565" y="244" text-anchor="middle">Controller :9000</text>
  <text class="note" x="565" y="270" text-anchor="middle">schema, table, console</text>

  <rect class="box" x="460" y="340" width="210" height="70" rx="14" fill="#ede9fe"/>
  <text class="title" x="565" y="382" text-anchor="middle">embedded ZooKeeper</text>

  <rect class="box" x="720" y="210" width="350" height="110" rx="14" fill="#dcfce7"/>
  <text class="title" x="895" y="242" text-anchor="middle">Server, REALTIME table orders</text>
  <text class="note" x="895" y="270" text-anchor="middle">flush every 100 rows: 2 committed + 1 consuming</text>
  <text class="note" x="895" y="296" text-anchor="middle">star-tree (category, customer) + inverted category</text>

  <rect class="box" x="720" y="400" width="350" height="90" rx="14" fill="#fff1c1"/>
  <text class="title" x="895" y="436" text-anchor="middle">Broker :8000</text>
  <text class="note" x="895" y="464" text-anchor="middle">POST /query/sql, scatter gather</text>

  <path class="flow" d="M660,80 L895,80 L895,206"/>
  <text class="label" x="905" y="150">consume JSON</text>
  <path class="flow" d="M895,400 L895,324"/>
  <path class="soft" d="M670,250 L716,250"/>
  <path class="soft" d="M565,340 L565,294"/>

  <rect class="box" x="130" y="220" width="220" height="80" rx="14" fill="#fde2e4"/>
  <text class="title" x="240" y="254" text-anchor="middle">Browser</text>
  <text class="note" x="240" y="280" text-anchor="middle">index.html, 5s refresh</text>

  <rect class="box" x="130" y="400" width="220" height="90" rx="14" fill="#e2ece9"/>
  <text class="title" x="240" y="436" text-anchor="middle">server.py</text>
  <text class="note" x="240" y="464" text-anchor="middle">Python 3.14 stdlib, /api/*</text>

  <path class="flow" d="M240,300 L240,396"/>
  <text class="label" x="250" y="354">GET /api</text>
  <path class="flow" d="M350,445 L716,445"/>
  <text class="label" x="380" y="470">Pinot SQL over HTTP</text>
  <path class="soft" d="M350,240 L456,240"/>
  <text class="label" x="362" y="228">console link</text>
</svg>
