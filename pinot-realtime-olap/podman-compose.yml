name: i31-pinot-realtime

services:
  kafka:
    image: docker.io/apache/kafka:4.3.1
    container_name: i31-kafka
    ports:
      - "23192:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:23192,INTERNAL://i31-kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
    networks:
      - i31-net

  pinot:
    image: docker.io/apachepinot/pinot:1.5.1-25-amazoncorretto
    container_name: i31-pinot
    command: QuickStart -type EMPTY -dataDir /tmp/i31-pinot
    ports:
      - "23100:9000"
      - "23101:8000"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1g -XX:+UseG1GC -XX:MaxDirectMemorySize=256m"
    volumes:
      - ./pinot:/config:ro
    networks:
      - i31-net

networks:
  i31-net:
    name: i31-net
