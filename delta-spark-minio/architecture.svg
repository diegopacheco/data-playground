  <text x="115" y="100" font-size="26" text-anchor="middle" font-weight="700">data/</text>
  <text x="115" y="130" font-size="20" text-anchor="middle">orders.csv (200)</text>
  <text x="115" y="155" font-size="20" text-anchor="middle">updates.csv (30)</text>
  <text x="415" y="80" font-size="28" text-anchor="middle" font-weight="700">Spark 4.2 DeltaJob</text>
  <text x="415" y="112" font-size="21" text-anchor="middle">1. write v0 (CDF on)</text>
  <text x="415" y="142" font-size="21" text-anchor="middle">2. MERGE upsert v1</text>
  <text x="415" y="172" font-size="21" text-anchor="middle">3. readChangeFeed v1..v1</text>
  <text x="415" y="202" font-size="21" text-anchor="middle">4. versionAsOf 0 vs 1</text>
  <text x="415" y="232" font-size="21" text-anchor="middle">5. VACUUM RETAIN 0 HOURS</text>
  <text x="415" y="262" font-size="21" text-anchor="middle">6. DESCRIBE HISTORY</text>
  <text x="415" y="310" font-size="20" text-anchor="middle">Scala 3.7.4 + Delta 4.4.0</text>
  <text x="415" y="338" font-size="20" text-anchor="middle">hadoop-aws S3A</text>
  <text x="790" y="80" font-size="28" text-anchor="middle" font-weight="700">MinIO</text>
  <text x="790" y="112" font-size="21" text-anchor="middle">s3a://lake/orders</text>
  <text x="790" y="142" font-size="20" text-anchor="middle">_delta_log/ + _change_data/</text>
  <text x="790" y="170" font-size="20" text-anchor="middle">part-*.parquet</text>
