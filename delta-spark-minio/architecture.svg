  <text x="115" y="295" font-size="24" text-anchor="middle" font-weight="700">test-all.sh</text>
  <text x="115" y="325" font-size="19" text-anchor="middle">awk + python</text>
  <text x="115" y="348" font-size="19" text-anchor="middle">check vs /api</text>
  <text x="565" y="405" font-size="19" text-anchor="middle">reports</text>
