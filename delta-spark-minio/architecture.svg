    <rect x="30" y="60" width="170" height="110" rx="12" fill="#fff4cc"/>
    <rect x="290" y="40" width="250" height="330" rx="12" fill="#dbeafe"/>
    <rect x="640" y="40" width="300" height="150" rx="12" fill="#dcfce7"/>
    <rect x="630" y="250" width="130" height="110" rx="12" fill="#fde2e4"/>
