server_name: $SERVER_NAME
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
  max_memory_store: 64MB
  max_file_store: 1GB
}

cluster {
  name: r8
  listen: 0.0.0.0:6222
  routes: [
    nats-route://r8-nats-1:6222
    nats-route://r8-nats-2:6222
    nats-route://r8-nats-3:6222
  ]
}
