apiVersion: v1
kind: Secret
metadata:
  name: postgres
stringData:
  PGUSER: backfill
  PGPASSWORD: backfill
  PGDATABASE: backfill
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-alpine
          imagePullPolicy: Never
          args: ["-c", "max_connections=200", "-c", "shared_buffers=256MB"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres, key: PGUSER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: PGPASSWORD}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: postgres, key: PGDATABASE}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "backfill", "-d", "backfill"]
            periodSeconds: 2
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
