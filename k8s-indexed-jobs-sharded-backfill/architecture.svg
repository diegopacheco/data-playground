<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', cursive; fill: #1e1e1e; }
      .t { font-size: 26px; font-weight: 700; }
      .s { font-size: 19px; }
      .box { stroke: #1e1e1e; stroke-width: 2.2; filter: url(#wobble); }
      .arrow { stroke: #1e1e1e; stroke-width: 2.2; fill: none; filter: url(#wobble); marker-end: url(#head); }
    </style>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1100" height="560"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1e1e1e" stroke-width="2"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>
  <rect class="box" x="10" y="20" width="1080" height="520" rx="18" fill="none" stroke-dasharray="8 6"/>
  <text class="s" x="30" y="50">kind cluster "k8s-indexed-jobs-sharded-backfill" (podman)</text>

  <rect class="box" x="30" y="80" width="300" height="200" rx="12" fill="#a5d8ff"/>
  <text class="t" x="180" y="118" text-anchor="middle">Indexed Job</text>
  <text class="s" x="180" y="148" text-anchor="middle">completionMode: Indexed</text>
  <text class="s" x="180" y="172" text-anchor="middle">completions 12, parallelism 4</text>
  <text class="s" x="180" y="196" text-anchor="middle">backoffLimitPerIndex 2</text>
  <text class="s" x="180" y="220" text-anchor="middle">podFailurePolicy:</text>
  <text class="s" x="180" y="244" text-anchor="middle">exit 3 FailIndex, exit 42 Count</text>
  <text class="s" x="180" y="268" text-anchor="middle">DisruptionTarget Ignore</text>

  <rect class="box" x="400" y="80" width="300" height="90" rx="12" fill="#b2f2bb"/>
  <text class="t" x="550" y="115" text-anchor="middle">pod index 0..3 running</text>
  <text class="s" x="550" y="145" text-anchor="middle">JOB_COMPLETION_INDEX = i</text>

  <rect class="box" x="400" y="190" width="300" height="90" rx="12" fill="#e9ecef"/>
  <text class="t" x="550" y="225" text-anchor="middle">pod index 4..11 pending</text>
  <text class="s" x="550" y="255" text-anchor="middle">start when a slot frees up</text>

  <rect class="box" x="400" y="320" width="300" height="190" rx="12" fill="#d0bfff"/>
  <text class="t" x="550" y="355" text-anchor="middle">worker (Python or Java)</text>
  <text class="s" x="550" y="385" text-anchor="middle">day = START_DAY + i</text>
  <text class="s" x="550" y="410" text-anchor="middle">split day in 4 sub-ranges</text>
  <text class="s" x="550" y="435" text-anchor="middle">read concurrently, merge</text>
  <text class="s" x="550" y="460" text-anchor="middle">Java: StructuredTaskScope</text>
  <text class="s" x="550" y="485" text-anchor="middle">Python: ThreadPoolExecutor</text>

  <rect class="box" x="780" y="80" width="290" height="430" rx="12" fill="#ffd8a8"/>
  <text class="t" x="925" y="118" text-anchor="middle">Postgres 18.6</text>
  <text class="s" x="925" y="150" text-anchor="middle">events partitioned by day</text>
  <text class="s" x="925" y="174" text-anchor="middle">12 x 250000 rows</text>
  <rect class="box" x="800" y="200" width="250" height="120" rx="10" fill="#fff3bf"/>
  <text class="t" x="925" y="232" text-anchor="middle">one transaction</text>
  <text class="s" x="925" y="260" text-anchor="middle">delete day rows</text>
  <text class="s" x="925" y="284" text-anchor="middle">insert daily_aggregates</text>
  <text class="s" x="925" y="308" text-anchor="middle">insert ledger 'ok'</text>
  <text class="s" x="925" y="355" text-anchor="middle">backfill_ledger: every attempt</text>
  <text class="s" x="925" y="380" text-anchor="middle">unique ok per (run, index)</text>
  <text class="s" x="925" y="420" text-anchor="middle">ground_truth view</text>
  <text class="s" x="925" y="445" text-anchor="middle">plain SQL group by</text>
  <text class="s" x="925" y="485" text-anchor="middle">port-forward :27600</text>

  <rect class="box" x="30" y="330" width="300" height="180" rx="12" fill="#fcc2d7"/>
  <text class="t" x="180" y="368" text-anchor="middle">e2e pytest (host)</text>
  <text class="s" x="180" y="398" text-anchor="middle">renders and applies the Job</text>
  <text class="s" x="180" y="422" text-anchor="middle">reads Job status + pods</text>
  <text class="s" x="180" y="446" text-anchor="middle">compares aggregates</text>
  <text class="s" x="180" y="470" text-anchor="middle">with ground_truth</text>

  <path class="arrow" d="M330,140 L396,125"/>
  <path class="arrow" d="M330,220 L396,235"/>
  <path class="arrow" d="M550,280 L550,316"/>
  <path class="arrow" d="M700,400 L776,400"/>
  <path class="arrow" d="M180,330 L180,284"/>
  <path class="arrow" d="M330,505 C 500,530 700,530 776,495"/>
</svg>
