spring.main.banner-mode=off
spring.main.web-application-type=none
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:backfill}
spring.datasource.username=${PGUSER:backfill}
spring.datasource.password=${PGPASSWORD:backfill}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
logging.level.root=WARN
