services:
  s4-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.9.2.8
    container_name: s4-clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "${clickhouse:-30300}:8123"
    mem_limit: 2g
    cpus: 2
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - s4-clickhouse-data:/var/lib/clickhouse
    networks:
      - s4-net

networks:
  s4-net:
    name: s4-net

volumes:
  s4-clickhouse-data:
    name: s4-clickhouse-data
