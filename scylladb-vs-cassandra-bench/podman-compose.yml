name: i47-bench

services:
  scylla:
    image: docker.io/scylladb/scylla:2026.3.1
    container_name: i47-scylla
    command: --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1
    ports:
      - "24742:9042"
    volumes:
      - i47-scylla-data:/var/lib/scylla
    networks:
      - i47-net

  cassandra:
    image: docker.io/library/cassandra:5.0.9
    container_name: i47-cassandra
    ports:
      - "24743:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: i47-cluster
    volumes:
      - i47-cassandra-data:/var/lib/cassandra
    networks:
      - i47-net

volumes:
  i47-scylla-data:
    name: i47-scylla-data
  i47-cassandra-data:
    name: i47-cassandra-data

networks:
  i47-net:
    name: i47-net
