<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <defs>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="400">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2937; }
      .title { font-size: 26px; font-weight: 700; }
      .note { font-size: 19px; }
      .box { stroke: #374151; stroke-width: 2.2; filter: url(#wobble); }
      .flow { stroke: #374151; stroke-width: 2.4; fill: none; marker-end: url(#arrow); filter: url(#wobble); }
    </style>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>

  <rect class="box" x="30" y="40" width="170" height="100" rx="14" fill="#fde2e4"/>
  <text class="title" x="115" y="80" text-anchor="middle">orders.csv</text>
  <text class="note" x="115" y="110" text-anchor="middle">200 base rows</text>

  <rect class="box" x="270" y="30" width="230" height="120" rx="14" fill="#e2ece9"/>
  <text class="title" x="385" y="68" text-anchor="middle">Bench (Java 25)</text>
  <text class="note" x="385" y="96" text-anchor="middle">100k deterministic rows</text>
  <text class="note" x="385" y="122" text-anchor="middle">async, 64 in flight</text>

  <rect class="box" x="580" y="20" width="250" height="100" rx="14" fill="#dbe7ff"/>
  <text class="title" x="705" y="58" text-anchor="middle">ScyllaDB 2026.3.1</text>
  <text class="note" x="705" y="88" text-anchor="middle">smp 1, 1G, overprovisioned</text>

  <rect class="box" x="580" y="150" width="250" height="100" rx="14" fill="#fff1c1"/>
  <text class="title" x="705" y="188" text-anchor="middle">Cassandra 5.0.9</text>
  <text class="note" x="705" y="218" text-anchor="middle">512M heap</text>

  <rect class="box" x="270" y="260" width="230" height="100" rx="14" fill="#e9dcf7"/>
  <text class="title" x="385" y="298" text-anchor="middle">results.json</text>
  <text class="note" x="385" y="328" text-anchor="middle">ops/s, p50 p95 p99, aggregates</text>

  <rect class="box" x="580" y="280" width="250" height="90" rx="14" fill="#d8f3dc"/>
  <text class="title" x="705" y="318" text-anchor="middle">UiServer + index.html</text>
  <text class="note" x="705" y="346" text-anchor="middle">/api/results, bar charts</text>

  <path class="flow" d="M200,90 L265,90"/>
  <path class="flow" d="M500,70 L575,70"/>
  <path class="flow" d="M500,120 C540,130 550,190 575,195"/>
  <text class="note" x="515" y="58">1st</text>
  <text class="note" x="508" y="180">2nd</text>
  <path class="flow" d="M385,150 L385,255"/>
  <text class="note" x="395" y="210">write</text>
  <path class="flow" d="M500,315 L575,322"/>
  <text class="note" x="515" y="300">read</text>
</svg>
