<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenue by Category</title>
<style>
:root { --bg: #f7f8fa; --card: #ffffff; --text: #1f2933; --muted: #6b7280; --line: #e5e7eb; --bar: #4f7cff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
h1 { margin: 0 0 4px; font-size: 24px; }
p.sub { margin: 0 0 24px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
h2 { margin: 0 0 12px; font-size: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: right; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; }
tfoot td { font-weight: 700; border-bottom: none; }
svg text { font-size: 12px; fill: var(--text); }
#status { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
<h1>Revenue by Category</h1>
<p class="sub">Airflow pipeline output read from Cassandra table sales.revenue_by_category</p>
<div class="card">
<h2>Revenue</h2>
<svg id="chart" width="100%" viewBox="0 0 900 260" role="img" aria-label="Revenue per category"></svg>
</div>
<div class="card">
<h2>Totals</h2>
<table>
<thead><tr><th>Category</th><th>Orders</th><th>Quantity</th><th>Revenue</th></tr></thead>
<tbody id="rows"></tbody>
<tfoot id="foot"></tfoot>
</table>
<p id="status"></p>
</div>
</main>
<script>
const money = v => v.toLocaleString("en-US", { style: "currency", currency: "USD" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderTable(rows) {
  document.getElementById("rows").innerHTML = rows.map(r =>
    `<tr><td>${esc(r.category)}</td><td>${r.total_orders}</td><td>${r.total_quantity}</td><td>${money(r.total_revenue)}</td></tr>`).join("");
  const sum = k => rows.reduce((a, r) => a + r[k], 0);
  document.getElementById("foot").innerHTML =
    `<tr><td>Total</td><td>${sum("total_orders")}</td><td>${sum("total_quantity")}</td><td>${money(sum("total_revenue"))}</td></tr>`;
}

function renderChart(rows) {
  const svg = document.getElementById("chart");
  const label = 110, width = 900 - label - 120, gap = 40;
  const max = Math.max(1, ...rows.map(r => r.total_revenue));
  svg.setAttribute("viewBox", `0 0 900 ${rows.length * gap + 10}`);
  svg.innerHTML = rows.map((r, i) => {
    const y = i * gap + 8, w = Math.max(2, r.total_revenue / max * width);
    return `<text x="0" y="${y + 18}">${esc(r.category)}</text>` +
      `<rect x="${label}" y="${y}" width="${w}" height="26" rx="4" fill="var(--bar)"></rect>` +
      `<text x="${label + w + 8}" y="${y + 18}">${money(r.total_revenue)}</text>`;
  }).join("");
}

fetch("/api/revenue")
  .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
  .then(rows => {
    renderTable(rows);
    renderChart(rows);
    document.getElementById("status").textContent = rows.length ? "" : "No data yet, trigger the Airflow DAG.";
  })
  .catch(e => { document.getElementById("status").textContent = "Failed to load: " + e.message; });
</script>
</body>
</html>
