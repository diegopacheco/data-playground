name: r10-schema-registry-avro-protobuf

services:
  r10-kafka:
    image: docker.io/apache/kafka-native:4.3.1
    container_name: r10-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://r10-kafka:9092,EXTERNAL://localhost:${kafka:-27502}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
    mem_limit: 512m
    ports:
      - "${kafka:-27502}:9094"
    volumes:
      - r10-kafka-data:/tmp/kraft-combined-logs
    networks:
      - r10-net

  r10-registry:
    image: docker.io/apicurio/apicurio-registry:3.3.3
    container_name: r10-registry
    restart: unless-stopped
    environment:
      JAVA_OPTS_APPEND: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=192m"
      APICURIO_REST_DELETION_GROUP_ENABLED: "true"
      APICURIO_REST_DELETION_ARTIFACT_ENABLED: "true"
      APICURIO_REST_DELETION_ARTIFACT_VERSION_ENABLED: "true"
    mem_limit: 768m
    ports:
      - "${registry:-27501}:8080"
    networks:
      - r10-net

  r10-app:
    build:
      context: .
      dockerfile: Containerfile
    image: r10-schema-registry-avro-protobuf:latest
    container_name: r10-app
    restart: unless-stopped
    environment:
      REGISTRY_URL: http://r10-registry:8080
      KAFKA_BOOTSTRAP: r10-kafka:9092
      UI_PORT: "8080"
    mem_limit: 384m
    ports:
      - "${ui:-27500}:8080"
    networks:
      - r10-net
    depends_on:
      - r10-kafka
      - r10-registry

networks:
  r10-net:
    name: r10-net

volumes:
  r10-kafka-data:
    name: r10-kafka-data
