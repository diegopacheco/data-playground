<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2933; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
  </defs>
  <rect width="1200" height="450" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1f2933" stroke-width="2">
    <rect x="20" y="150" width="140" height="80" rx="10" fill="#fff3bf"/>
    <rect x="200" y="120" width="190" height="140" rx="10" fill="#d0ebff"/>
    <rect x="440" y="70" width="210" height="110" rx="10" fill="#fcc2d7"/>
    <rect x="440" y="210" width="210" height="110" rx="10" fill="#ffd8a8"/>
    <rect x="700" y="80" width="220" height="230" rx="10" fill="#e5dbff"/>
    <rect x="970" y="80" width="210" height="230" rx="10" fill="#d3f9d8"/>
    <rect x="700" y="355" width="480" height="75" rx="10" fill="#f1f3f5"/>
    <line x1="160" y1="190" x2="198" y2="190" marker-end="url(#arrow)"/>
    <line x1="390" y1="160" x2="438" y2="130" marker-end="url(#arrow)"/>
    <line x1="390" y1="225" x2="438" y2="255" marker-end="url(#arrow)"/>
    <line x1="650" y1="125" x2="698" y2="150" marker-end="url(#arrow)"/>
    <line x1="650" y1="265" x2="698" y2="240" marker-end="url(#arrow)"/>
    <line x1="920" y1="195" x2="968" y2="195" marker-end="url(#arrow)"/>
    <line x1="1075" y1="310" x2="1075" y2="353" marker-end="url(#arrow)"/>
    <line x1="810" y1="355" x2="810" y2="312" marker-end="url(#arrow)"/>
  </g>
  <text x="600" y="40" font-size="32" font-weight="700" text-anchor="middle">dlt-python-ingest</text>
  <text x="90" y="185" font-size="24" text-anchor="middle">orders.csv</text>
  <text x="90" y="210" font-size="18" text-anchor="middle">200 rows seed</text>
  <text x="295" y="150" font-size="24" text-anchor="middle">Postgres 18.6</text>
  <text x="295" y="178" font-size="18" text-anchor="middle">orders + updated_at</text>
  <text x="295" y="200" font-size="18" text-anchor="middle">deleted flag, coupon</text>
  <text x="295" y="222" font-size="18" text-anchor="middle">customers jsonb</text>
  <text x="295" y="244" font-size="18" text-anchor="middle">port 26900</text>
  <text x="545" y="100" font-size="24" text-anchor="middle">sql_database</text>
  <text x="545" y="126" font-size="18" text-anchor="middle">sql_table orders</text>
  <text x="545" y="148" font-size="18" text-anchor="middle">incremental updated_at</text>
  <text x="545" y="170" font-size="18" text-anchor="middle">merge on order_id</text>
  <text x="545" y="240" font-size="24" text-anchor="middle">rest_api</text>
  <text x="545" y="266" font-size="18" text-anchor="middle">GET /source/customers</text>
  <text x="545" y="288" font-size="18" text-anchor="middle">page_number, 5 per page</text>
  <text x="545" y="310" font-size="18" text-anchor="middle">nested JSON, merge on id</text>
  <text x="810" y="112" font-size="26" text-anchor="middle">dlt 1.30 pipeline</text>
  <text x="810" y="142" font-size="18" text-anchor="middle">source "shop"</text>
  <text x="810" y="170" font-size="18" text-anchor="middle">extract, normalize, load</text>
  <text x="810" y="198" font-size="18" text-anchor="middle">schema inference</text>
  <text x="810" y="226" font-size="18" text-anchor="middle">and evolution</text>
  <text x="810" y="254" font-size="18" text-anchor="middle">load packages</text>
  <text x="810" y="282" font-size="18" text-anchor="middle">hard_delete hint</text>
  <text x="1075" y="112" font-size="26" text-anchor="middle">DuckDB 1.5</text>
  <text x="1075" y="142" font-size="18" text-anchor="middle">shop.duckdb, dataset ingest</text>
  <text x="1075" y="170" font-size="18" text-anchor="middle">orders</text>
  <text x="1075" y="194" font-size="18" text-anchor="middle">customers</text>
  <text x="1075" y="218" font-size="18" text-anchor="middle">customers__addresses</text>
  <text x="1075" y="242" font-size="18" text-anchor="middle">customers__tags</text>
  <text x="1075" y="270" font-size="18" text-anchor="middle">_dlt_loads, _dlt_version</text>
  <text x="1075" y="294" font-size="18" text-anchor="middle">_dlt_pipeline_state</text>
  <text x="940" y="385" font-size="24" text-anchor="middle">server.py + index.html (port 26901)</text>
  <text x="940" y="412" font-size="18" text-anchor="middle">run pipeline, apply source changes, runs, tables, schema versions</text>
  <text x="760" y="340" font-size="17" text-anchor="middle">POST /api/run</text>
  <text x="1135" y="340" font-size="17" text-anchor="middle">SQL reads</text>
</svg>
