services:
  q2-postgres:
    image: docker.io/library/postgres:18.6-alpine
    container_name: q2-postgres
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: beam
      POSTGRES_PASSWORD: beam
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    mem_limit: 256m
    ports:
      - "${postgres:-26132}:5432"
    volumes:
      - q2-postgres-data:/var/lib/postgresql
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro,Z
    networks:
      - q2-net

  q2-pipeline:
    build:
      context: .
      dockerfile: Containerfile
    image: q2-beam-java-pipeline:latest
    container_name: q2-pipeline
    command: ["java", "-Xmx256m", "-cp", "lib/*", "beam.RevenuePipeline"]
    mem_limit: 512m
    environment:
      JDBC_URL: jdbc:postgresql://q2-postgres:5432/sales
      JDBC_USER: beam
      JDBC_PASSWORD: beam
    networks:
      - q2-net

  q2-ui:
    build:
      context: .
      dockerfile: Containerfile
    image: q2-beam-java-pipeline:latest
    container_name: q2-ui
    restart: unless-stopped
    mem_limit: 192m
    environment:
      JDBC_URL: jdbc:postgresql://q2-postgres:5432/sales
      JDBC_USER: beam
      JDBC_PASSWORD: beam
      UI_PORT: "${ui:-26180}"
    ports:
      - "${ui:-26180}:${ui:-26180}"
    networks:
      - q2-net
    depends_on:
      - q2-postgres

networks:
  q2-net:
    name: q2-net

volumes:
  q2-postgres-data:
    name: q2-postgres-data
