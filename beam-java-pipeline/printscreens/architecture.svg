<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="340" viewBox="0 0 1060 340">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #2b2b2b; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="6" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#2b2b2b" stroke-width="2"/></marker>
  </defs>
  <rect width="1060" height="340" fill="#fffdf7"/>
  <g filter="url(#wobble)" stroke="#2b2b2b" stroke-width="2.2">
    <rect x="20" y="70" width="150" height="90" rx="10" fill="#fde2e4"/>
    <rect x="230" y="70" width="170" height="90" rx="10" fill="#fff1c1"/>
    <rect x="460" y="70" width="180" height="90" rx="10" fill="#d7f0dd"/>
    <rect x="700" y="70" width="190" height="90" rx="10" fill="#dbe7ff"/>
    <rect x="720" y="230" width="150" height="90" rx="10" fill="#eadcf8"/>
    <rect x="910" y="230" width="130" height="90" rx="10" fill="#e3f4f4"/>
    <path d="M170,115 L228,115" fill="none" marker-end="url(#arrow)"/>
    <path d="M400,115 L458,115" fill="none" marker-end="url(#arrow)"/>
    <path d="M640,115 L698,115" fill="none" marker-end="url(#arrow)"/>
    <path d="M795,160 L795,228" fill="none" marker-end="url(#arrow)"/>
    <path d="M870,275 L908,275" fill="none" marker-end="url(#arrow)"/>
  </g>
  <text x="95" y="110" font-size="26" text-anchor="middle" font-weight="700">orders.csv</text>
  <text x="95" y="138" font-size="20" text-anchor="middle">200 rows</text>
  <text x="315" y="110" font-size="26" text-anchor="middle" font-weight="700">ParDo</text>
  <text x="315" y="138" font-size="20" text-anchor="middle">parse to KV(category)</text>
  <text x="550" y="110" font-size="26" text-anchor="middle" font-weight="700">Combine.perKey</text>
  <text x="550" y="138" font-size="20" text-anchor="middle">orders, qty, cents</text>
  <text x="795" y="110" font-size="26" text-anchor="middle" font-weight="700">Postgres 18</text>
  <text x="795" y="138" font-size="18" text-anchor="middle">revenue_by_category</text>
  <text x="795" y="270" font-size="26" text-anchor="middle" font-weight="700">UI backend</text>
  <text x="795" y="298" font-size="20" text-anchor="middle">JDK HttpServer</text>
  <text x="975" y="270" font-size="26" text-anchor="middle" font-weight="700">Browser</text>
  <text x="975" y="298" font-size="20" text-anchor="middle">table + bars</text>
  <text x="199" y="55" font-size="20" text-anchor="middle">TextIO.read</text>
  <text x="429" y="55" font-size="20" text-anchor="middle">KV stream</text>
  <text x="669" y="55" font-size="20" text-anchor="middle">JdbcIO upsert</text>
  <text x="330" y="28" font-size="22" text-anchor="middle" font-weight="700">Apache Beam 2.76 on the DirectRunner, Java 25</text>
  <text x="782" y="200" font-size="20" text-anchor="end">jdbc</text>
  <text x="889" y="258" font-size="20" text-anchor="middle">json</text>
</svg>
