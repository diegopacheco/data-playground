<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2933; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
  </defs>
  <rect width="1100" height="330" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1f2933" stroke-width="2">
    <rect x="20" y="100" width="150" height="80" rx="10" fill="#fff3bf"/>
    <rect x="215" y="100" width="170" height="80" rx="10" fill="#d0ebff"/>
    <rect x="430" y="100" width="210" height="80" rx="10" fill="#ffd8a8"/>
    <rect x="685" y="100" width="190" height="80" rx="10" fill="#d0ebff"/>
    <rect x="920" y="100" width="160" height="80" rx="10" fill="#e5dbff"/>
    <rect x="435" y="230" width="200" height="70" rx="10" fill="#d3f9d8"/>
    <rect x="920" y="230" width="160" height="70" rx="10" fill="#fcc2d7"/>
    <line x1="170" y1="140" x2="213" y2="140" marker-end="url(#arrow)"/>
    <line x1="385" y1="140" x2="428" y2="140" marker-end="url(#arrow)"/>
    <line x1="640" y1="140" x2="683" y2="140" marker-end="url(#arrow)"/>
    <line x1="875" y1="140" x2="918" y2="140" marker-end="url(#arrow)"/>
    <line x1="535" y1="228" x2="535" y2="182" marker-end="url(#arrow)"/>
    <line x1="1000" y1="182" x2="1000" y2="228" marker-end="url(#arrow)"/>
  </g>
  <text x="550" y="45" font-size="30" font-weight="700" text-anchor="middle">arroyo-streaming-sql pipeline</text>
  <text x="95" y="135" font-size="24" text-anchor="middle">orders.csv</text>
  <text x="95" y="162" font-size="18" text-anchor="middle">200 rows as json</text>
  <text x="300" y="135" font-size="24" text-anchor="middle">Redpanda</text>
  <text x="300" y="162" font-size="18" text-anchor="middle">topic orders</text>
  <text x="535" y="135" font-size="24" text-anchor="middle">Arroyo 0.15</text>
  <text x="535" y="162" font-size="18" text-anchor="middle">GROUP BY category</text>
  <text x="780" y="135" font-size="24" text-anchor="middle">Redpanda</text>
  <text x="780" y="162" font-size="18" text-anchor="middle">revenue_by_category</text>
  <text x="1000" y="135" font-size="24" text-anchor="middle">server.py</text>
  <text x="1000" y="162" font-size="18" text-anchor="middle">HTTP proxy reader</text>
  <text x="535" y="262" font-size="22" text-anchor="middle">REST API</text>
  <text x="535" y="286" font-size="18" text-anchor="middle">POST /api/v1/pipelines</text>
  <text x="1000" y="262" font-size="22" text-anchor="middle">index.html</text>
  <text x="1000" y="286" font-size="18" text-anchor="middle">/api/revenue</text>
