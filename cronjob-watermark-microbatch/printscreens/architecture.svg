<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', cursive; fill: #1e1e1e; }
      .t { font-size: 26px; font-weight: 700; }
      .s { font-size: 19px; }
      .box { stroke: #1e1e1e; stroke-width: 2.2; filter: url(#wobble); }
      .arrow { stroke: #1e1e1e; stroke-width: 2.2; fill: none; filter: url(#wobble); marker-end: url(#head); }
    </style>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1100" height="560"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1e1e1e" stroke-width="2"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>
  <rect class="box" x="10" y="20" width="1080" height="470" rx="18" fill="none" stroke-dasharray="8 6"/>
  <text class="s" x="30" y="50">kind cluster "cronjob-watermark-microbatch" (podman)</text>

  <rect class="box" x="40" y="200" width="200" height="120" rx="12" fill="#ffd8a8"/>
  <text class="t" x="140" y="240" text-anchor="middle">generator</text>
  <text class="s" x="140" y="268" text-anchor="middle">Deployment, Python</text>
  <text class="s" x="140" y="294" text-anchor="middle">40 inserts + 4 updates/s</text>

  <rect class="box" x="350" y="80" width="400" height="380" rx="14" fill="#a5d8ff"/>
  <text class="t" x="550" y="118" text-anchor="middle">Postgres 18.6 (StatefulSet)</text>

  <rect class="box" x="380" y="140" width="340" height="60" rx="10" fill="#ffffff"/>
  <text class="s" x="550" y="166" text-anchor="middle">source_events (id, updated_at)</text>
  <text class="s" x="550" y="189" text-anchor="middle">index on (updated_at, id)</text>

  <rect class="box" x="380" y="225" width="340" height="60" rx="10" fill="#fff3bf"/>
  <text class="s" x="550" y="251" text-anchor="middle">watermarks: job, last_updated_at, last_id</text>
  <text class="s" x="550" y="274" text-anchor="middle">row locked FOR UPDATE per page</text>

  <rect class="box" x="380" y="310" width="160" height="60" rx="10" fill="#b2f2bb"/>
  <text class="s" x="460" y="345" text-anchor="middle">target_java</text>
  <rect class="box" x="560" y="310" width="160" height="60" rx="10" fill="#d0bfff"/>
  <text class="s" x="640" y="345" text-anchor="middle">target_python</text>

  <rect class="box" x="380" y="390" width="340" height="50" rx="10" fill="#ffffff"/>
  <text class="s" x="550" y="421" text-anchor="middle">batch_runs: rows, pages, duration_ms</text>

  <rect class="box" x="830" y="110" width="230" height="140" rx="12" fill="#b2f2bb"/>
  <text class="t" x="945" y="148" text-anchor="middle">java-loader</text>
  <text class="s" x="945" y="176" text-anchor="middle">CronJob * * * * *, Forbid</text>
  <text class="s" x="945" y="202" text-anchor="middle">Java 25, Spring Boot 4.1</text>
  <text class="s" x="945" y="228" text-anchor="middle">Data JDBC + HikariCP</text>

  <rect class="box" x="830" y="290" width="230" height="140" rx="12" fill="#d0bfff"/>
  <text class="t" x="945" y="328" text-anchor="middle">python-loader</text>
  <text class="s" x="945" y="356" text-anchor="middle">CronJob * * * * *, Forbid</text>
  <text class="s" x="945" y="382" text-anchor="middle">Python 3.15, psycopg 3</text>
  <text class="s" x="945" y="408" text-anchor="middle">uv</text>

  <path class="arrow" d="M240,235 C290,215 330,185 375,172"/>
  <text class="s" x="140" y="185" text-anchor="middle">INSERT / UPDATE</text>

  <path class="arrow" d="M830,165 C790,160 760,160 725,165"/>
  <path class="arrow" d="M830,350 C790,345 760,340 725,340"/>
  <text class="s" x="550" y="518" text-anchor="middle">one transaction per page: lock watermark, read rows with (updated_at, id) &gt; watermark and updated_at &lt;= cutoff,</text>
  <text class="s" x="550" y="544" text-anchor="middle">upsert them on id into the target, move the watermark to the last row, commit</text>

  <rect class="box" x="40" y="370" width="200" height="90" rx="12" fill="#fcc2d7"/>
  <text class="t" x="140" y="405" text-anchor="middle">e2e tests</text>
  <text class="s" x="140" y="432" text-anchor="middle">host pytest, port 27590</text>
  <path class="arrow" d="M240,415 C280,415 310,415 345,415"/>
</svg>
