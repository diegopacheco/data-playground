spring.application.name=java-loader
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:27590/microbatch}
spring.datasource.username=${DB_USER:microbatch}
spring.datasource.password=${DB_PASSWORD:microbatch}
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.data-source-properties.ApplicationName=loader-java
loader.job=java
loader.runner=${HOSTNAME:local}
loader.page-size=${PAGE_SIZE:500}
loader.lag-seconds=${LAG_SECONDS:2}
loader.hold-before-commit-ms=${HOLD_BEFORE_COMMIT_MS:0}
