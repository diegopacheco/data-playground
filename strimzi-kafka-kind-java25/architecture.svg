<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', cursive; fill: #1e1e1e; }
      .t { font-size: 25px; font-weight: 700; }
      .s { font-size: 18px; }
      .box { stroke: #1e1e1e; stroke-width: 2.2; filter: url(#wobble); }
      .arrow { stroke: #1e1e1e; stroke-width: 2.2; fill: none; filter: url(#wobble); marker-end: url(#head); }
    </style>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1300" height="640"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1e1e1e" stroke-width="2"/></marker>
  </defs>
  <rect x="0" y="0" width="1300" height="640" fill="#ffffff"/>

  <text class="s" x="20" y="45">host</text>
  <rect class="box" x="20" y="90" width="200" height="130" rx="12" fill="#ffd8a8"/>
  <text class="t" x="120" y="128" text-anchor="middle">e2e pytest</text>
  <text class="s" x="120" y="156" text-anchor="middle">starts / stops runs</text>
  <text class="s" x="120" y="180" text-anchor="middle">rolls, scales, rebalances</text>
  <text class="s" x="120" y="204" text-anchor="middle">reads consumer counts</text>

  <rect class="box" x="20" y="380" width="200" height="150" rx="12" fill="#fff3bf"/>
  <text class="t" x="120" y="418" text-anchor="middle">k8s YAML</text>
  <text class="s" x="120" y="446" text-anchor="middle">Kafka, KafkaNodePool</text>
  <text class="s" x="120" y="470" text-anchor="middle">KafkaTopic orders</text>
  <text class="s" x="120" y="494" text-anchor="middle">KafkaUser x3 (SCRAM, ACLs)</text>
  <text class="s" x="120" y="518" text-anchor="middle">KafkaRebalance</text>

  <rect class="box" x="250" y="20" width="1035" height="600" rx="18" fill="none" stroke-dasharray="8 6"/>
  <text class="s" x="270" y="50">kind cluster "strimzi-kafka-kind-java25" (podman), namespace kafka</text>

  <rect class="box" x="280" y="90" width="230" height="130" rx="12" fill="#a5d8ff"/>
  <text class="t" x="395" y="126" text-anchor="middle">order-producer</text>
  <text class="s" x="395" y="154" text-anchor="middle">Java 25, Spring Boot 4.1</text>
  <text class="s" x="395" y="178" text-anchor="middle">virtual thread per send</text>
  <text class="s" x="395" y="202" text-anchor="middle">acks=all, idempotent</text>

  <rect class="box" x="280" y="380" width="230" height="110" rx="12" fill="#ffc9c9"/>
  <text class="t" x="395" y="416" text-anchor="middle">Strimzi 1.3.1</text>
  <text class="s" x="395" y="444" text-anchor="middle">cluster operator</text>
  <text class="s" x="395" y="468" text-anchor="middle">rolls one broker at a time</text>

  <rect class="box" x="280" y="520" width="230" height="80" rx="12" fill="#ffc9c9"/>
  <text class="t" x="395" y="554" text-anchor="middle">entity operator</text>
  <text class="s" x="395" y="580" text-anchor="middle">topic + user operators</text>

  <rect class="box" x="580" y="80" width="330" height="80" rx="12" fill="#d0bfff"/>
  <text class="t" x="745" y="114" text-anchor="middle">pool controllers (3)</text>
  <text class="s" x="745" y="142" text-anchor="middle">KRaft quorum, Kafka 4.3.2</text>

  <rect class="box" x="580" y="200" width="330" height="140" rx="12" fill="#b2f2bb"/>
  <text class="t" x="745" y="236" text-anchor="middle">pool brokers (3)</text>
  <text class="s" x="745" y="264" text-anchor="middle">listener 9092 SCRAM-SHA-512</text>
  <text class="s" x="745" y="288" text-anchor="middle">topic orders: 12 partitions</text>
  <text class="s" x="745" y="312" text-anchor="middle">RF 3, min.insync 2</text>

  <rect class="box" x="940" y="215" width="140" height="110" rx="12" fill="#e9ecef" stroke-dasharray="7 5"/>
  <text class="t" x="1010" y="252" text-anchor="middle">broker 4</text>
  <text class="s" x="1010" y="280" text-anchor="middle">replicas 3 to 4</text>
  <text class="s" x="1010" y="304" text-anchor="middle">then back to 3</text>

  <rect class="box" x="580" y="400" width="330" height="100" rx="12" fill="#c3fae8"/>
  <text class="t" x="745" y="436" text-anchor="middle">Cruise Control</text>
  <text class="s" x="745" y="464" text-anchor="middle">add-brokers: move replicas in</text>
  <text class="s" x="745" y="488" text-anchor="middle">remove-brokers: drain it</text>

  <rect class="box" x="1110" y="200" width="155" height="140" rx="12" fill="#fcc2d7"/>
  <text class="t" x="1187" y="236" text-anchor="middle">order-consumer</text>
  <text class="s" x="1187" y="264" text-anchor="middle">Python 3.15</text>
  <text class="s" x="1187" y="288" text-anchor="middle">kafka-python</text>
  <text class="s" x="1187" y="312" text-anchor="middle">distinct keys per run</text>

  <path class="arrow" d="M220,150 L276,150"/>
  <text class="s" x="120" y="245" text-anchor="middle">port-forward 27510</text>
  <path class="arrow" d="M510,180 C550,190 560,240 576,250"/>
  <text class="s" x="518" y="290">SCRAM</text>
  <path class="arrow" d="M910,205 C980,170 1060,170 1106,215"/>
  <text class="s" x="985" y="165">poll</text>
  <path class="arrow" d="M220,455 L276,435"/>
  <path class="arrow" d="M510,410 C550,380 560,340 576,320"/>
  <text class="s" x="525" y="355">roll</text>
  <path class="arrow" d="M395,490 L395,516"/>
  <path class="arrow" d="M745,400 L745,344"/>
  <path class="arrow" d="M910,440 C980,430 1000,380 1008,329"/>
  <text class="s" x="955" y="420">move</text>
  <path class="arrow" d="M745,200 L745,164"/>
</svg>
