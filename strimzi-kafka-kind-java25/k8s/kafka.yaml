apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controllers
  labels:
    strimzi.io/cluster: orders-cluster
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 1Gi
        kraftMetadata: shared
  jvmOptions:
    "-Xms": 128m
    "-Xmx": 256m
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 640Mi
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: brokers
  labels:
    strimzi.io/cluster: orders-cluster
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        kraftMetadata: shared
  jvmOptions:
    "-Xms": 256m
    "-Xmx": 512m
  resources:
    requests:
      memory: 768Mi
      cpu: 200m
    limits:
      memory: 1Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: orders-cluster
spec:
  kafka:
    version: 4.3.2
    metadataVersion: 4.3-IV0
    listeners:
      - name: scram
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
  cruiseControl:
    jvmOptions:
      "-Xms": 128m
      "-Xmx": 512m
    resources:
      requests:
        memory: 512Mi
        cpu: 100m
      limits:
        memory: 768Mi
    config:
      metric.sampling.interval.ms: 60000
      partition.metrics.window.ms: 60000
      num.partition.metrics.windows: 2
      broker.metrics.window.ms: 60000
      num.broker.metrics.windows: 2
