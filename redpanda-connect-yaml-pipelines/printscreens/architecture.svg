<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2933; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1f2933" stroke-width="2">
    <rect x="20" y="160" width="200" height="100" rx="10" fill="#d3f9d8"/>
    <rect x="20" y="470" width="200" height="90" rx="10" fill="#d3f9d8"/>
    <rect x="250" y="80" width="480" height="530" rx="14" fill="#f8f9fa" stroke-dasharray="8 6"/>
    <rect x="270" y="125" width="440" height="300" rx="10" fill="#ffd8a8"/>
    <rect x="270" y="450" width="440" height="140" rx="10" fill="#ffd8a8"/>
    <rect x="790" y="80" width="390" height="130" rx="10" fill="#d0ebff"/>
    <rect x="790" y="250" width="390" height="120" rx="10" fill="#e5dbff"/>
    <rect x="790" y="410" width="390" height="90" rx="10" fill="#fff3bf"/>
    <rect x="790" y="580" width="390" height="120" rx="10" fill="#ffdeeb"/>
    <line x1="220" y1="210" x2="267" y2="210" marker-end="url(#arrow)"/>
    <line x1="220" y1="515" x2="267" y2="515" marker-end="url(#arrow)"/>
    <line x1="710" y1="160" x2="787" y2="145" marker-end="url(#arrow)"/>
    <line x1="710" y1="270" x2="787" y2="285" marker-end="url(#arrow)"/>
    <line x1="787" y1="345" x2="713" y2="330" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
    <line x1="710" y1="400" x2="787" y2="455" marker-end="url(#arrow)"/>
    <line x1="710" y1="500" x2="787" y2="360" marker-end="url(#arrow)"/>
    <line x1="985" y1="578" x2="985" y2="503" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
    <line x1="788" y1="640" x2="733" y2="600" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
  </g>
  <text x="600" y="40" font-size="32" font-weight="700" text-anchor="middle">redpanda-connect-yaml-pipelines</text>
  <text x="600" y="66" font-size="19" text-anchor="middle">only YAML and Bloblang: http and file in, topics, dead letters, Postgres and a file out</text>
  <text x="120" y="195" font-size="22" text-anchor="middle">seeded orders</text>
  <text x="120" y="220" font-size="16" text-anchor="middle">JSON arrays of 25 + 1 broken</text>
  <text x="120" y="242" font-size="16" text-anchor="middle">POST /orders/ingest</text>
  <text x="120" y="505" font-size="22" text-anchor="middle">data/customers.csv</text>
  <text x="120" y="530" font-size="16" text-anchor="middle">12 customers, tier, country</text>
  <text x="490" y="108" font-size="20" text-anchor="middle">t5-connect: Redpanda Connect 4.115.1, streams mode</text>
  <text x="490" y="152" font-size="22" font-weight="700" text-anchor="middle">stream "orders" (pipelines/orders.yaml)</text>
  <text x="285" y="182" font-size="17">http_server /ingest  -&gt;  split_batch (unarchive json_array)</text>
  <text x="285" y="208" font-size="17">try:</text>
  <text x="325" y="208" font-size="17">validate (rules/validate_order.blobl)</text>
  <text x="325" y="234" font-size="17">drop_loadtest (deleted())</text>
  <text x="325" y="260" font-size="17">dedupe_by_id (memory cache seen_orders)</text>
  <text x="325" y="286" font-size="17">enrich_customer (branch + sql_select)</text>
  <text x="325" y="312" font-size="17">price (rules/price_order.blobl)</text>
  <text x="285" y="346" font-size="17">output switch: errored()  -&gt;  dead letter envelope</text>
  <text x="385" y="372" font-size="17">else fan_out  -&gt;  topic, sql_insert,</text>
  <text x="385" y="398" font-size="17">switch high  -&gt;  file, normal  -&gt;  drop</text>
  <text x="490" y="478" font-size="22" font-weight="700" text-anchor="middle">stream "customers" (pipelines/customers.yaml)</text>
  <text x="285" y="510" font-size="17">file input, csv scanner  -&gt;  normalize_customer</text>
  <text x="285" y="536" font-size="17">sql_insert ... ON CONFLICT DO UPDATE</text>
  <text x="285" y="562" font-size="17">ends when the file is read, the stream closes</text>
  <text x="985" y="112" font-size="22" text-anchor="middle">t5-redpanda (v26.2.6)</text>
  <text x="985" y="140" font-size="17" text-anchor="middle">orders-clean: 3 partitions, key = order id</text>
  <text x="985" y="164" font-size="17" text-anchor="middle">orders-dlq: error + original payload</text>
  <text x="985" y="190" font-size="17" text-anchor="middle">HTTP proxy :8082 for the UI</text>
  <text x="985" y="282" font-size="22" text-anchor="middle">t5-postgres (18.6)</text>
  <text x="985" y="310" font-size="17" text-anchor="middle">customers: loaded from the csv</text>
  <text x="985" y="334" font-size="17" text-anchor="middle">orders: batches of 50 or every 1 s</text>
  <text x="985" y="355" font-size="15" text-anchor="middle">customers read back by sql_select</text>
  <text x="985" y="442" font-size="22" text-anchor="middle">volume t5-connect-out</text>
  <text x="985" y="470" font-size="17" text-anchor="middle">priority/&lt;run&gt;.jsonl, net of 500.00 or more</text>
  <text x="985" y="612" font-size="22" text-anchor="middle">t5-ui (Python stdlib + psycopg)</text>
  <text x="985" y="640" font-size="17" text-anchor="middle">Pipelines, Metrics, Outputs tabs</text>
  <text x="985" y="664" font-size="17" text-anchor="middle">/connect/streams, /connect/metrics, topics,</text>
  <text x="985" y="686" font-size="17" text-anchor="middle">Postgres and the file volume, e2e tests run here</text>
</svg>
