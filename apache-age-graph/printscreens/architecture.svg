<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2933; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
  </defs>
  <rect width="1100" height="520" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1f2933" stroke-width="2">
    <rect x="20" y="110" width="200" height="120" rx="10" fill="#d3f9d8"/>
    <rect x="300" y="100" width="260" height="170" rx="10" fill="#fcc2d7"/>
    <rect x="640" y="90" width="440" height="320" rx="12" fill="#f1f3f5"/>
    <rect x="665" y="155" width="185" height="165" rx="10" fill="#d0ebff"/>
    <rect x="875" y="155" width="185" height="165" rx="10" fill="#ffd8a8"/>
    <rect x="300" y="360" width="260" height="130" rx="10" fill="#e5dbff"/>
    <rect x="20" y="360" width="200" height="130" rx="10" fill="#fff3bf"/>
    <line x1="220" y1="170" x2="297" y2="170" marker-end="url(#arrow)"/>
    <line x1="560" y1="160" x2="637" y2="160" marker-end="url(#arrow)"/>
    <line x1="637" y1="230" x2="563" y2="230" marker-end="url(#arrow)"/>
    <line x1="850" y1="235" x2="872" y2="235" marker-end="url(#arrow)"/>
    <line x1="430" y1="360" x2="430" y2="273" marker-end="url(#arrow)"/>
    <line x1="120" y1="360" x2="120" y2="233" marker-end="url(#arrow)"/>
    <line x1="220" y1="390" x2="298" y2="265" marker-end="url(#arrow)"/>
  </g>
  <text x="550" y="42" font-size="34" font-weight="700" text-anchor="middle">apache-age-graph</text>
  <text x="550" y="72" font-size="20" text-anchor="middle">openCypher and plain SQL over one PostgreSQL database</text>
  <text x="120" y="142" font-size="23" text-anchor="middle">data/*.csv</text>
  <text x="120" y="167" font-size="17" text-anchor="middle">gen.py, seeded</text>
  <text x="120" y="190" font-size="17" text-anchor="middle">customers, products</text>
  <text x="120" y="212" font-size="17" text-anchor="middle">follows, orders</text>
  <text x="430" y="132" font-size="24" text-anchor="middle">r15-app</text>
  <text x="430" y="157" font-size="17" text-anchor="middle">Python 3.14.7, psycopg 3.3.6</text>
  <text x="430" y="181" font-size="17" text-anchor="middle">boot: COPY csv into sales.*</text>
  <text x="430" y="205" font-size="17" text-anchor="middle">then UNWIND ... CREATE the graph</text>
  <text x="430" y="229" font-size="17" text-anchor="middle">REST: khop, path, recommend,</text>
  <text x="430" y="251" font-size="17" text-anchor="middle">network (SQL + cypher())</text>
  <text x="598" y="150" font-size="16" text-anchor="middle">queries</text>
  <text x="598" y="250" font-size="16" text-anchor="middle">agtype</text>
  <text x="860" y="122" font-size="24" text-anchor="middle">r15-age: PostgreSQL 18.6 + Apache AGE 1.8.0</text>
  <text x="860" y="145" font-size="16" text-anchor="middle">port 28000, 512 MB limit</text>
  <text x="757" y="185" font-size="21" text-anchor="middle">schema sales</text>
  <text x="757" y="212" font-size="17" text-anchor="middle">customers</text>
  <text x="757" y="235" font-size="17" text-anchor="middle">products</text>
  <text x="757" y="258" font-size="17" text-anchor="middle">follows</text>
  <text x="757" y="281" font-size="17" text-anchor="middle">orders</text>
  <text x="757" y="304" font-size="15" text-anchor="middle">plain SQL tables</text>
  <text x="967" y="185" font-size="21" text-anchor="middle">graph shop</text>
  <text x="967" y="212" font-size="17" text-anchor="middle">(:Customer)</text>
  <text x="967" y="235" font-size="17" text-anchor="middle">-[:FOLLOWS]-></text>
  <text x="967" y="258" font-size="17" text-anchor="middle">-[:BOUGHT]-></text>
  <text x="967" y="281" font-size="17" text-anchor="middle">(:Product)</text>
  <text x="967" y="304" font-size="15" text-anchor="middle">openCypher</text>
  <text x="860" y="355" font-size="19" text-anchor="middle">SELECT ... FROM cypher('shop', $$ MATCH ... $$)</text>
  <text x="860" y="382" font-size="19" text-anchor="middle">JOIN sales.orders: graph reach meets SQL rows</text>
  <text x="430" y="392" font-size="23" text-anchor="middle">Browser UI (port 28001)</text>
  <text x="430" y="418" font-size="17" text-anchor="middle">plain HTML, CSS, JS</text>
  <text x="430" y="442" font-size="17" text-anchor="middle">SVG force layout, highlights</text>
  <text x="430" y="466" font-size="17" text-anchor="middle">5 tabs, shows the query text</text>
  <text x="120" y="392" font-size="22" text-anchor="middle">tests/test_graph.py</text>
  <text x="120" y="418" font-size="17" text-anchor="middle">BFS and co-purchase</text>
  <text x="120" y="442" font-size="17" text-anchor="middle">recomputed from csv</text>
  <text x="120" y="466" font-size="17" text-anchor="middle">vs the REST API</text>
</svg>
