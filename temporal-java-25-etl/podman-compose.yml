name: i41-temporal-java-25-etl

x-podman:
  in_pod: false

services:
  temporal:
    image: docker.io/temporalio/temporal:1.9.1
    container_name: i41-temporal
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7233", "--ui-port", "8233", "--namespace", "default"]
    ports:
      - "24133:7233"
      - "24180:8233"
    networks:
      - i41-net

  postgres:
    image: docker.io/library/postgres:18.6
    container_name: i41-postgres
    ports:
      - "24132:5432"
    environment:
      POSTGRES_DB: etl
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
    volumes:
      - i41-postgres-data:/var/lib/postgresql
    networks:
      - i41-net

networks:
  i41-net:
    name: i41-net

volumes:
  i41-postgres-data:
    name: i41-postgres-data
