<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', cursive; fill: #1e1e1e; } .t { font-size: 24px; font-weight: 700; } .s { font-size: 18px; }</style>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#343a40" stroke-width="2">
    <rect x="30" y="60" width="170" height="80" rx="12" fill="#ffe8cc"/>
    <rect x="30" y="220" width="170" height="80" rx="12" fill="#fff3bf"/>
    <rect x="300" y="40" width="300" height="130" rx="12" fill="#d0ebff"/>
    <rect x="300" y="250" width="300" height="220" rx="12" fill="#d3f9d8"/>
    <rect x="700" y="280" width="250" height="80" rx="12" fill="#e5dbff"/>
    <rect x="700" y="60" width="250" height="80" rx="12" fill="#ffdeeb"/>
    <rect x="700" y="400" width="250" height="80" rx="12" fill="#c5f6fa"/>
  </g>
  <text class="t" x="115" y="95" text-anchor="middle">Starter (Java 25)</text>
  <text class="s" x="115" y="122" text-anchor="middle">start / run / wait</text>
  <text class="t" x="115" y="255" text-anchor="middle">data/orders.csv</text>
  <text class="s" x="115" y="282" text-anchor="middle">200 orders</text>
  <text class="t" x="450" y="80" text-anchor="middle">Temporal dev server</text>
  <text class="s" x="450" y="108" text-anchor="middle">history, task queue i41-etl</text>
  <text class="s" x="450" y="134" text-anchor="middle">retries + heartbeat timeouts</text>
  <text class="t" x="450" y="285" text-anchor="middle">Worker (Java 25)</text>
  <text class="s" x="450" y="320" text-anchor="middle">1. extractOrders (fails N times)</text>
  <text class="s" x="450" y="350" text-anchor="middle">2. transformAggregate (heartbeats)</text>
  <text class="s" x="450" y="380" text-anchor="middle">3. loadToPostgres (upsert)</text>
  <text class="s" x="450" y="420" text-anchor="middle">kill -9, restart, resume</text>
  <text class="s" x="450" y="446" text-anchor="middle">from heartbeat checkpoint</text>
  <text class="t" x="825" y="315" text-anchor="middle">Postgres 18.6</text>
  <text class="s" x="825" y="342" text-anchor="middle">revenue_by_category</text>
  <text class="t" x="825" y="95" text-anchor="middle">Temporal Web UI</text>
  <text class="s" x="825" y="122" text-anchor="middle">timeline + event history</text>
  <text class="t" x="825" y="435" text-anchor="middle">UiServer (HttpServer)</text>
  <text class="s" x="825" y="462" text-anchor="middle">/api/revenue, /api/workflows</text>
  <g stroke="#343a40" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M200 100 C 240 100, 260 100, 298 100"/>
    <path d="M420 172 C 415 200, 415 220, 420 248"/>
    <path d="M480 248 C 485 220, 485 200, 480 172"/>
    <path d="M200 260 C 240 270, 260 290, 298 300"/>
    <path d="M602 350 C 640 340, 660 330, 698 322"/>
    <path d="M602 90 C 640 90, 660 95, 698 98"/>
    <path d="M825 362 L 825 398"/>
    <path d="M700 420 C 660 380, 630 200, 602 150"/>
  </g>
  <text class="s" x="218" y="88">start</text>
  <text class="s" x="345" y="215">tasks</text>
  <text class="s" x="492" y="215">results, heartbeats</text>
  <text class="s" x="214" y="300">read</text>
  <text class="s" x="608" y="378">upsert</text>
  <text class="s" x="632" y="80">serves</text>
  <text class="s" x="835" y="385">read</text>
  <text class="s" x="610" y="235">fetch history</text>
</svg>
