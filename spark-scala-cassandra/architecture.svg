    <path d="M440,145 L508,145" fill="none" marker-end="url(#arrow)"/>
    <path d="M770,90 C730,90 730,130 702,135" fill="none" marker-end="url(#arrow)"/>
    <path d="M865,180 L865,122" fill="none" marker-end="url(#arrow)"/>
  </g>
