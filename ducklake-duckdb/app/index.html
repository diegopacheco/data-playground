<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuckLake Snapshots</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#1d2330;--muted:#6b7385;--line:#e3e6ec;--accent:#2f6fde;--accent-soft:#e8f0fd;--up:#1f8a4c;--down:#c2412d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:20px 24px 8px}
h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--muted)}
main{padding:12px 24px 32px;display:grid;gap:16px;grid-template-columns:320px 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:15px}
.wide{grid-column:1/-1}
.snap{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.snap:hover{border-color:var(--accent)}
.snap.on{background:var(--accent-soft);border-color:var(--accent)}
.snap b{font-variant-numeric:tabular-nums}
.snap .msg{font-weight:600}
.snap .chg{color:var(--muted);font-size:12px;word-break:break-word}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:120px}
.kpi span{display:block;color:var(--muted);font-size:12px}
.kpi strong{font-size:18px;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
td.changed{background:#fff4d6}
.up{color:var(--up)}.down{color:var(--down)}
.scroll{overflow-x:auto}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.col{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px}
.col.new{border-color:var(--up);color:var(--up)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.meta td,.meta th{text-align:left;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.err{color:var(--down)}
@media (max-width:820px){main{grid-template-columns:1fr;padding:12px 16px}header{padding:16px 16px 4px}}
</style>
</head>
<body>
<header>
<h1>DuckLake on PostgreSQL + MinIO</h1>
<p>Every commit is a snapshot in the Postgres catalog. Pick one to time travel with <code>AT (VERSION =&gt; n)</code>.</p>
</header>
<main>
<section class="card"><h2>Snapshots</h2><div id="snaps"></div></section>
<section class="card">
<h2 id="title">Revenue per category</h2>
<div class="kpis" id="kpis"></div>
<div id="chart"></div>
<div class="scroll"><table id="cat"></table></div>
<div class="cols" id="cols"></div>
</section>
<section class="card wide"><h2>Revenue per category at every snapshot</h2><div class="scroll"><table id="matrix"></table></div></section>
<section class="card wide"><h2>Raw catalog rows read straight from PostgreSQL</h2><div class="tabs" id="tabs"></div><div class="scroll"><table class="meta" id="meta"></table></div></section>
</main>
<script>
const money = v => v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let snaps = [], meta = {}, current = null, metaTab = "ducklake_snapshot";

async function get(path) {
  const r = await fetch(path);
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.status);
  return body;
}

function byCategory(s) {
  return Object.fromEntries((s ? s.categories : []).map(c => [c.category, c]));
}

function changesText(ch) {
  return Object.entries(ch || {}).map(([k, v]) => k + ": " + v.join(", ")).join(" | ");
}

function renderSnaps() {
  document.getElementById("snaps").innerHTML = snaps.map(s =>
    `<div class="snap ${s.snapshot_id === current ? "on" : ""}" data-id="${s.snapshot_id}">
      <b>#${s.snapshot_id}</b> <span class="msg">${esc(s.commit_message || "catalog created")}</span>
      <div class="chg">${esc(changesText(s.changes))}</div></div>`).join("");
  document.querySelectorAll(".snap").forEach(el => el.onclick = () => select(Number(el.dataset.id)));
}

function renderChart(cats, prev) {
  const w = 560, row = 30, h = cats.length * row + 10, left = 90, max = Math.max(1, ...snaps.flatMap(s => s.categories.map(c => c.revenue)));
  const bars = cats.map((c, i) => {
    const y = i * row + 5, bw = (w - left - 90) * c.revenue / max, p = prev[c.category];
    const ghost = p ? `<rect x="${left}" y="${y + 4}" width="${(w - left - 90) * p.revenue / max}" height="18" fill="none" stroke="#9aa3b5" stroke-dasharray="3 3"/>` : "";
    return `<text x="${left - 8}" y="${y + 17}" text-anchor="end" fill="#1d2330" font-size="12">${esc(c.category)}</text>
      <rect x="${left}" y="${y + 4}" width="${bw}" height="18" rx="3" fill="#2f6fde"/>${ghost}
      <text x="${left + bw + 6}" y="${y + 17}" fill="#6b7385" font-size="12">${money(c.revenue)}</text>`;
  }).join("");
  document.getElementById("chart").innerHTML = cats.length
    ? `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">${bars}</svg>`
    : `<p style="color:var(--muted)">Table orders does not exist at this snapshot.</p>`;
}

function renderCategories(s) {
  const prevSnap = snaps.find(x => x.snapshot_id === s.snapshot_id - 1);
  const prev = byCategory(prevSnap);
  const cats = s.categories;
  const total = cats.reduce((a, c) => a + c.revenue, 0), orders = cats.reduce((a, c) => a + c.orders, 0);
  const prevTotal = prevSnap ? prevSnap.categories.reduce((a, c) => a + c.revenue, 0) : 0;
  const delta = total - prevTotal;
  document.getElementById("title").textContent = `Revenue per category at snapshot #${s.snapshot_id}`;
  document.getElementById("kpis").innerHTML =
    `<div class="kpi"><span>orders</span><strong>${orders}</strong></div>
     <div class="kpi"><span>revenue</span><strong>${money(total)}</strong></div>
     <div class="kpi"><span>vs previous snapshot</span><strong class="${delta > 0 ? "up" : delta < 0 ? "down" : ""}">${delta >= 0 ? "+" : ""}${money(delta)}</strong></div>`;
  renderChart(cats, prev);
  document.getElementById("cat").innerHTML = cats.length ? `<tr><th>category</th><th>orders</th><th>quantity</th><th>revenue</th><th>delta</th></tr>` +
    cats.map(c => {
      const d = c.revenue - (prev[c.category] ? prev[c.category].revenue : 0);
      return `<tr><td>${esc(c.category)}</td><td>${c.orders}</td><td>${c.quantity}</td><td>${money(c.revenue)}</td>
        <td class="${d > 0 ? "up" : d < 0 ? "down" : ""}">${d >= 0 ? "+" : ""}${money(d)}</td></tr>`;
    }).join("") : "";
}

async function renderColumns(id) {
  const box = document.getElementById("cols");
  if (!snaps.find(s => s.snapshot_id === id).categories.length) { box.innerHTML = ""; return; }
  const [cols, prev] = await Promise.all([get("/api/columns?version=" + id), id > 0 ? get("/api/columns?version=" + (id - 1)) : []]);
  const old = new Set(prev.map(c => c.column_name));
  box.innerHTML = cols.map(c => `<span class="col ${prev.length && !old.has(c.column_name) ? "new" : ""}">${esc(c.column_name)} ${esc(c.column_type)}</span>`).join("");
}

function renderMatrix() {
  const cats = [...new Set(snaps.flatMap(s => s.categories.map(c => c.category)))].sort();
  const withData = snaps.filter(s => s.categories.length);
  const head = `<tr><th>category</th>${withData.map(s => `<th title="${esc(s.commit_message)}">#${s.snapshot_id}</th>`).join("")}</tr>`;
  const body = cats.map(cat => `<tr><td>${esc(cat)}</td>${withData.map((s, i) => {
    const v = byCategory(s)[cat], p = i ? byCategory(withData[i - 1])[cat] : null;
    const changed = i && (!p || !v || p.revenue !== v.revenue);
    return `<td class="${changed ? "changed" : ""}">${v ? money(v.revenue) : "-"}</td>`;
  }).join("")}</tr>`).join("");
  document.getElementById("matrix").innerHTML = head + body;
}

function renderMeta() {
  document.getElementById("tabs").innerHTML = Object.keys(meta).map(t =>
    `<button class="${t === metaTab ? "on" : ""}" data-t="${t}">${t}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { metaTab = b.dataset.t; renderMeta(); });
  const rows = meta[metaTab] || [];
  const cols = rows.length ? Object.keys(rows[0]) : [];
  document.getElementById("meta").innerHTML = rows.length
    ? `<tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>` + rows.map(r => `<tr>${cols.map(c => `<td>${r[c] === null ? "NULL" : esc(r[c])}</td>`).join("")}</tr>`).join("")
    : `<tr><td>no rows</td></tr>`;
}

function select(id) {
  current = id;
  renderSnaps();
  renderCategories(snaps.find(s => s.snapshot_id === id));
  renderColumns(id).catch(e => document.getElementById("cols").innerHTML = `<span class="err">${esc(e.message)}</span>`);
}

(async () => {
  try {
    [snaps, meta] = await Promise.all([get("/api/snapshots"), get("/api/metadata")]);
    const params = new URLSearchParams(location.search);
    if (meta[params.get("table")]) metaTab = params.get("table");
    const wanted = snaps.find(s => s.snapshot_id === Number(params.get("snapshot")));
    renderMatrix();
    renderMeta();
    select(wanted ? wanted.snapshot_id : snaps[snaps.length - 1].snapshot_id);
  } catch (e) {
    document.querySelector("main").innerHTML = `<p class="err">Failed to load: ${esc(e.message)}</p>`;
  }
})();
</script>
</body>
</html>
