<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="580" viewBox="0 0 1300 580">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2933; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
  </defs>
  <rect width="1300" height="580" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1f2933" stroke-width="2">
    <rect x="20" y="250" width="150" height="80" rx="10" fill="#fff3bf"/>
    <rect x="220" y="250" width="210" height="80" rx="10" fill="#d0ebff"/>
    <rect x="500" y="80" width="280" height="120" rx="10" fill="#d3f9d8"/>
    <rect x="860" y="80" width="200" height="120" rx="10" fill="#e5dbff"/>
    <rect x="1100" y="80" width="180" height="120" rx="10" fill="#fcc2d7"/>
    <rect x="1100" y="270" width="180" height="100" rx="10" fill="#ffd8a8"/>
    <rect x="500" y="440" width="560" height="100" rx="10" fill="#c5f6fa"/>
    <line x1="170" y1="290" x2="218" y2="290" marker-end="url(#arrow)"/>
    <line x1="400" y1="250" x2="498" y2="175" marker-end="url(#arrow)"/>
    <line x1="330" y1="330" x2="498" y2="480" marker-end="url(#arrow)"/>
    <line x1="620" y1="200" x2="620" y2="438" marker-end="url(#arrow)"/>
    <line x1="780" y1="140" x2="858" y2="140" marker-end="url(#arrow)"/>
    <line x1="1100" y1="140" x2="1062" y2="140" marker-end="url(#arrow)"/>
    <line x1="1100" y1="310" x2="782" y2="195" marker-end="url(#arrow)"/>
    <line x1="1130" y1="270" x2="1045" y2="202" marker-end="url(#arrow)"/>
    <line x1="1190" y1="370" x2="1062" y2="470" marker-end="url(#arrow)"/>
  </g>
  <text x="650" y="40" font-size="32" font-weight="700" text-anchor="middle">gravitino-openlineage-marquez</text>
  <text x="95" y="285" font-size="24" text-anchor="middle">orders.csv</text>
  <text x="95" y="310" font-size="18" text-anchor="middle">200 rows</text>
  <text x="325" y="283" font-size="24" text-anchor="middle">pipeline.py</text>
  <text x="325" y="310" font-size="18" text-anchor="middle">Python 3.14, 3 jobs</text>
  <text x="640" y="112" font-size="24" text-anchor="middle">Apache Gravitino 1.3.0</text>
  <text x="640" y="138" font-size="18" text-anchor="middle">metalake shop_lake, catalog shop_pg</text>
  <text x="640" y="160" font-size="18" text-anchor="middle">tags, group owners, comments</text>
  <text x="640" y="184" font-size="18" text-anchor="middle">POST /api/lineage (http source)</text>
  <text x="960" y="115" font-size="24" text-anchor="middle">Marquez 0.51.1</text>
  <text x="960" y="142" font-size="18" text-anchor="middle">OpenLineage API</text>
  <text x="960" y="166" font-size="18" text-anchor="middle">jobs, runs, lineage graph</text>
  <text x="960" y="188" font-size="18" text-anchor="middle">stored in db marquez</text>
  <text x="1190" y="120" font-size="24" text-anchor="middle">Marquez web</text>
  <text x="1190" y="148" font-size="18" text-anchor="middle">lineage page</text>
  <text x="1190" y="172" font-size="18" text-anchor="middle">proxies the API</text>
  <text x="1190" y="305" font-size="24" text-anchor="middle">server.py UI</text>
  <text x="1190" y="332" font-size="18" text-anchor="middle">tree, SVG lineage,</text>
  <text x="1190" y="354" font-size="18" text-anchor="middle">runs, revenue</text>
  <text x="780" y="474" font-size="24" text-anchor="middle">Postgres 18</text>
  <text x="780" y="502" font-size="18" text-anchor="middle">db shop: raw.raw_orders, clean.clean_orders, gold.revenue_by_category</text>
  <text x="780" y="526" font-size="18" text-anchor="middle">db marquez: OpenLineage events, runs, dataset versions</text>
  <text x="235" y="165" font-size="18">1. create tables, tags, owners</text>
  <text x="235" y="188" font-size="18">2. START / COMPLETE events</text>
  <text x="240" y="430" font-size="18">3. COPY + INSERT SELECT</text>
  <text x="630" y="330" font-size="18">JDBC catalog DDL</text>
  <text x="788" y="130" font-size="17">http sink</text>
  <text x="810" y="262" font-size="17">catalog tree</text>
</svg>
