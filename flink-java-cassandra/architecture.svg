<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1e1e1e; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker>
  </defs>
  <rect width="1000" height="300" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1e1e1e" stroke-width="2">
    <rect x="20" y="100" width="150" height="90" rx="12" fill="#fff3bf"/>
    <rect x="230" y="60" width="260" height="170" rx="12" fill="#d0ebff"/>
    <rect x="550" y="100" width="170" height="90" rx="12" fill="#d3f9d8"/>
    <rect x="780" y="40" width="190" height="80" rx="12" fill="#ffd8e8"/>
    <rect x="780" y="180" width="190" height="80" rx="12" fill="#e5dbff"/>
    <line x1="170" y1="145" x2="228" y2="145" marker-end="url(#arrow)"/>
    <line x1="490" y1="145" x2="548" y2="145" marker-end="url(#arrow)"/>
    <line x1="720" y1="130" x2="778" y2="90" marker-end="url(#arrow)"/>
    <line x1="875" y1="178" x2="875" y2="122" marker-end="url(#arrow)"/>
  </g>
  <text x="95" y="140" font-size="26" font-weight="700" text-anchor="middle">orders.csv</text>
  <text x="95" y="168" font-size="20" text-anchor="middle">200 rows</text>
  <text x="360" y="92" font-size="26" font-weight="700" text-anchor="middle">Flink 2.3 batch job</text>
  <text x="360" y="124" font-size="20" text-anchor="middle">FileSource text lines</text>
  <text x="360" y="150" font-size="20" text-anchor="middle">map to CategoryStats</text>
  <text x="360" y="176" font-size="20" text-anchor="middle">keyBy category + reduce</text>
  <text x="360" y="202" font-size="20" text-anchor="middle">CassandraSink (Sink V2)</text>
  <text x="635" y="140" font-size="26" font-weight="700" text-anchor="middle">Cassandra 5</text>
  <text x="635" y="168" font-size="18" text-anchor="middle">sales.revenue_by_category</text>
  <text x="875" y="75" font-size="24" font-weight="700" text-anchor="middle">UiServer</text>
  <text x="875" y="100" font-size="18" text-anchor="middle">GET /api/revenue</text>
  <text x="875" y="215" font-size="24" font-weight="700" text-anchor="middle">Browser</text>
  <text x="875" y="240" font-size="18" text-anchor="middle">index.html table + SVG bars</text>
</svg>
