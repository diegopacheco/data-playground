<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2933; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1f2933" stroke-width="2">
    <rect x="250" y="98" width="600" height="412" rx="14" fill="#f8f9fa" stroke-dasharray="8 6"/>
    <rect x="20" y="230" width="190" height="110" rx="10" fill="#d3f9d8"/>
    <rect x="280" y="160" width="250" height="140" rx="10" fill="#ffd8a8"/>
    <rect x="570" y="160" width="250" height="140" rx="10" fill="#d0ebff"/>
    <rect x="420" y="360" width="260" height="120" rx="10" fill="#fff3bf"/>
    <rect x="890" y="200" width="190" height="110" rx="10" fill="#e5dbff"/>
    <rect x="890" y="380" width="190" height="100" rx="10" fill="#ffe3e3"/>
    <line x1="210" y1="260" x2="277" y2="230" marker-end="url(#arrow)"/>
    <polyline points="200,232 250,148 640,148 660,157" fill="none" marker-end="url(#arrow)"/>
    <line x1="405" y1="300" x2="490" y2="357" marker-end="url(#arrow)"/>
    <line x1="695" y1="300" x2="610" y2="357" marker-end="url(#arrow)"/>
    <line x1="680" y1="420" x2="887" y2="270" marker-end="url(#arrow)"/>
    <line x1="887" y1="430" x2="683" y2="440" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
  </g>
  <text x="550" y="45" font-size="34" font-weight="700" text-anchor="middle">h3-hex-aggregation</text>
  <text x="550" y="78" font-size="20" text-anchor="middle">ride pickups indexed with Uber H3, aggregated per hexagon, cross-checked in two engines</text>
  <text x="550" y="126" font-size="20" text-anchor="middle">t7-app container on t7-net, Python 3.12, port 8080 published as 31600</text>
  <text x="115" y="265" font-size="24" text-anchor="middle">data.py</text>
  <text x="115" y="292" font-size="17" text-anchor="middle">seed 42, 3 cities</text>
  <text x="115" y="316" font-size="17" text-anchor="middle">12,000 pickups</text>
  <text x="405" y="195" font-size="24" text-anchor="middle">duck.py</text>
  <text x="405" y="222" font-size="17" text-anchor="middle">DuckDB 2.0.0 in memory</text>
  <text x="405" y="246" font-size="17" text-anchor="middle">h3 community extension</text>
  <text x="405" y="270" font-size="17" text-anchor="middle">GROUP BY cell, rollup, disk, polyfill</text>
  <text x="695" y="195" font-size="24" text-anchor="middle">hexpy.py</text>
  <text x="695" y="222" font-size="17" text-anchor="middle">h3-py 4.5.0 + Python dicts</text>
  <text x="695" y="246" font-size="17" text-anchor="middle">same aggregates, other code path</text>
  <text x="695" y="270" font-size="17" text-anchor="middle">cell boundaries for the map</text>
  <text x="550" y="395" font-size="24" text-anchor="middle">analysis.py + server.py</text>
  <text x="550" y="422" font-size="17" text-anchor="middle">hexmap, rollup, neighbours, region,</text>
  <text x="550" y="446" font-size="17" text-anchor="middle">grid vs hex, crosscheck as JSON</text>
  <text x="550" y="468" font-size="17" text-anchor="middle">stdlib http.server</text>
  <text x="985" y="235" font-size="24" text-anchor="middle">index.html</text>
  <text x="985" y="262" font-size="17" text-anchor="middle">plain JS, SVG hexagons</text>
  <text x="985" y="286" font-size="17" text-anchor="middle">6 tabs, no map library</text>
  <text x="985" y="415" font-size="24" text-anchor="middle">tests/test_h3.py</text>
  <text x="985" y="442" font-size="17" text-anchor="middle">recompute from data.py,</text>
  <text x="985" y="464" font-size="17" text-anchor="middle">index bits, ray casting</text>
  <text x="760" y="545" font-size="17" text-anchor="middle">dashed: tests call the REST API and compare against their own recount</text>
</svg>
