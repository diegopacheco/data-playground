services:
  cassandra:
    image: docker.io/library/cassandra:5.0.9
    container_name: p6-cassandra
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: p6
    ports:
      - "16042:9042"
    volumes:
      - p6-cassandra-data:/var/lib/cassandra
    networks:
      - p6-net

  redpanda:
    image: docker.io/redpandadata/redpanda:v26.2.2
    container_name: p6-redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --overprovisioned
      - --mode
      - dev-container
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:16092
      - --advertise-kafka-addr
      - internal://p6-redpanda:9092,external://localhost:16092
    ports:
      - "16092:16092"
    volumes:
      - p6-redpanda-data:/var/lib/redpanda/data
    networks:
      - p6-net

volumes:
  p6-cassandra-data:
    name: p6-cassandra-data
  p6-redpanda-data:
    name: p6-redpanda-data

networks:
  p6-net:
    name: p6-net
