<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TigerBeetle Ledger</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#1d2330;--muted:#6b7280;--line:#e5e7eb;--accent:#2f6fde;--ok:#1f9d55;--bad:#d64545}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:24px 32px;border-bottom:1px solid var(--line);background:var(--card)}
h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:24px 16px;display:grid;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{margin:0 0 14px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
svg text{font-size:12px;fill:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>TigerBeetle Ledger Ingest</h1>
<p>Orders posted as transfers from customer accounts to category revenue accounts, amounts in cents</p>
</header>
<main>
<section class="card">
<h2>Throughput run</h2>
<div class="stats" id="bench"></div>
</section>
<section class="card">
<h2>Category revenue account balances</h2>
<svg id="chart" width="100%" height="260"></svg>
<table id="categories"></table>
</section>
<section class="cols">
<div class="card"><h2>Order ingest</h2><div class="stats" id="ingest"></div></div>
<div class="card"><h2>Customer account debits</h2><table id="customers"></table></div>
</section>
</main>
<script>
const money = c => "$" + (c / 100).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const int = n => Number(n).toLocaleString("en-US");
const stat = (value, label, cls) => `<div class="stat"><b class="${cls || ""}">${value}</b><span>${label}</span></div>`;

function renderBench(b) {
  const el = document.getElementById("bench");
  if (!b) { el.innerHTML = stat("-", "throughput run not executed yet"); return; }
  el.innerHTML = stat(int(b.tps), "transfers / sec") + stat(int(b.transfers), "transfers") +
    stat(b.seconds.toFixed(3) + " s", "elapsed") + stat(int(b.batches) + " x " + int(b.batch_size), "batches x size") +
    stat(b.in_flight, "batches in flight") + stat(int(b.accounts), "accounts") +
    stat(b.verified ? "verified" : "mismatch", "credits delta equals amounts", b.verified ? "ok" : "bad");
}

function renderIngest(i) {
  const el = document.getElementById("ingest");
  if (!i) { el.innerHTML = stat("-", "ingest not executed yet"); return; }
  el.innerHTML = stat(int(i.orders), "orders in csv") + stat(int(i.created), "transfers created") +
    stat(int(i.existing), "already existed") + stat(i.batches, "batches") + stat((i.seconds * 1000).toFixed(1) + " ms", "elapsed");
}

function renderChart(rows) {
  const svg = document.getElementById("chart");
  const w = svg.clientWidth || 900, h = 260, left = 100, right = 110, bar = 26, gap = 12;
  const max = Math.max(1, ...rows.map(r => r.credits_cents));
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.innerHTML = rows.map((r, i) => {
    const y = 16 + i * (bar + gap), len = (w - left - right) * r.credits_cents / max;
    return `<text x="${left - 10}" y="${y + 17}" text-anchor="end">${r.category}</text>` +
      `<rect x="${left}" y="${y}" width="${len}" height="${bar}" rx="4" fill="#2f6fde" opacity="0.85"></rect>` +
      `<text x="${left + len + 8}" y="${y + 17}">${money(r.credits_cents)}</text>`;
  }).join("");
}

function renderCategories(rows) {
  const sorted = [...rows].sort((a, b) => b.credits_cents - a.credits_cents);
  renderChart(sorted);
  const total = rows.reduce((s, r) => s + r.credits_cents, 0);
  document.getElementById("categories").innerHTML =
    `<tr><th>Category</th><th>Account id</th><th class="num">Orders</th><th class="num">Credits posted (cents)</th><th class="num">Balance</th></tr>` +
    sorted.map(r => `<tr><td>${r.category}</td><td>${r.account_id}</td><td class="num">${r.orders}</td><td class="num">${int(r.credits_cents)}</td><td class="num">${money(r.credits_cents)}</td></tr>`).join("") +
    `<tr><th>Total</th><th></th><th class="num">${rows.reduce((s, r) => s + r.orders, 0)}</th><th class="num">${int(total)}</th><th class="num">${money(total)}</th></tr>`;
}

function renderCustomers(rows) {
  const sorted = [...rows].sort((a, b) => b.debits_cents - a.debits_cents);
  document.getElementById("customers").innerHTML =
    `<tr><th>Customer</th><th class="num">Orders</th><th class="num">Debits posted</th></tr>` +
    sorted.map(r => `<tr><td>${r.customer}</td><td class="num">${r.orders}</td><td class="num">${money(r.debits_cents)}</td></tr>`).join("");
}

async function load() {
  const get = p => fetch(p).then(r => r.json());
  const [bench, ingest, categories, customers] = await Promise.all([get("/api/bench"), get("/api/ingest"), get("/api/categories"), get("/api/customers")]);
  renderBench(bench);
  renderIngest(ingest);
  renderCategories(categories);
  renderCustomers(customers);
}
load();
</script>
</body>
</html>
