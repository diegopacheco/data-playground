<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <defs>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="400">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2937; }
      .title { font-size: 26px; font-weight: 700; }
      .note { font-size: 19px; }
      .box { stroke: #374151; stroke-width: 2.2; filter: url(#wobble); }
      .flow { stroke: #374151; stroke-width: 2.4; fill: none; marker-end: url(#arrow); filter: url(#wobble); }
    </style>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>

  <rect class="box" x="30" y="50" width="160" height="90" rx="14" fill="#fde2e4"/>
  <text class="title" x="110" y="88" text-anchor="middle">orders.csv</text>
  <text class="note" x="110" y="116" text-anchor="middle">200 rows</text>

  <rect class="box" x="250" y="50" width="200" height="90" rx="14" fill="#e2ece9"/>
  <text class="title" x="350" y="88" text-anchor="middle">Ingest (Java 25)</text>
  <text class="note" x="350" y="116" text-anchor="middle">customer -&gt; category</text>

  <rect class="box" x="250" y="250" width="200" height="90" rx="14" fill="#e2ece9"/>
  <text class="title" x="350" y="288" text-anchor="middle">Bench (Java 25)</text>
  <text class="note" x="350" y="316" text-anchor="middle">1M transfers, ledger 2</text>

  <rect class="box" x="520" y="140" width="210" height="110" rx="14" fill="#fff1c1"/>
  <text class="title" x="625" y="180" text-anchor="middle">TigerBeetle 0.17.9</text>
  <text class="note" x="625" y="208" text-anchor="middle">single replica, podman</text>
  <text class="note" x="625" y="232" text-anchor="middle">batches of 8189</text>

  <rect class="box" x="800" y="140" width="170" height="110" rx="14" fill="#dbe7fb"/>
  <text class="title" x="885" y="180" text-anchor="middle">UiServer</text>
  <text class="note" x="885" y="208" text-anchor="middle">/api/* + index.html</text>
  <text class="note" x="885" y="232" text-anchor="middle">lookup balances</text>

  <path class="flow" d="M190,95 L246,95"/>
  <path class="flow" d="M450,95 C490,95 500,150 516,170"/>
  <path class="flow" d="M450,295 C490,295 500,240 516,222"/>
  <path class="flow" d="M796,195 L734,195"/>
  <text class="note" x="765" y="185" text-anchor="middle">read</text>
  <text class="note" x="505" y="112">create_transfers</text>
  <path class="flow" d="M450,318 C640,380 880,340 885,254"/>
  <text class="note" x="660" y="372" text-anchor="middle">bench.json (throughput)</text>
</svg>
