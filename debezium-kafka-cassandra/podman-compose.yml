name: i19-debezium

services:
  mysql:
    image: docker.io/library/mysql:26.7.0
    container_name: i19-mysql
    command: ["--binlog-format=ROW", "--binlog-row-image=FULL", "--server-id=1", "--log-bin=mysql-bin", "--innodb-buffer-pool-size=64M", "--performance-schema=OFF", "--secure-file-priv="]
    ports:
      - "21906:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z
      - ./data/orders.csv:/docker-entrypoint-initdb.d/orders.csv:ro,Z
    networks:
      - i19-net

  kafka:
    image: docker.io/apache/kafka:4.3.1
    container_name: i19-kafka
    ports:
      - "21992:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:21992,INTERNAL://i19-kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
    networks:
      - i19-net

  connect:
    image: quay.io/debezium/connect:3.6.3.Final
    container_name: i19-connect
    depends_on:
      - kafka
    ports:
      - "21983:8083"
    environment:
      BOOTSTRAP_SERVERS: i19-kafka:29092
      GROUP_ID: i19-connect
      CONFIG_STORAGE_TOPIC: i19_connect_configs
      OFFSET_STORAGE_TOPIC: i19_connect_offsets
      STATUS_STORAGE_TOPIC: i19_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: "-Xms128m -Xmx384m -XX:ReservedCodeCacheSize=64m"
    networks:
      - i19-net

  cassandra:
    image: docker.io/library/cassandra:5.0.9
    container_name: i19-cassandra
    ports:
      - "21942:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: i19-cluster
    networks:
      - i19-net

networks:
  i19-net:
    name: i19-net
