<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2933; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
  </defs>
  <rect width="1100" height="520" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1f2933" stroke-width="2">
    <rect x="30" y="150" width="240" height="150" rx="10" fill="#d0ebff"/>
    <rect x="390" y="150" width="270" height="150" rx="10" fill="#fcc2d7"/>
    <rect x="790" y="60" width="280" height="130" rx="10" fill="#ffd8a8"/>
    <rect x="790" y="270" width="280" height="90" rx="10" fill="#fff3bf"/>
    <rect x="790" y="410" width="280" height="80" rx="10" fill="#e5dbff"/>
    <rect x="390" y="390" width="270" height="100" rx="10" fill="#d3f9d8"/>
    <rect x="30" y="390" width="240" height="100" rx="10" fill="#f1f3f5"/>
    <line x1="387" y1="200" x2="273" y2="200" marker-end="url(#arrow)"/>
    <line x1="660" y1="190" x2="787" y2="140" marker-end="url(#arrow)"/>
    <line x1="930" y1="190" x2="930" y2="267" marker-end="url(#arrow)"/>
    <path d="M820,190 L730,350 L220,350 L220,304" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <line x1="525" y1="387" x2="525" y2="303" marker-end="url(#arrow)"/>
    <line x1="120" y1="387" x2="120" y2="303" marker-end="url(#arrow)"/>
  </g>
  <text x="550" y="42" font-size="34" font-weight="700" text-anchor="middle">openmetadata-discovery</text>
  <text x="550" y="74" font-size="20" text-anchor="middle">Postgres metadata into OpenMetadata, curated and verified</text>
  <text x="150" y="182" font-size="24" text-anchor="middle">r14-postgres 18.6</text>
  <text x="150" y="208" font-size="17" text-anchor="middle">db shop: raw + analytics</text>
  <text x="150" y="232" font-size="17" text-anchor="middle">4 tables, 3 views, 1 batch table</text>
  <text x="150" y="256" font-size="17" text-anchor="middle">COMMENT ON everything</text>
  <text x="150" y="280" font-size="17" text-anchor="middle">+ openmetadata_db</text>
  <text x="525" y="180" font-size="24" text-anchor="middle">r14-app (Python 3.14)</text>
  <text x="525" y="206" font-size="17" text-anchor="middle">openmetadata-ingestion 2.0.2</text>
  <text x="525" y="230" font-size="17" text-anchor="middle">metadata + view lineage workflows</text>
  <text x="525" y="254" font-size="17" text-anchor="middle">curation.json: tags, glossary,</text>
  <text x="525" y="278" font-size="17" text-anchor="middle">owners, manual lineage via REST</text>
  <text x="330" y="190" font-size="16" text-anchor="middle">reads catalogs</text>
  <text x="725" y="150" font-size="16" text-anchor="middle">REST + JWT</text>
  <text x="930" y="95" font-size="24" text-anchor="middle">r14-openmetadata 2.0.2</text>
  <text x="930" y="122" font-size="17" text-anchor="middle">catalog REST API + web UI</text>
  <text x="930" y="146" font-size="17" text-anchor="middle">heap 768 MB, limit 1536 MB</text>
  <text x="930" y="170" font-size="17" text-anchor="middle">port 27901</text>
  <text x="930" y="305" font-size="24" text-anchor="middle">r14-elasticsearch 9.5.3</text>
  <text x="930" y="332" font-size="17" text-anchor="middle">search index, heap 384 MB</text>
  <text x="470" y="340" font-size="16" text-anchor="middle">server stores entities in openmetadata_db</text>
  <text x="930" y="442" font-size="24" text-anchor="middle">r14-migrate</text>
  <text x="930" y="468" font-size="17" text-anchor="middle">runs first: migrates openmetadata_db</text>
  <text x="525" y="422" font-size="24" text-anchor="middle">Browser</text>
  <text x="525" y="448" font-size="17" text-anchor="middle">app UI on 27900: 6 tabs</text>
  <text x="525" y="472" font-size="17" text-anchor="middle">link to OpenMetadata UI</text>
  <text x="150" y="425" font-size="24" text-anchor="middle">tests/test_catalog.py</text>
  <text x="150" y="452" font-size="17" text-anchor="middle">pg_catalog + curation.json</text>
  <text x="150" y="476" font-size="17" text-anchor="middle">vs catalog REST + search</text>
</svg>
